<title>Night Ops Arena</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: full-screen canvas arena; HUD pinned to the corners; briefing panels float over the live yard */
:root {
  --night: #0b0f12;
  --panel: rgba(12, 16, 18, 0.8);
  --line: rgba(230, 225, 211, 0.16);
  --text: #e7e2d4;
  --muted: #8e968c;
  --amber: #f2b134;
  --hp: #d8453a;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --mono: "Share Tech Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--text);
  font-family: var(--display);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
#game { position: fixed; inset: 0; display: block; touch-action: none; }

.hud {
  position: fixed; inset: 0; pointer-events: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; justify-content: space-between;
}
.hud-top, .hud-bottom { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hud-top { align-items: flex-start; }
.hud-bottom { align-items: flex-end; }
.chip {
  background: var(--panel); border: 1px solid var(--line);
  padding: 8px 12px; display: flex; flex-direction: column; gap: 4px;
}
.label {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--muted);
}
.vitals .row { display: flex; align-items: center; gap: 8px; }
.bar { width: clamp(100px, 22vw, 200px); height: 10px; background: rgba(230, 225, 211, 0.1); }
.bar i { display: block; height: 100%; width: 100%; background: var(--hp); transition: width 0.15s; }
.bar i.low { animation: pulse 0.6s infinite alternate; }
@keyframes pulse { to { opacity: 0.45; } }
.num { font-family: var(--mono); font-size: 18px; font-variant-numeric: tabular-nums; }
.wave { align-items: center; text-align: center; }
.wave b { font-size: 28px; line-height: 1; font-weight: 700; }
.right { display: flex; gap: 8px; align-items: flex-start; }
.score { align-items: flex-end; text-align: right; }
.score b { font-family: var(--mono); font-size: 22px; font-weight: 400; line-height: 1; font-variant-numeric: tabular-nums; }
.btn-s {
  pointer-events: auto; font: 600 12px var(--display); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text); background: var(--panel); border: 1px solid var(--line); padding: 8px 10px; cursor: pointer;
}
.btn-s:hover { border-color: var(--amber); }
.ammo { align-items: flex-end; min-width: 120px; }
.ammo .count { display: flex; align-items: baseline; gap: 6px; }
.ammo .mag { font-family: var(--mono); font-size: 40px; line-height: 1; color: var(--amber); font-variant-numeric: tabular-nums; }
.ammo.empty .mag { color: var(--hp); }
.rbar { width: 100%; height: 4px; background: rgba(230, 225, 211, 0.1); }
.rbar i { display: block; height: 100%; width: 0; background: var(--amber); }
.kills { align-items: flex-start; }
.touch-only { display: none; }
body.touch .touch-only { display: inline-flex; }
body.touch .desk-only { display: none; }
#reloadBtn { align-self: flex-end; padding: 12px 16px; font-size: 14px; }

.banner {
  position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%);
  text-align: center; pointer-events: none; display: flex; flex-direction: column; gap: 4px;
  max-width: calc(100% - 32px);
}
.banner b { font-size: clamp(30px, 7vw, 54px); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; text-wrap: balance; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8); }
.banner span { font-family: var(--mono); color: var(--amber); letter-spacing: 0.14em; text-transform: uppercase; font-size: 14px; }

.overlay {
  position: fixed; inset: 0; display: grid; place-items: center; overflow: auto;
  background: rgba(5, 7, 9, 0.6); backdrop-filter: blur(2px);
  padding-block: calc(env(safe-area-inset-top, 0px) + 24px) calc(env(safe-area-inset-bottom, 0px) + 24px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brief {
  position: relative; width: min(100%, 520px); background: var(--panel); border: 1px solid var(--line);
  padding: 28px 26px; display: flex; flex-direction: column; gap: 16px;
}
.brief::before, .brief::after {
  content: ""; position: absolute; width: 18px; height: 18px; border: 2px solid var(--amber);
}
.brief::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
.brief::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }
.eyebrow { margin: 0; font-family: var(--mono); color: var(--amber); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; }
.brief h1 { margin: 0; font-size: clamp(40px, 10vw, 68px); line-height: 0.95; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; text-wrap: balance; }
.lede { margin: 0; color: var(--text); opacity: 0.85; font-size: 16px; line-height: 1.5; max-width: 60ch; }
.keys { margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px 16px; }
.keys div { display: flex; align-items: center; gap: 10px; }
.keys dt { display: flex; gap: 3px; font-family: var(--mono); font-size: 13px; color: var(--text); }
.keys dd { margin: 0; color: var(--muted); font-size: 14px; }
kbd {
  font-family: var(--mono); font-size: 12px; min-width: 22px; text-align: center;
  padding: 2px 5px; border: 1px solid var(--line); border-bottom-width: 2px; color: var(--text);
}
.note { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.stats div { display: flex; flex-direction: column; gap: 2px; }
.stats b { font-family: var(--mono); font-size: 26px; font-weight: 400; font-variant-numeric: tabular-nums; }
.newbest { color: var(--amber); }
.wallet { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border: 1px solid var(--line); padding: 10px 14px; }
.wallet b { font-family: var(--mono); font-size: 28px; font-weight: 400; color: var(--amber); font-variant-numeric: tabular-nums; }
.shop-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.shop-list li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; border-top: 1px solid var(--line); }
.info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.info b { font-size: 16px; font-weight: 600; }
.pips { display: flex; gap: 3px; }
.pips i { width: 14px; height: 5px; background: rgba(230, 225, 211, 0.15); }
.pips i.on { background: var(--amber); }
.buy {
  flex: none; font: 14px var(--mono); min-width: 88px; background: transparent; border: 1px solid var(--amber);
  color: var(--amber); padding: 8px 12px; cursor: pointer; font-variant-numeric: tabular-nums;
}
.buy:hover:not(:disabled) { background: rgba(242, 177, 52, 0.12); }
.buy:disabled { border-color: var(--line); color: var(--muted); cursor: default; }
.brief.wide { width: min(100%, 760px); }
.field {
  font: 15px var(--display); color: var(--text); background: rgba(230, 225, 211, 0.05); border: 1px solid var(--line);
  padding: 9px 10px; min-width: 0; flex: 1; user-select: text; -webkit-user-select: text;
}
.field:focus { outline: 2px solid var(--amber); outline-offset: 1px; }
textarea.field { width: 100%; resize: vertical; font: 12px var(--mono); }
.row2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.frrow { display: flex; flex-direction: column; gap: 6px; }
.frlist li { justify-content: flex-start; }
.frlist .info { flex: 1; }
.frnote { overflow-wrap: anywhere; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(230, 225, 211, 0.2); flex: none; }
.dot.on { background: #5ad16b; box-shadow: 0 0 6px #5ad16b; }
details summary { cursor: pointer; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 12px);
  max-width: calc(100% - 32px); background: var(--panel); border: 1px solid var(--amber); padding: 10px 12px;
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap; backdrop-filter: blur(4px);
}
.toast span { overflow-wrap: anywhere; }
.mastchip { min-width: 190px; }
.mastchip .rbar { margin-bottom: 3px; }
@media (max-width: 560px) { .mastchip { display: none; } }
.board { width: 100%; border-collapse: collapse; font-size: 14px; }
.board th { text-align: left; font: 11px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); }
.board td { padding: 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.board td.n { font-family: var(--mono); text-align: right; }
.board th.n { text-align: right; }
.board tr.me td { color: var(--amber); }
.board .who { overflow-wrap: anywhere; }
.boardwrap { overflow-x: auto; }
.mastery { display: flex; flex-direction: column; gap: 6px; }
.mhead { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.ranks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--muted); }
.ranks li { opacity: 0.55; }
.ranks li.on { opacity: 1; color: var(--text); }
.ranks span { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; margin-right: 6px; }
.rk { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
.startpick { display: flex; flex-direction: column; gap: 8px; }
.startpick .row { display: flex; align-items: center; gap: 12px; }
.startpick input { flex: 1; min-width: 0; accent-color: var(--amber); }
.startpick b { font-family: var(--mono); font-size: 26px; font-weight: 400; color: var(--amber); min-width: 2.5ch; text-align: right; font-variant-numeric: tabular-nums; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tab {
  font: 600 13px var(--display); letter-spacing: 0.1em; text-transform: uppercase; background: transparent; color: var(--muted);
  border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 10px 14px; cursor: pointer;
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--amber); border-bottom-color: var(--amber); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.card { border: 1px solid var(--line); background: rgba(230, 225, 211, 0.03); padding: 12px; display: flex; flex-direction: column; gap: 10px; justify-content: space-between; }
.card.maxed { border-color: rgba(242, 177, 52, 0.45); background: rgba(242, 177, 52, 0.05); }
.card .buy { width: 100%; }
.card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.lvl { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; color: var(--amber); flex: none; }
.shop-list.cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); column-gap: 24px; }
.loadout { display: flex; flex-direction: column; gap: 10px; }
.guns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.gun {
  font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line);
  padding: 8px 10px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow-wrap: anywhere;
}
.gun b { font-size: 15px; font-weight: 600; }
.gun:hover { border-color: var(--amber); }
.gun[aria-pressed="true"] { border-color: var(--amber); background: rgba(242, 177, 52, 0.1); }
.gun[aria-pressed="true"] b { color: var(--amber); }
.gstats { margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 16px; }
.gstats div { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.gstats dt { font-size: 13px; color: var(--muted); }
.gstats dd { margin: 0; }
.sbar { display: flex; gap: 2px; }
.sbar i { width: 12px; height: 6px; background: rgba(230, 225, 211, 0.15); }
.sbar i.on { background: var(--amber); }
@media (max-width: 420px) { .guns { grid-template-columns: repeat(2, 1fr); } }
.bossbar {
  position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 96px);
  width: min(520px, calc(100% - 32px)); pointer-events: none; display: flex; flex-direction: column; gap: 4px;
}
.bb-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.bb-head b { font-size: 18px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8); min-width: 0; overflow-wrap: anywhere; }
.bb-track { height: 10px; background: rgba(12, 16, 18, 0.85); border: 1px solid var(--line); }
.bb-track i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #e58aa0, var(--hp)); }
@media (max-width: 520px) { .bossbar { top: calc(env(safe-area-inset-top, 0px) + 150px); } }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.cta {
  font: 700 16px var(--display); letter-spacing: 0.14em; text-transform: uppercase;
  background: var(--amber); color: #15120a; border: 0; padding: 12px 26px; cursor: pointer;
}
.cta:hover { filter: brightness(1.08); }
.ghost {
  font: 600 14px var(--display); letter-spacing: 0.1em; text-transform: uppercase;
  background: transparent; color: var(--text); border: 1px solid var(--line); padding: 12px 18px; cursor: pointer;
}
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
@media (max-width: 520px) {
  .wave b { font-size: 22px; }
  .ammo .mag { font-size: 32px; }
  .brief { padding: 22px 18px; }
}
@media (prefers-reduced-motion: reduce) {
  .bar i.low { animation: none; }
}
</style>

<canvas id="game" aria-label="Game arena"></canvas>

<div class="hud" id="hud">
  <div class="hud-top">
    <div class="chip vitals">
      <span class="label">Health</span>
      <div class="row"><div class="bar"><i id="hpFill"></i></div><span class="num" id="hpNum">100</span></div>
    </div>
    <div class="chip wave">
      <span class="label" id="waveLabel">Wave</span>
      <b id="waveNum">1</b>
      <span class="label" id="hostiles">0 hostiles</span>
    </div>
    <div class="right">
      <div class="chip score">
        <span class="label">Score</span>
        <b id="score">0</b>
        <span class="label">Best <span id="best">0</span></span>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <button type="button" class="btn-s" id="pauseBtn">Pause</button>
        <button type="button" class="btn-s" id="muteBtn">Sound on</button>
      </div>
    </div>
  </div>
  <div class="hud-bottom">
    <div style="display:flex;gap:8px;align-items:flex-end">

      </div>
      <div class="chip mastchip">
        <span class="label" id="mPl"></span><div class="rbar"><i id="mPlFill"></i></div>
        <span class="label" id="mGun"></span><div class="rbar"><i id="mGunFill"></i></div>
        <span class="label" id="mMel"></span><div class="rbar"><i id="mMelFill"></i></div>

    </div>
    <div style="display:flex;gap:6px;align-self:flex-end">
      <button type="button" class="btn-s touch-only" id="specialBtn" style="padding:12px 16px;font-size:14px">Special</button>
      <button type="button" class="btn-s touch-only" id="swapBtn" style="padding:12px 16px;font-size:14px">Swap</button>
      <button type="button" class="btn-s touch-only" id="reloadBtn">Reload</button>
    </div>
    <div class="chip ammo" id="ammo">

    </div>
  </div>
</div>

<div class="bossbar" id="bossBar" hidden>
  <div class="bb-head"><b id="bossName"></b><span class="label" id="bossTitle"></span></div>
  <div class="bb-track"><i id="bossFill"></i></div>
</div>

<div class="banner" id="banner" hidden><b id="bannerTitle"></b><span id="bannerSub"></span></div>

<div class="overlay" id="overlay"></div>

<div class="toast" id="toast" hidden></div>

<script>
(() => {

    wave() { tone(330, 0.3, 'triangle', 0.25, 660); },
    eshot() { tone(520, 0.06, 'square', 0.08, 260); },
    boom() { noise(0.35, 250, 0.8, 0.6); },
    boss() { noise(0.6, 300, 0.8, 0.8); tone(90, 0.6, 'sawtooth', 0.3, 40); },

  function toggleMute() {
    muted = !muted;

    ui.mute.textContent = muted ? 'Sound off' : 'Sound on';
  }

  // ---------- input ----------
  const keys = {};
  const mouse = { x: 0, y: 0, down: false, seen: false };
  const touch = { move: null, aim: null };
  let touchMode = false;
  function setTouch(on) {
    if (touchMode === on) return;

  }
  function stick(s) {
    let x = (s.x - s.ox) / 60, y = (s.y - s.oy) / 60;

    return { x, y };
  }

  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    // typing a nickname or friend code shouldn't move, pause or start anything
    const tag = e.target && e.target.tagName;
    if (tag === 'TEXTAREA' || (tag === 'INPUT' && e.target.type !== 'range')) {
      if (k === 'enter' && e.target.id === 'frAdd') frAdd(e.target.value);
      if (k === 'enter' && e.target.id === 'frName') { const b = document.querySelector('[data-fr="name"]'); if (b) b.click(); }
      return;
    }
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k) && e.target.tagName !== 'INPUT') e.preventDefault();
    if (e.repeat) return;
    keys[k] = true;

    if (k === 'q') swapWeapon();
    if (k === 'e') special();
    if (k === 'p' || k === 'escape') togglePause();
    if (k === 'm') toggleMute();
    if (k === 'enter' && G.state === 'title' && loadRun()) { G = normalize(loadRun()); paintFloor(); showOverlay(G.state); }
    else if ((k === 'enter') && (G.state === 'title' || G.state === 'over' || G.state === 'won')) startGame(G.state === 'over' && G.endless);
  });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; if (G.state === 'playing') pause(); });

  cv.addEventListener('pointerdown', e => {

    } else {
      setTouch(false);
      if (e.button === 0) mouse.down = true;

  cv.addEventListener('pointercancel', endPointer);

  // ---------- view ----------
  let vw = 0, vh = 0, scale = 1, dpr = 1;
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    vw = innerWidth; vh = innerHeight;
    cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
    cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
    scale = clamp(Math.min(vw, vh) / 720, 0.55, 1);
  }
  addEventListener('resize', resize);
  resize();
  function cam() {
    const p = G.player, viewW = vw / scale, viewH = vh / scale;
    return {
      x: viewW >= W ? (W - viewW) / 2 : clamp(p.x - viewW / 2, 0, W - viewW),
      y: viewH >= H ? (H - viewH) / 2 : clamp(p.y - viewH / 2, 0, H - viewH)
    };
  }

  // ---------- game logic ----------
  function addPart(o) { G.parts.push(o); if (G.parts.length > 500) G.parts.shift(); }
  function blood(x, y, dx, dy, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.atan2(dy, dx) + rand(-0.8, 0.8), s = rand(60, 220);
      addPart({ k: 'blood', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.3, 0.6), max: 0.6, size: rand(1.5, 3.5), drag: 6 });
    }
  }
  function sparks(x, y, dx, dy) {
    for (let i = 0; i < 6; i++) {
      const a = Math.atan2(-dy, -dx) + rand(-1, 1), s = rand(120, 320);
      addPart({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.12, 0.25), max: 0.25, drag: 8 });
    }
  }
  function floatText(x, y, text, color) {
    addPart({ k: 'text', x, y, vx: 0, vy: -40, life: 1, max: 1, text, color, drag: 0 });
  }
  // tells you once in a while that this hostile ignores what you're hitting it with
  function immuneTip(e, text) {
    if (e.tip > 0) return;
    e.tip = 1.2;
    floatText(e.x, e.y - e.r - 8, text, '#9fd3ff');
  }

  function tryReload() {
    const p = G.player;
    if (G.state !== 'playing' || p.melee || p.reload > 0 || p.mag === magSize() || p.res === 0) return;
    p.reload = reloadTime();
    SFX.reload();
  }

  function swapWeapon() {
    const p = G.player;
    if (G.state !== 'playing') return;
    if (p.melee) {
      if (p.mag + p.res === 0) { floatText(p.x, p.y - 26, 'No ammo', '#d8453a'); SFX.dry(); return; }
      p.melee = false;
    } else { p.melee = true; p.reload = 0; }
    p.cool = 0.2; p.swing = 0;
    SFX.swap();
  }

  const meleeDmg = () => meleeDef().dmg * (1 + lvl('dmg')) * (1 + 0.35 * lvl('k_edge')) * overdrive();

  // hits everything in an arc in front of you, and anything standing inside you
  function meleeStrike(arc, range, dmg) {
    const p = G.player, m = meleeDef();
    const fx = { bleed: lvl('x_mbleed'), stun: 0.25 * lvl('x_bstun') };
    let hits = 0;
    for (const e of G.enemies) {
      if (e.dead) continue;
      const dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy);
      if (d > range + e.r) continue;
      let da = Math.atan2(dy, dx) - p.a;
      da = Math.atan2(Math.sin(da), Math.cos(da));
      if (Math.abs(da) > arc / 2 && d > e.r + p.r) continue;
      if (meleeProof(e)) { sparks(e.x, e.y, dx, dy); immuneTip(e, 'GUNS ONLY'); continue; }
      const crit = Math.random() < critChance();
      damage(e, { vx: dx || 0.01, vy: dy, dmg: crit ? dmg * 2 : dmg, crit, kb: m.kb, melee: true, ...fx });
      hits++;
    }
    // the scythe drinks a little from everything it cuts, capped per swing
    if (m.scythe && hits) p.hp = Math.min(p.maxHp, p.hp + Math.min(2, 0.5 * hits));
    return hits;
  }

  // thrown knives, slash waves and crescents fly like bullets but count as melee
  function meleeShot(k, speed, life, dmg, pierce) {
    const p = G.player, ca = Math.cos(p.a), sa = Math.sin(p.a), x = p.x + ca * 18, y = p.y + sa * 18;
    G.bullets.push({ x, y, px: x, py: y, vx: ca * speed, vy: sa * speed, life, dmg, pierce, hits: [], w: 3, melee: true, k });
  }

  function shockwave(x, y, max, dmg) {
    G.waves.push({ x, y, r: 8, max, dmg, hit: [] });
    if (!reduceMotion) G.shake = Math.min(14, G.shake + max / 30);
    SFX.boom();
  }

  function deflect(arc, range, dmg) {
    const p = G.player;
    for (let i = G.shots.length - 1; i >= 0; i--) {
      const s = G.shots[i];
      if (s.k !== 'orb') continue;
      const dx = s.x - p.x, dy = s.y - p.y;
      if (Math.hypot(dx, dy) > range + s.r) continue;
      let da = Math.atan2(dy, dx) - p.a;
      da = Math.atan2(Math.sin(da), Math.cos(da));
      if (Math.abs(da) > arc / 2) continue;
      G.shots.splice(i, 1);
      sparks(s.x, s.y, -dx, -dy);
      if (lvl('x_bdeflect') >= 2) {
        G.bullets.push({ x: s.x, y: s.y, px: s.x, py: s.y, vx: Math.cos(p.a) * 700, vy: Math.sin(p.a) * 700,
          life: 1, dmg: dmg * 0.6, pierce: 0, hits: [], w: 3, melee: true, k: 'ball' });
      }
    }
  }

  function swing() {
    const p = G.player, m = meleeDef();
    p.cool = meleeRate(); p.swing = swingTime(); p.swingDir = -(p.swingDir || 1);
    let dmg = meleeDmg();
    if (lvl('x_kflurry')) {
      p.stabN = (p.stabN || 0) + 1;
      if (p.stabN % 3 === 0) dmg *= 1.5 + 0.5 * lvl('x_kflurry');
    }
    if (lvl('x_tiaido') && (p.idle || 0) >= 1.2) { dmg *= 1.5 + 0.5 * lvl('x_tiaido'); floatText(p.x, p.y - 26, 'IAIDO', '#ffe2a0'); }
    p.idle = 0;
    const range = meleeRange(), hits = meleeStrike(m.arc, range, dmg);
    const ca = Math.cos(p.a), sa = Math.sin(p.a);
    if (lvl('x_mwave')) meleeShot('slash', 620, 0.35, dmg * (0.5 + 0.15 * lvl('x_mwave')), 3);
    if (lvl('x_ymoon')) meleeShot('moon', 520, 0.6, dmg * (0.4 + 0.2 * lvl('x_ymoon')), 4);
    if (lvl('x_safter') && hits) shockwave(p.x + ca * range * 0.6, p.y + sa * range * 0.6, 60 + 20 * lvl('x_safter'), dmg * 0.4);
    if (lvl('x_bdeflect')) deflect(m.arc, range, dmg);
    if (!reduceMotion) G.shake = Math.min(G.shake + 1.5 + m.kb * 0.6, 10);
    SFX.swing();
  }

  // melee specials, unlocked by each weapon's mastery upgrade
  const SPECIALS = {
    knife: { up: 'x_kthrow', name: 'Throwing knife', cd: l => 1.6 - 0.3 * l,
      run: l => { meleeShot('knife', 900, 0.6, meleeDmg() * (1.2 + 0.3 * l), 0); SFX.swing(); } },
    katana: { up: 'x_tdash', name: 'Dash slash', cd: l => 3 - 0.5 * l, run: l => dashSlash(l) },
    sledge: { up: 'x_spound', name: 'Ground pound', cd: l => 4.5 - 0.5 * l,
      run: l => { const p = G.player; p.swing = swingTime(); shockwave(p.x, p.y, 180 + 30 * l, meleeDmg() * (0.9 + 0.2 * l)); } },
    scythe: { up: 'x_yspin', name: 'Reaping spin', cd: l => 3 - 0.4 * l,
      run: l => { G.player.spinFx = 0.3; meleeStrike(Math.PI * 2, meleeRange() * 1.2, meleeDmg() * (1.2 + 0.15 * l)); SFX.swing(); } }
  };
  const specialDef = () => { const s = SPECIALS[G.melee]; return s && lvl(s.up) ? s : null; };
  function special() {
    const p = G.player, s = specialDef();
    if (G.state !== 'playing' || !p.melee || !s || (p.spCool || 0) > 0) return;
    s.run(lvl(s.up));
    p.spCool = s.cd(lvl(s.up));
  }

  function dashSlash(l) {
    const p = G.player, m = meleeDef(), ca = Math.cos(p.a), sa = Math.sin(p.a), x0 = p.x, y0 = p.y;
    let x = p.x, y = p.y;
    for (let i = 0; i < 16; i++) {
      const nx = clamp(x + ca * 11, p.r, W - p.r), ny = clamp(y + sa * 11, p.r, H - p.r);
      if (blocked(nx, ny, p.r)) break;
      x = nx; y = ny;
      if (i % 3 === 0) addPart({ k: 'ring', x, y, r: 18, life: 0.25, max: 0.25, vx: 0, vy: 0, drag: 0, color: '#ffe2a0' });
    }
    const dmg = meleeDmg() * (1.6 + 0.4 * l), sx = x - x0, sy = y - y0, len2 = sx * sx + sy * sy || 1;
    for (const e of G.enemies) {
      if (e.dead) continue;
      const t = clamp(((e.x - x0) * sx + (e.y - y0) * sy) / len2, 0, 1);
      if (Math.hypot(e.x - (x0 + sx * t), e.y - (y0 + sy * t)) > e.r + p.r + 14) continue;
      if (meleeProof(e)) { immuneTip(e, 'GUNS ONLY'); continue; }
      damage(e, { vx: ca, vy: sa, dmg, kb: m.kb, melee: true });
    }
    p.x = x; p.y = y; p.iframe = 0.25; p.swing = swingTime();
    SFX.swing();
  }

  function shoot() {
    const p = G.player, g = gunDef(), ca = Math.cos(p.a), sa = Math.sin(p.a);
    const last = p.mag === 1;
    if (Math.random() >= ammoSave()) p.mag--;
    p.cool = fireTime(); p.flash = 0.05;
    if (Math.random() < 0.15 * lvl('x_hfan')) p.cool = 0.06;
    const tip = g.len + 4, tx = p.x + ca * tip - sa * 6, ty = p.y + sa * tip + ca * 6;
    const n = pelletCount(), spread = g.spread * spreadMul(), multi = n > 1;
    const big = last && lastMul() > 1, dmg = bulletDmg() * (big ? lastMul() : 1);
    // gun mastery effects ride along on every bullet
    p.shotN = (p.shotN || 0) + 1;
    const fx = { burn: lvl('x_gfire') + (lvl('x_lburn') && p.shotN % 4 === 0 ? 1.5 * lvl('x_lburn') : 0),
      chill: 0.15 * lvl('x_schill'), exec: lvl('x_hexec'), overpen: lvl('x_mover'), bounce: lvl('x_cric') };
    const extra = Math.random() < 0.15 * lvl('x_cdouble') ? 1 : 0;
    for (let i = 0; i < n + extra; i++) {
      const a = p.a + rand(-spread / 2, spread / 2) + (i >= n ? rand(-0.06, 0.06) : 0), sp = g.speed * (multi ? rand(0.85, 1.1) : 1);
      const crit = Math.random() < critChance() + 0.1 * lvl('x_mhead');
      G.bullets.push({ x: tx, y: ty, px: tx, py: ty, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: g.life * rangeMul() * (multi ? rand(0.8, 1.1) : 1), dmg: crit ? dmg * 2 : dmg, crit,
        pierce: g.pierce + pierceBonus(), hits: [], w: g.tracer * (crit || big ? 1.6 : 1), boom: blastRadius(), ...fx });
    }
    if (!reduceMotion) G.shake = Math.min(G.shake + g.shake, 12);
    const es = rand(90, 150);
    addPart({ k: 'casing', x: p.x + ca * 14 - sa * 8, y: p.y + sa * 14 + ca * 8,
      vx: -sa * es + rand(-20, 20), vy: ca * es + rand(-20, 20), life: 2.5, max: 2.5, rot: rand(0, 6), vr: rand(-20, 20), drag: 5 });

  }

  function startWave(n) {
    G.wave = n;
    G.windUsed = false;
    const bossWave = n % 3 === 0;
    const total = bossWave ? 0 : Math.min(4 + n * 3, G.endless ? 90 : 70);
    G.queue = bossWave ? ['boss'] : [];
    const pp = n >= TYPES.plated.from ? 0.1 : 0, sp = n >= TYPES.spiker.from ? 0.1 : 0;
    for (let i = 0; i < total; i++) {
      const r = Math.random(), q = Math.random();
      const tp = n >= 3 ? Math.min(0.25, 0.1 + 0.02 * n) : 0, gp = n >= 4 ? 0.18 : 0;
      if (q < pp) G.queue.push('plated');
      else if (q < pp + sp) G.queue.push('spiker');
      else if (r < tp) G.queue.push('tank');
      else if (r < tp + gp) G.queue.push('gunner');
      else if (n >= 2 && r < tp + gp + 0.32) G.queue.push('runner');
      else G.queue.push('grunt');
    }
    G.spawnT = 1;
    if (bossWave) {
      const s = bossSlot(n), b = BOSSES[s.idx];
      G.banner = { title: bossName(b, s.loop), sub: `Wave ${n} boss · ${b.title}`, t: 2.6 };
    } else {
      const fresh = Object.values(TYPES).find(d => d.from === n);
      G.banner = fresh
        ? { title: `Wave ${n}`, sub: `New hostile: ${fresh.intro}`, t: 3.5 }
        : { title: `Wave ${n}`, sub: `${total} hostiles inbound`, t: 2 };
    }
    SFX.wave();
  }

  function spawn(type) {
    if (type === 'boss') { spawnBoss(); return; }
    const d = TYPES[type], p = G.player;
    let x, y, tries = 0;
    do {
      const side = Math.floor(Math.random() * 4), t = Math.random();
      if (side === 0) { x = t * W; y = d.r; }
      else if (side === 1) { x = W - d.r; y = t * H; }
      else if (side === 2) { x = t * W; y = H - d.r; }
      else { x = d.r; y = t * H; }
      tries++;
    } while (tries < 12 && Math.hypot(x - p.x, y - p.y) < 380);
    const hp = d.hp + (type === 'grunt' && G.wave >= 6 ? 1 : 0) + (type === 'tank' ? Math.floor(G.wave / 4) : 0)
      + Math.floor(extraWaves() / 4) * (type === 'tank' ? 2 : 1);
    G.enemies.push(makeEnemy(type, x, y, hp));
  }

  function makeEnemy(type, x, y, hp) {
    return { id: G.nextId++, type, x, y, r: type === 'boss' ? 0 : TYPES[type].r, hp, max: hp, a: 0, flash: 0, cool: 0.5,
      stuck: 0, detour: 0, side: Math.random() < 0.5 ? -1 : 1, step: rand(0, 6), fireT: rand(1.2, 2) };
  }

  function spawnBoss() {
    const { idx, loop } = bossSlot(G.wave), k = idx + 1, b = BOSSES[idx], p = G.player;
    const hp = Math.round((idx === BOSSES.length - 1 ? 3000 : (60 * k + 12 * k * k) * 1.25) * (1 + 0.6 * loop));
    const e = makeEnemy('boss', W / 2, p.y > H / 2 ? b.r + 20 : H - b.r - 20, hp);
    Object.assign(e, { r: b.r, boss: idx, loop, atkT: 2, atkI: 0, mode: null, phaseI: 0, phaseDmg: 0 });
    G.enemies.push(e);
  }

  function summon(e) {
    const n = 2 + Math.floor(e.boss / 2);
    for (let i = 0; i < n && G.enemies.length < 50; i++) {
      const a = (i / n) * Math.PI * 2;
      const type = e.boss >= 5 && i % 2 ? 'gunner' : (i % 2 ? 'runner' : 'grunt');
      const m = makeEnemy(type, clamp(e.x + Math.cos(a) * e.r * 1.8, 20, W - 20), clamp(e.y + Math.sin(a) * e.r * 1.8, 20, H - 20), TYPES[type].hp);
      pushOut(m, m.r);
      G.enemies.push(m);
      addPart({ k: 'ring', x: m.x, y: m.y, r: 26, life: 0.3, max: 0.3, vx: 0, vy: 0, drag: 0, color: BOSSES[e.boss].shot });
    }
  }

  function kill(e) {
    const d = defOf(e);
    e.dead = true;
    if (lvl('l_belt')) G.player.mag = Math.min(magSize(), G.player.mag + lvl('l_belt'));
    gainXp(e.meleeHit ? G.melee : G.gun, e.type === 'boss' ? 30 : e.type === 'tank' || e.type === 'plated' ? 3 : 1);
    const pts = Math.round((e.type === 'boss' ? d.pts * (1 + (e.loop || 0)) : d.pts * (1 + (G.wave - 1) * 0.15)) * (pRank() >= 8 ? 1.1 : 1));
    if (e.type === 'boss') {
      G.score += pts; G.kills++;
      G.shots = [];
      boom(e.x, e.y, 110, d.shot);
      for (let i = 0; i < 4; i++) stain(e.x + rand(-30, 30), e.y + rand(-30, 30), e.r);
      G.pickups.push({ type: 'ammo', x: e.x, y: e.y, t: 15 });
      G.banner = { title: `${bossName(d, e.loop)} defeated`, sub: `+${pts.toLocaleString()} points`, t: 2.4 };
      SFX.boss();
      return;
    }
    G.score += pts; G.kills++;
    floatText(e.x, e.y - e.r, '+' + pts, '#f2b134');
    blood(e.x, e.y, rand(-1, 1), rand(-1, 1), 14);
    stain(e.x, e.y, e.r);
    SFX.kill();
    const p = G.player;
    const r = Math.random();
    const sc = 1 + 0.3 * lvl('scav');
    const ammoChance = (p.res < rounds(24) ? 0.4 : 0.14) * sc;
    if (r < ammoChance) G.pickups.push({ type: 'ammo', x: e.x, y: e.y, t: 12 });
  }

  function damage(e, b) {
    const bl = Math.hypot(b.vx, b.vy), nx = b.vx / bl, ny = b.vy / bl;
    let dealt = b.dmg || bulletDmg();
    if (b.exec && e.hp < e.max * 0.35) dealt *= 1 + 0.5 * b.exec;
    e.hp -= dealt; e.flash = 0.08; e.meleeHit = !!b.melee;
    phaseHit(e, dealt);
    // burning and bleeding tick for 2s; a new hit refreshes it rather than stacking
    const dps = b.burn || b.bleed;
    if (dps) { e.dotDps = e.dot > 0 ? Math.max(e.dotDps, dps) : dps; e.dot = 2; e.dotMelee = !!b.bleed; }
    if (b.chill) { e.chill = 0.6; e.chillAmt = Math.min(0.45, b.chill); }
    if (b.stun && e.type !== 'boss') e.stun = Math.max(e.stun || 0, b.stun);
    const kb = (e.type === 'boss' ? 0.5 : e.type === 'tank' ? 2 : 6) * (1 + 0.5 * lvl('h_magnum')) * (b.kb || 1);
    if (b.crit) floatText(e.x, e.y - e.r - 6, 'CRIT', '#ffe2a0');
    e.x += nx * kb; e.y += ny * kb;
    blood(e.x, e.y, nx, ny, 5);
    SFX.hit();
    if (e.hp <= 0) kill(e);
  }

  function phaseHit(e, dmg) {
    const b = e.type === 'boss' && BOSSES[e.boss];
    if (!b || !b.phases || e.hp <= 0) return;
    e.phaseDmg = (e.phaseDmg || 0) + dmg;
    if (e.phaseDmg < phaseNeed(e)) return;
    e.phaseDmg = 0;
    e.phaseI = ((e.phaseI || 0) + 1) % b.phases.length;
    const sh = bossShield(e), nm = bossName(b, e.loop);
    G.banner = sh === 'melee' ? { title: 'Melee only', sub: `${nm} is bulletproof · melee it to break the shield`, t: 1.8 }
      : sh === 'gun' ? { title: 'Guns only', sub: `${nm} is covered in spikes · shoot it to break them`, t: 1.8 }
      : { title: 'Shield broken', sub: 'Any weapon works', t: 1.4 };
    boom(e.x, e.y, e.r * 1.5, sh === 'melee' ? '#78c8ff' : sh === 'gun' ? '#c88cff' : '#ffffff');
    SFX.swap();
  }

  function splash(x, y, r, dmg, skip) {
    boom(x, y, r, '#ffcf6b');
    for (const o of G.enemies) {
      if (o.dead || o === skip || gunProof(o)) continue;
      if (Math.hypot(o.x - x, o.y - y) < r + o.r) { o.hp -= dmg; o.flash = 0.08; phaseHit(o, dmg); if (o.hp <= 0) kill(o); }
    }
  }

  function hurtPlayer(dmg, nx, ny, ignoreArmor) {
    const p = G.player;
    if (G.state !== 'playing' || p.iframe > 0) return;
    p.hp = Math.max(0, p.hp - dmg * (ignoreArmor ? 1 : 1 - 0.08 * lvl('plates')));
    p.hurt = 0.3;
    if (!reduceMotion) G.shake = Math.min(14, G.shake + 8);
    p.vx += nx * 260; p.vy += ny * 260;
    SFX.hurt();
    blood(p.x, p.y, nx, ny, 4);
    if (p.hp <= 0 && lvl('p_wind') && !G.windUsed) {
      G.windUsed = true; p.hp = lvl('p_wind') >= 2 ? 30 : 1; p.iframe = 1;
      floatText(p.x, p.y - 30, 'SECOND WIND', '#dfeef4');
    }
    if (p.hp <= 0 && pRank() >= 9 && !G.revived) {
      G.revived = true; p.hp = p.maxHp / 2; p.iframe = 2;
      G.banner = { title: 'Revived', sub: 'Mythic rank · once per run', t: 2.2 };
      boom(p.x, p.y, 120, '#ff7ad9');
    }
    if (p.hp <= 0) gameOver();
  }

  function fire(x, y, a, spd, r, dmg, color, boss) {
    G.shots.push({ k: 'orb', x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r, dmg, life: 5, color, boss: !!boss });
  }

  function boom(x, y, r, color) {
    color = color || '#ff9a3c';
    addPart({ k: 'ring', x, y, r, life: 0.4, max: 0.4, vx: 0, vy: 0, drag: 0, color });
    for (let i = 0; i < 18; i++) {
      const a = rand(0, Math.PI * 2), s = rand(100, 360);
      addPart({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.2, 0.45), max: 0.45, drag: 5, color });
    }
    SFX.boom();
    if (!reduceMotion) G.shake = Math.min(14, G.shake + 5);
  }

  const blocked = (x, y, r) => OBST.some(b => {
    const cx = clamp(x, b.x, b.x + b.w), cy = clamp(y, b.y, b.y + b.h);
    return (x - cx) ** 2 + (y - cy) ** 2 < r * r;
  });

  function bossAttack(e, name, aim) {
    const b = BOSSES[e.boss], p = G.player, tier = e.boss + 1;
    const spd = (230 + tier * 14) * bossSpd(e), dmg = Math.round((8 + tier) * 1.2 * bossPow(e));
    // lead the target so running in a straight line no longer dodges everything
    const fly = Math.hypot(p.x - e.x, p.y - e.y) / spd;
    const lead = Math.atan2(p.y + p.vy * fly * 0.75 - e.y, p.x + p.vx * fly * 0.75 - e.x);
    const mx = e.x + Math.cos(lead) * e.r, my = e.y + Math.sin(lead) * e.r;
    const fan = (n, spread) => { for (let i = 0; i < n; i++) fire(mx, my, lead + (i / (n - 1) - 0.5) * spread, spd, 7, dmg, b.shot, true); };
    // two staggered rings at different speeds, so the gaps close up
    const ring = n => {
      const o = Math.random() * Math.PI;
      for (let i = 0; i < n; i++) {
        const a = o + i / n * Math.PI * 2;
        fire(e.x, e.y, a, spd * 0.85, 7, dmg, b.shot, true);
        fire(e.x, e.y, a + Math.PI / n, spd * 0.6, 7, dmg, b.shot, true);
      }
    };
    switch (name) {
      case 'aimed3': fan(3, 0.35); break;
      case 'aimed5': fan(5, 0.5); break;
      case 'fan7': fan(7, 0.9); break;
      case 'fan9': fan(9, 1.2); break;
      case 'ring8': ring(8); break;
      case 'ring12': ring(12); break;
      case 'ring16': ring(16); break;
      case 'ring20': ring(20); break;
      case 'charge': e.detour = 0; e.mode = { k: 'windup', t: 0.55, a: lead, left: 1 }; break;
      case 'spiral': e.spin = -(e.spin || 1); e.mode = { k: 'spiral', t: 2.4, a: aim, fire: 0, dir: e.spin }; break;
      case 'stream': e.mode = { k: 'stream', t: 1.3, fire: 0 }; break;
      case 'teleport': e.mode = { k: 'fade', t: 0.45 }; break;
      case 'summon':
      case 'crossfire':
        // boss waves have no regular hostiles, so the old summon is now a wall of bullets
        for (let k = 0; k < 4; k++) for (let j = 0; j < 4; j++) {
          fire(e.x, e.y, lead + Math.PI / 4 + k * Math.PI / 2, spd * (0.55 + 0.15 * j), 7, dmg, b.shot, true);
        }
        fan(5, 0.4);
        break;
      case 'fireball':
        for (const off of [-0.5, -0.25, 0, 0.25, 0.5]) fire(mx, my, lead + off, 190 * bossSpd(e), 15, dmg + 10, b.shot, true);
        break;
      case 'mortar': {
        const n = 4 + Math.floor(e.boss / 3);
        for (let i = 0; i < n; i++) {
          const tx = clamp(p.x + (i ? rand(-140, 140) : p.vx * 0.9), 30, W - 30);
          const ty = clamp(p.y + (i ? rand(-140, 140) : p.vy * 0.9), 30, H - 30);
          const t = 1.1 + i * 0.12;
          G.shots.push({ k: 'mortar', x0: e.x, y0: e.y, x: tx, y: ty, t, max: t, r: 70, dmg: dmg + 6, color: b.shot, boss: true });
        }
        break;
      }
    }
    SFX.eshot();
  }

  // returns a movement override while the boss is busy with an attack, or null to chase normally
  function bossThink(e, dt, dx, dy) {
    const b = BOSSES[e.boss], aim = Math.atan2(dy, dx), m = e.mode;
    const hold = { sx: 0, sy: 0, spd: 0 };
    if (m) {
      m.t -= dt;
      if (m.k === 'windup') { e.a = m.a; if (m.t <= 0) e.mode = { k: 'charge', t: 0.75, a: m.a, left: m.left || 0 }; return hold; }
      if (m.k === 'charge') {
        e.a = m.a;
        // a second, quicker charge re-aimed at wherever you dodged to
        if (m.t <= 0) e.mode = m.left > 0 ? { k: 'windup', t: 0.35, a: aim, left: m.left - 1 } : null;
        return { sx: Math.cos(m.a), sy: Math.sin(m.a), spd: 600 };
      }
      if (m.k === 'spiral') {
        m.fire -= dt;
        while (m.fire <= 0) {
          m.fire += 0.075; m.a += 0.3 * (m.dir || 1);
          for (let i = 0; i < 3; i++) fire(e.x, e.y, m.a + i * Math.PI * 2 / 3, (210 + e.boss * 12) * bossSpd(e), 6, Math.round((8 + e.boss) * 1.2 * bossPow(e)), b.shot, true);
        }
        if (m.t <= 0) e.mode = null;
        return hold;
      }
      if (m.k === 'stream') {
        m.fire -= dt;
        while (m.fire <= 0) {
          m.fire += 0.09;
          const sw = aim + Math.sin(m.t * 9) * 0.25;
          fire(e.x + Math.cos(sw) * e.r, e.y + Math.sin(sw) * e.r, sw, 360 * bossSpd(e), 6, Math.round((7 + e.boss) * 1.2 * bossPow(e)), b.shot, true);
        }
        if (m.t <= 0) e.mode = null;
        return { sx: dx, sy: dy, spd: 30 };
      }
      if (m.k === 'fade') {
        if (m.t <= 0) {
          const p = G.player;
          for (let i = 0; i < 25; i++) {
            const x = rand(80, W - 80), y = rand(80, H - 80);
            if (Math.hypot(x - p.x, y - p.y) > 260 && !blocked(x, y, e.r)) { e.x = x; e.y = y; break; }
          }
          e.mode = { k: 'appear', t: 0.4 };
          boom(e.x, e.y, e.r * 1.6, b.shot);
          for (let i = 0; i < 12; i++) fire(e.x, e.y, i / 12 * Math.PI * 2, (200 + e.boss * 10) * bossSpd(e), 7, Math.round((8 + e.boss) * 1.2 * bossPow(e)), b.shot, true);
        }
        return hold;
      }
      if (m.k === 'appear') { if (m.t <= 0) e.mode = null; return hold; }
    }
    e.atkT -= dt;
    if (e.atkT <= 0) {
      bossAttack(e, b.attacks[e.atkI % b.attacks.length], aim);
      e.atkI++;
      e.atkT = Math.max(0.45, b.cd * Math.pow(0.92, e.loop || 0) * (e.hp < e.max * 0.5 ? 0.65 : 1));
    }
    return null;
  }

  function wantsFire() {
    if (touch.aim) { const v = stick(touch.aim); return Math.hypot(v.x, v.y) > 0.45; }
    return mouse.down || keys[' '];
  }

  function updateAim() {
    const p = G.player;
    if (touch.aim) {
      const v = stick(touch.aim);
      if (Math.hypot(v.x, v.y) > 0.2) p.a = Math.atan2(v.y, v.x);
    } else if (!touchMode && mouse.seen) {
      const c = cam();
      p.a = Math.atan2(c.y + mouse.y / scale - p.y, c.x + mouse.x / scale - p.x);
    }
  }

  function update(dt) {
    const p = G.player;
    if (G.banner.t > 0) G.banner.t -= dt;

    // movement
    let mx = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
    let my = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
    if (touch.move) { const v = stick(touch.move); mx += v.x; my += v.y; }
    const ml = Math.hypot(mx, my);
    if (ml > 1) { mx /= ml; my /= ml; }
    const k = Math.min(1, dt * 14);
    const spd = moveSpeed();
    p.vx += (mx * spd - p.vx) * k; p.vy += (my * spd - p.vy) * k;
    p.x = clamp(p.x + p.vx * dt, p.r, W - p.r);
    p.y = clamp(p.y + p.vy * dt, p.r, H - p.r);
    pushOut(p, p.r);
    updateAim();

    // gun
    p.cool -= dt; p.flash -= dt; p.hurt -= dt; p.swing = Math.max(0, (p.swing || 0) - dt);
    p.iframe = (p.iframe || 0) - dt; p.spCool = Math.max(0, (p.spCool || 0) - dt);
    p.spinFx = Math.max(0, (p.spinFx || 0) - dt); p.idle = (p.idle || 0) + dt;
    p.spinT = wantsFire() && !p.melee ? Math.min(2, (p.spinT || 0) + dt) : Math.max(0, (p.spinT || 0) - 2 * dt);
    if (lvl('regen') && p.hp > 0) p.hp = Math.min(p.maxHp, p.hp + 0.4 * lvl('regen') * dt);
    if (p.reload > 0) {
      p.reload -= dt;
      if (p.reload <= 0) { const n = Math.min(magSize() - p.mag, p.res); p.mag += n; p.res -= n; p.reload = 0; }
    }
    if (!p.melee && p.mag === 0 && p.res === 0) {
      p.melee = true; p.reload = 0; p.cool = Math.max(p.cool, 0.2);
      floatText(p.x, p.y - 26, `Out of ammo · ${meleeDef().name}`, '#f2b134');
      SFX.swap();
    }
    if (p.melee) { if (wantsFire() && p.cool <= 0) swing(); }
    else if (wantsFire() && p.cool <= 0 && p.reload <= 0) {
      if (p.mag > 0) shoot();
      else if (p.res > 0) tryReload();
      else { SFX.dry(); p.cool = 0.35; }
    }

    // bullets
    for (let i = G.bullets.length - 1; i >= 0; i--) {
      const b = G.bullets[i];
      b.px = b.x; b.py = b.y;
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      let dead = b.life <= 0 || b.x < 0 || b.y < 0 || b.x > W || b.y > H;
      if (!dead && inObstacle(b.x, b.y)) {
        sparks(b.px, b.py, b.vx, b.vy);
        if (b.bounce > 0) {
          // ricochet off whichever face it crossed
          b.bounce--;
          if (!inObstacle(b.px, b.y)) b.vx = -b.vx; else b.vy = -b.vy;
          b.x = b.px; b.y = b.py; b.hits = [];
        } else dead = true;
      }
      if (!dead) for (const e of G.enemies) {
        if (e.dead || (b.hits && b.hits.includes(e.id))) continue;
        const dx = e.x - b.x, dy = e.y - b.y;
        if (dx * dx + dy * dy < e.r * e.r) {
          if (b.melee ? meleeProof(e) : gunProof(e)) {
            sparks(b.px, b.py, b.vx, b.vy); immuneTip(e, b.melee ? 'GUNS ONLY' : 'MELEE ONLY'); dead = true; break;
          }
          damage(e, b);
          if (b.boom && !b.boomed) { b.boomed = true; splash(b.x, b.y, b.boom, b.dmg * 0.5, e); }
          if (b.pierce > 0) { b.pierce--; b.hits.push(e.id); if (b.overpen) b.dmg *= 1 + 0.25 * b.overpen; continue; }
          dead = true; break;
        }
      }
      if (dead) G.bullets.splice(i, 1);
    }

    // shockwaves roll outward and hit each hostile once as they pass
    for (let i = G.waves.length - 1; i >= 0; i--) {
      const w = G.waves[i];
      w.r += 560 * dt;
      for (const e of G.enemies) {
        if (e.dead || w.hit.includes(e.id)) continue;
        const dx = e.x - w.x, dy = e.y - w.y;
        if (Math.hypot(dx, dy) > w.r + e.r) continue;
        w.hit.push(e.id);
        if (meleeProof(e)) { immuneTip(e, 'GUNS ONLY'); continue; }
        damage(e, { vx: dx || 0.01, vy: dy, dmg: w.dmg, kb: 3, melee: true });
      }
      if (w.r >= w.max) G.waves.splice(i, 1);
    }
    G.enemies = G.enemies.filter(e => !e.dead);

    // enemies
    const spdMul = Math.min(1.8 + 0.02 * extraWaves(), 2.3, 1 + 0.05 * (G.wave - 1));
    // runners stay a bit slower than you, so one sitting inside you can always be outrun
    const runnerCap = moveSpeed() * 0.8;
    for (const e of G.enemies) {
      if (e.dead) continue;
      if (e.dot > 0) {
        e.dot -= dt;
        if (!(e.dotMelee ? meleeProof(e) : gunProof(e))) {
          e.hp -= e.dotDps * dt; phaseHit(e, e.dotDps * dt);
          if (e.hp <= 0) { kill(e); continue; }
        }
        if (Math.random() < dt * 10) addPart({ k: 'spark', x: e.x + rand(-0.6, 0.6) * e.r, y: e.y + rand(-0.6, 0.6) * e.r,
          vx: 0, vy: -60, life: 0.3, max: 0.3, drag: 2, color: e.dotMelee ? '#c2261b' : '#ff8a3c' });
      }
      const d = defOf(e);
      let dx = p.x - e.x, dy = p.y - e.y;
      const dist = Math.hypot(dx, dy) || 1;
      dx /= dist; dy /= dist;
      e.a = Math.atan2(dy, dx);
      let sx = dx, sy = dy, spd = d.speed * spdMul;
      if (e.type === 'runner') {
        spd = Math.min(spd, runnerCap);
        // after biting you, a runner stumbles for a moment so you can get clear
        if (e.slow > 0) { e.slow -= dt; spd *= 0.35; }
      }
      if (e.chill > 0) { e.chill -= dt; spd *= 1 - e.chillAmt; }
      if (e.stun > 0) { e.stun -= dt; spd = 0; }
      if (e.type === 'gunner') {
        if (dist < 240) { sx = -dx; sy = -dy; }
        else if (dist < 340) { sx = -dy * e.side; sy = dx * e.side; spd *= 0.6; }
        e.fireT -= dt;
        if (e.fireT <= 0) {
          if (dist < 600) {
            const ca = Math.cos(e.a), sa = Math.sin(e.a);
            fire(e.x + ca * e.r * 1.85 - sa * e.r * 0.36, e.y + sa * e.r * 1.85 + ca * e.r * 0.36, e.a + rand(-0.05, 0.05), 300, 6, Math.round(9 * hostileMul()), '#ff6b5a');
            SFX.eshot();
            e.fireT = rand(1.5, 2.2) / (1 + 0.02 * extraWaves());
          } else e.fireT = 0.5;
        }
      } else if (e.type === 'boss') {
        const mv = bossThink(e, dt, dx, dy);
        if (mv) { sx = mv.sx; sy = mv.sy; spd = mv.spd; }
      }
      if (e.detour > 0) { e.detour -= dt; sx += -dy * e.side * 1.4; sy += dx * e.side * 1.4; }
      for (const o of G.enemies) {
        if (o === e || e.type === 'boss') continue;
        const ox = e.x - o.x, oy = e.y - o.y, rr = e.r + o.r + 4, d2 = ox * ox + oy * oy;
        if (d2 < rr * rr && d2 > 0.01) { const dd = Math.sqrt(d2), f = (rr - dd) / rr * 1.5; sx += ox / dd * f; sy += oy / dd * f; }
      }
      const sl = Math.hypot(sx, sy) || 1;
      const x0 = e.x, y0 = e.y;
      e.x = clamp(e.x + sx / sl * spd * dt, e.r, W - e.r);
      e.y = clamp(e.y + sy / sl * spd * dt, e.r, H - e.r);
      pushOut(e, e.r);
      const moved = Math.hypot(e.x - x0, e.y - y0);
      if (spd > 0 && !e.mode && moved < spd * dt * 0.35 && dist > e.r + p.r + 6) {
        e.stuck += dt;
        if (e.stuck > 0.2) { e.detour = 0.7; e.stuck = 0; }
      } else e.stuck = Math.max(0, e.stuck - dt);
      e.flash -= dt; e.cool -= dt; e.tip = (e.tip || 0) - dt; e.step += dt * spd * 0.08;

      if (dist < e.r + p.r + 2 && e.cool <= 0) {
        e.cool = 0.8;
        if (e.type === 'runner') e.slow = 0.6;
        hurtPlayer(d.dmg * (e.type === 'boss' ? bossPow(e) : hostileMul()), dx, dy, e.type === 'boss');
        if (G.state !== 'playing') return;
      }
    }

    // enemy shots
    for (let i = G.shots.length - 1; i >= 0; i--) {
      const s = G.shots[i];
      if (s.k === 'mortar') {
        s.t -= dt;
        if (s.t > 0) continue;
        G.shots.splice(i, 1);
        boom(s.x, s.y, s.r, s.color);
        const hd = Math.hypot(p.x - s.x, p.y - s.y) || 1;
        if (hd < s.r + p.r * 0.5) {
          hurtPlayer(s.dmg, (p.x - s.x) / hd, (p.y - s.y) / hd, s.boss);
          if (G.state !== 'playing') return;
        }
        continue;
      }
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      if (s.life <= 0 || s.x < -20 || s.y < -20 || s.x > W + 20 || s.y > H + 20) { G.shots.splice(i, 1); continue; }
      // boss shots fly straight through walls; gunner shots don't
      if (!s.boss && inObstacle(s.x, s.y)) { sparks(s.x, s.y, s.vx, s.vy); G.shots.splice(i, 1); continue; }
      if (Math.hypot(p.x - s.x, p.y - s.y) < s.r + p.r - 3) {
        G.shots.splice(i, 1);
        const sl = Math.hypot(s.vx, s.vy) || 1;
        hurtPlayer(s.dmg, s.vx / sl, s.vy / sl, s.boss);
        if (G.state !== 'playing') return;
      }
    }

    // pickups
    for (let i = G.pickups.length - 1; i >= 0; i--) {
      const it = G.pickups[i];
      it.t -= dt;
      if (it.t <= 0) { G.pickups.splice(i, 1); continue; }
      if (Math.hypot(it.x - p.x, it.y - p.y) < p.r + 14 + 14 * lvl('scav')) {
        if (it.type === 'hp') { p.hp = Math.min(p.maxHp, p.hp + 30); floatText(p.x, p.y - 26, '+30 health', '#e7e2d4'); }
        else { const n = rounds(24); p.res += n; floatText(p.x, p.y - 26, `+${n} rounds`, '#f2b134'); }
        SFX.pickup();
        G.pickups.splice(i, 1);
      }
    }

    // particles
    for (let i = G.parts.length - 1; i >= 0; i--) {
      const q = G.parts[i];
      q.life -= dt;
      if (q.life <= 0) { G.parts.splice(i, 1); continue; }
      const dr = Math.max(0, 1 - q.drag * dt);
      q.vx *= dr; q.vy *= dr;
      q.x += q.vx * dt; q.y += q.vy * dt;
      if (q.vr) { q.rot += q.vr * dt; q.vr *= dr; }
    }

    // waves
    if (G.queue.length) {
      G.spawnT -= dt;
      if (G.spawnT <= 0) { spawn(G.queue.shift()); G.spawnT = Math.max(0.25, 0.9 - G.wave * 0.05); }
    } else if (!G.enemies.length) {
      if (!G.clearing) {
        G.clearing = true; G.inter = 1.6;
        const bonus = rounds(36);
        p.res += bonus; G.score += G.wave * 25;
        G.banner = { title: `Wave ${G.wave} cleared`, sub: `+${bonus} rounds · +${G.wave * 25} points`, t: 1.6 };
        SFX.pickup();
      } else {
        G.inter -= dt;
        if (G.inter <= 0) { G.clearing = false; if (G.wave >= 30 && !G.endless) win(); else openShop(); }
      }
    }

    G.shake = Math.max(0, G.shake - dt * 40);
  }

  // ---------- drawing ----------
  function ellipse(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); }
  function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

  function drawObstacle(b) {
    if (b.k === 'crate') {
      ctx.fillStyle = '#6e5634'; ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = '#3e2f1a'; ctx.lineWidth = 3;
      ctx.strokeRect(b.x + 1.5, b.y + 1.5, b.w - 3, b.h - 3);
      ctx.strokeStyle = '#4e3c22';
      ctx.beginPath(); ctx.moveTo(b.x + 4, b.y + 4); ctx.lineTo(b.x + b.w - 4, b.y + b.h - 4); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,230,180,0.12)'; ctx.lineWidth = 1;
      ctx.strokeRect(b.x + 5, b.y + 5, b.w - 10, b.h - 10);
    } else {
      ctx.fillStyle = '#38424a'; ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = '#4a5660';
      if (b.w > b.h) ctx.fillRect(b.x, b.y, b.w, 4); else ctx.fillRect(b.x, b.y, 4, b.h);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      if (b.w > b.h) for (let x = b.x + 40; x < b.x + b.w; x += 44) ctx.fillRect(x, b.y, 2, b.h);
      else for (let y = b.y + 40; y < b.y + b.h; y += 44) ctx.fillRect(b.x, y, b.w, 2);
    }
  }

  function drawPlayer(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ellipse(3, 5, 17, 15);
    // player rank cosmetics: Master and up get a pulsing aura, Mythic's cycles through colours
    const pr = pRank(), pc = PRANKS[pr].color;
    if (pr >= 6) {
      const t = performance.now() / 1000;
      ctx.save();
      ctx.globalAlpha = 0.35 + 0.15 * Math.sin(t * 4);
      ctx.strokeStyle = pr >= 9 ? `hsl(${(t * 90) % 360},90%,65%)` : pc; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, 24 + 2 * Math.sin(t * 3), 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    ctx.rotate(p.a);
    const blink = p.hurt > 0 && Math.floor(p.hurt * 30) % 2 === 0;
    const g = gunDef();
    if (p.melee) {
      // the swing sweeps across the arc; at rest the weapon is held off to the side
      const m = meleeDef(), T = swingTime(), dir = p.swingDir || 1;
      const prog = p.swing > 0 ? 1 - p.swing / T : -1;
      const off = prog >= 0 ? dir * (-m.arc / 2 + m.arc * prog) : 0.9;
      if (prog >= 0) {
        const from = -dir * m.arc / 2;
        ctx.strokeStyle = meleeRank() >= 5 ? `rgba(127,232,255,${0.55 * (1 - prog)})` : `rgba(255,240,210,${0.4 * (1 - prog)})`; ctx.lineWidth = 6; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(0, 0, meleeRange() * 0.85, Math.min(from, off), Math.max(from, off)); ctx.stroke();
      }
      if (p.spinFx > 0) {
        ctx.strokeStyle = `rgba(200,150,255,${p.spinFx / 0.3 * 0.6})`; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.arc(0, 0, meleeRange() * 1.1, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.save();
      ctx.rotate(off); ctx.translate(10, 0);
      // mastery cosmetics: bronze grip, then a blade in the rank's colour, then a glow
      const mk = meleeRank(), mc = RANKS[mk].color;
      ctx.fillStyle = mk === 1 ? mc : m.grip; ctx.fillRect(0, -m.w / 2 - 0.5, 9, m.w + 1);
      if (mk >= 4) { ctx.shadowColor = mc; ctx.shadowBlur = 10; }
      ctx.fillStyle = mk >= 2 && !m.scythe ? mc : m.blade; ctx.fillRect(9, -m.w / 2, m.len, m.w);
      if (m.head) ctx.fillRect(9 + m.len - 6, -8, 13, 16);
      if (m.scythe) {
        // curved blade hooked back from the top of the shaft
        const e0 = 9 + m.len;
        ctx.fillStyle = mk >= 2 ? mc : m.edge;
        ctx.beginPath(); ctx.moveTo(e0, -2);
        ctx.quadraticCurveTo(e0 + 6, 16, e0 - 20, 22);
        ctx.quadraticCurveTo(e0 - 4, 12, e0 - 3, 2);
        ctx.closePath(); ctx.fill();
      }
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#2d3324'; circle(3, 0, 4.2);
      ctx.restore();
    } else {
      // rifle, finished in its mastery colour
      const rk = gunRank(), rc = RANKS[rk].color, gh = g.id === 'shotgun' || g.id === 'lmg' ? 7 : 6;
      if (rk >= 4) { ctx.shadowColor = rc; ctx.shadowBlur = 10; }
      ctx.fillStyle = rk >= 2 ? rc : '#15181a'; ctx.fillRect(4, 3, g.len, gh);
      ctx.shadowBlur = 0;
      if (rk >= 1) { ctx.fillStyle = rk >= 2 ? '#15181a' : rc; ctx.fillRect(6, 3 + gh / 2 - 0.75, g.len - 4, 1.5); }
      ctx.fillStyle = '#24292c';
      if (g.id === 'lmg') ctx.fillRect(10, 8, 10, 9);
      else if (g.id === 'handcannon') ctx.fillRect(8, 2, 7, 8);
      else if (g.id === 'marksman') { ctx.fillRect(14, 8, 5, 6); ctx.fillRect(14, 0, 12, 3); }
      else ctx.fillRect(15, 8, 5, g.id === 'smg' ? 9 : 7);
      // gloves
      ctx.fillStyle = '#2d3324'; circle(12, 9, 4.2); circle(Math.min(25, g.len), 6, 3.8);
    }
    // torso
    if (pr >= 4) { ctx.shadowColor = pc; ctx.shadowBlur = 12; }
    ctx.fillStyle = blink ? '#efe9d6' : '#55663a'; ellipse(0, 0, 11, 17);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#2a321c'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = blink ? '#d8d2bf' : '#46552f'; ctx.fillRect(-11, -8, 6, 16);
    // helmet, painted in your rank colour from Silver up
    ctx.fillStyle = pr >= 2 ? pc : '#3d4a29'; circle(1, 0, 9.5);
    if (pr === 1) { ctx.fillStyle = pc; ctx.fillRect(-8, -1, 16, 2); }
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; circle(-1, -3, 4);
    // night-vision lens
    ctx.fillStyle = pr >= 5 ? '#7fe8ff' : '#9fe39a'; ctx.fillRect(7, -3, 3, 6);
    if (p.flash > 0 && !p.melee) {
      ctx.fillStyle = 'rgba(255,214,130,0.95)';
      ctx.beginPath();
      const fx = g.len + 4;
      ctx.moveTo(fx, 6); ctx.lineTo(fx + 14, 1); ctx.lineTo(fx + 8, 6); ctx.lineTo(fx + 16, 11); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,240,200,0.9)'; circle(fx + 2, 6, 4);
    }
    ctx.restore();
  }

  function drawEnemy(e) {
    if (e.type === 'boss') { drawPig(e); return; }
    const d = TYPES[e.type], r = e.r;
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ellipse(3, 5, r * 1.05, r * 0.9);
    ctx.rotate(e.a);
    const sw = Math.sin(e.step) * r * 0.25, hit = e.flash > 0;
    if (e.type === 'spiker') {
      // purple glow and a ring of spikes
      ctx.fillStyle = 'rgba(160,90,230,0.22)'; circle(0, 0, r * 1.7);
      ctx.fillStyle = hit ? '#ffffff' : '#d9b8ff';
      for (let i = 0; i < 10; i++) {
        const a = i / 10 * Math.PI * 2 + e.step * 0.15;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a - 0.22) * r * 0.85, Math.sin(a - 0.22) * r * 0.85);
        ctx.lineTo(Math.cos(a) * r * 1.55, Math.sin(a) * r * 1.55);
        ctx.lineTo(Math.cos(a + 0.22) * r * 0.85, Math.sin(a + 0.22) * r * 0.85);
        ctx.closePath(); ctx.fill();
      }
    }
    ctx.fillStyle = d.dark;
    circle(r * 0.85 + sw * 0.3, -r * 0.55, r * 0.28);
    circle(r * 0.85 - sw * 0.3, r * 0.55, r * 0.28);
    if (e.type === 'gunner') {
      ctx.fillStyle = '#15181a'; ctx.fillRect(r * 0.3, r * 0.2, r * 1.5, r * 0.32);
      if (e.fireT < 0.35) { ctx.fillStyle = `rgba(255,107,90,${1 - Math.max(0, e.fireT) / 0.35})`; circle(r * 1.85, r * 0.36, r * 0.3); }
    }
    ctx.fillStyle = hit ? '#ffffff' : d.body; ellipse(0, 0, r * 0.75, r);
    ctx.strokeStyle = d.dark; ctx.lineWidth = 2; ctx.stroke();
    if (e.type === 'tank') { ctx.fillStyle = hit ? '#dddddd' : d.dark; ctx.fillRect(-r * 0.55, -r * 0.7, r * 0.5, r * 1.4); }
    if (e.type === 'plated') {
      // shiny steel plates with rivets
      ctx.fillStyle = hit ? '#ffffff' : '#c9d3da';
      ctx.fillRect(-r * 0.6, -r * 0.85, r * 0.35, r * 1.7);
      ctx.fillRect(r * 0.3, -r * 0.8, r * 0.3, r * 1.6);
      ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillRect(-r * 0.55, -r * 0.8, r * 0.08, r * 1.6);
      ctx.fillStyle = d.dark;
      for (const yy of [-0.55, 0, 0.55]) { circle(-r * 0.43, r * yy, 1.6); circle(r * 0.45, r * yy, 1.6); }
    }
    ctx.fillStyle = hit ? '#ffffff' : d.dark; circle(r * 0.15, 0, r * 0.45);
    ctx.fillStyle = '#ff5a3c';
    circle(r * 0.45, -r * 0.18, Math.max(1.4, r * 0.08)); circle(r * 0.45, r * 0.18, Math.max(1.4, r * 0.08));
    ctx.restore();
    if (e.hp < e.max) {
      const w = r * 2;
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(e.x - w / 2, e.y - r - 10, w, 4);
      ctx.fillStyle = '#d8453a'; ctx.fillRect(e.x - w / 2, e.y - r - 10, w * e.hp / e.max, 4);
    }
  }

  function drawPickup(it, t) {
    if (it.t < 3 && Math.floor(it.t * 8) % 2 === 0) return;
    const y = it.y + Math.sin(t * 4 + it.x) * 2;
    ctx.fillStyle = 'rgba(242,177,52,0.12)'; circle(it.x, y, 20);
    if (it.type === 'hp') {
      ctx.fillStyle = '#e8e4d8'; ctx.fillRect(it.x - 10, y - 10, 20, 20);
      ctx.fillStyle = '#c8372d'; ctx.fillRect(it.x - 2.5, y - 7, 5, 14); ctx.fillRect(it.x - 7, y - 2.5, 14, 5);
    } else {
      ctx.fillStyle = '#3b3f2a'; ctx.fillRect(it.x - 11, y - 8, 22, 16);
      ctx.fillStyle = '#f2b134';
      for (let i = 0; i < 4; i++) ctx.fillRect(it.x - 8 + i * 5, y - 5, 3, 10);
    }
  }

  function drawParticle(q) {
    const a = Math.max(0, q.life / q.max);
    if (q.k === 'casing') {
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot);
      ctx.globalAlpha = Math.min(1, a * 2);
      ctx.fillStyle = '#c9a24a'; ctx.fillRect(-2.5, -1, 5, 2);
      ctx.restore(); ctx.globalAlpha = 1;
    } else if (q.k === 'blood') {
      ctx.globalAlpha = a; ctx.fillStyle = '#8a1a14'; circle(q.x, q.y, q.size); ctx.globalAlpha = 1;
    } else if (q.k === 'spark') {
      ctx.globalAlpha = a; ctx.strokeStyle = q.color || '#ffcf6b'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x - q.vx * 0.03, q.y - q.vy * 0.03); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (q.k === 'ring') {
      ctx.globalAlpha = a; ctx.strokeStyle = q.color; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r * (1 - a * 0.7), 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (q.k === 'text') {
      ctx.globalAlpha = Math.min(1, a * 1.5);
      ctx.fillStyle = q.color; ctx.font = '600 15px "Chakra Petch", sans-serif';
      ctx.textAlign = 'center'; ctx.fillText(q.text, q.x, q.y);
      ctx.globalAlpha = 1;
    }
  }

  function drawPig(e) {
    const b = BOSSES[e.boss], r = e.r, hit = e.flash > 0, t = performance.now() / 1000, m = e.mode;
    let alpha = 1;
    if (m && m.k === 'fade') alpha = Math.max(0.05, m.t / 0.45);
    if (m && m.k === 'appear') alpha = 1 - Math.max(0, m.t) / 0.4;
    if (b.ghost) alpha *= 0.7 + Math.sin(t * 8) * 0.1;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(e.x, e.y);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ellipse(4, 7, r * 1.15, r * 0.85);
    if (m && m.k === 'windup') {
      ctx.strokeStyle = `rgba(216,69,58,${0.25 + 0.5 * (1 - m.t / 0.7)})`; ctx.lineWidth = r * 0.9; ctx.lineCap = 'butt';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(m.a) * 420, Math.sin(m.a) * 420); ctx.stroke();
    }
    ctx.rotate(e.a);
    const sw = Math.sin(e.step) * r * 0.18, body = hit ? '#ffffff' : b.color;
    // legs and tail
    ctx.fillStyle = b.dark;
    ellipse(r * 0.5 + sw, -r * 0.66, r * 0.2, r * 0.14); ellipse(r * 0.5 - sw, r * 0.66, r * 0.2, r * 0.14);
    ellipse(-r * 0.55 - sw, -r * 0.62, r * 0.2, r * 0.14); ellipse(-r * 0.55 + sw, r * 0.62, r * 0.2, r * 0.14);
    ctx.strokeStyle = b.dark; ctx.lineWidth = Math.max(2, r * 0.07); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(-r * 1.08, 0, r * 0.13, 0.5, Math.PI * 1.8); ctx.stroke();
    // body
    ctx.fillStyle = body;
    if (b.wool) for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2; circle(Math.cos(a) * r * 0.95, Math.sin(a) * r * 0.68, r * 0.22); }
    ellipse(0, 0, r, r * 0.72);
    ctx.strokeStyle = b.dark; ctx.lineWidth = 2; ctx.stroke();
    if (b.spots && !hit) {
      ctx.fillStyle = b.dark;
      ellipse(-r * 0.3, -r * 0.25, r * 0.22, r * 0.16); ellipse(r * 0.2, r * 0.3, r * 0.18, r * 0.13); ellipse(-r * 0.6, r * 0.2, r * 0.14, r * 0.12);
    }
    if (b.bristles) {
      ctx.strokeStyle = b.dark; ctx.lineWidth = 2; ctx.beginPath();
      for (let i = -5; i <= 5; i++) { const x = i * r * 0.15; ctx.moveTo(x, 0); ctx.lineTo(x - r * 0.12, (i % 2 ? -1 : 1) * r * 0.16); }
      ctx.stroke();
    }
    if (b.cyber) {
      ctx.strokeStyle = 'rgba(20,30,40,0.7)'; ctx.lineWidth = 2; ctx.beginPath();
      ctx.moveTo(-r * 0.4, -r * 0.68); ctx.lineTo(-r * 0.4, r * 0.68); ctx.moveTo(r * 0.2, -r * 0.7); ctx.lineTo(r * 0.2, r * 0.7);
      ctx.stroke();
      ctx.fillStyle = '#6be3ff'; ctx.fillRect(-r * 0.15, -r * 0.08, r * 0.3, r * 0.16);
    }
    if (b.fire) {
      for (let i = 0; i < 6; i++) {
        ctx.fillStyle = `rgba(255,${120 + (i * 37) % 90},40,0.75)`;
        circle(-r * 0.6 + i * r * 0.2, Math.sin(t * 10 + i) * r * 0.15, r * (0.12 + 0.05 * Math.sin(t * 8 + i)));
      }
    }
    // head, ears, snout
    const hx = r * 0.88;
    ctx.fillStyle = hit ? '#ffffff' : b.dark;
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(hx - r * 0.15, s * r * 0.18); ctx.lineTo(hx - r * 0.5, s * r * 0.6); ctx.lineTo(hx + r * 0.1, s * r * 0.42);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = body; circle(hx, 0, r * 0.46);
    ctx.strokeStyle = b.dark; ctx.lineWidth = 2; ctx.stroke();
    if (b.tusks) {
      ctx.fillStyle = '#f4efe0';
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(hx + r * 0.35, s * r * 0.18); ctx.lineTo(hx + r * 0.64, s * r * 0.34); ctx.lineTo(hx + r * 0.38, s * r * 0.3);
        ctx.closePath(); ctx.fill();
      }
    }
    ctx.fillStyle = hit ? '#ffffff' : b.snout; ellipse(hx + r * 0.42, 0, r * 0.13, r * 0.22);
    ctx.fillStyle = b.dark; circle(hx + r * 0.47, -r * 0.08, r * 0.035); circle(hx + r * 0.47, r * 0.08, r * 0.035);
    const angry = e.hp < e.max * 0.5;
    ctx.fillStyle = b.cyber || angry ? '#ff3b2f' : '#1a1210';
    circle(hx + r * 0.14, -r * 0.2, r * 0.06); circle(hx + r * 0.14, r * 0.2, r * 0.06);
    if (b.crown) {
      ctx.fillStyle = '#f2c14e';
      for (let i = 0; i < 5; i++) {
        const a = i / 5 * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(hx + Math.cos(a - 0.3) * r * 0.22, Math.sin(a - 0.3) * r * 0.22);
        ctx.lineTo(hx + Math.cos(a) * r * 0.42, Math.sin(a) * r * 0.42);
        ctx.lineTo(hx + Math.cos(a + 0.3) * r * 0.22, Math.sin(a + 0.3) * r * 0.22);
        ctx.closePath(); ctx.fill();
      }
      ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(hx, 0, r * 0.22, 0, Math.PI * 2); ctx.stroke();
    }
    const sh = bossShield(e);
    if (sh !== 'any') {
      const pulse = 0.5 + 0.5 * Math.sin(t * 6);
      if (sh === 'melee') {
        // blue bullet shield: melee only
        ctx.fillStyle = 'rgba(120,200,255,0.12)'; circle(0, 0, r * 1.35);
        ctx.strokeStyle = `rgba(120,200,255,${0.5 + 0.35 * pulse})`; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(0, 0, r * 1.35, 0, Math.PI * 2); ctx.stroke();
      } else {
        // purple spikes: guns only
        ctx.fillStyle = `rgba(200,140,255,${0.55 + 0.35 * pulse})`;
        for (let i = 0; i < 16; i++) {
          const a = i / 16 * Math.PI * 2 + t * 0.8;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a - 0.12) * r * 1.1, Math.sin(a - 0.12) * r * 1.1);
          ctx.lineTo(Math.cos(a) * r * 1.6, Math.sin(a) * r * 1.6);
          ctx.lineTo(Math.cos(a + 0.12) * r * 1.1, Math.sin(a + 0.12) * r * 1.1);
          ctx.closePath(); ctx.fill();
        }
      }
    }
    ctx.restore();
  }

  function drawWarnings() {
    for (const s of G.shots) {
      if (s.k !== 'mortar') continue;
      const prog = clamp(1 - s.t / s.max, 0, 1);
      ctx.fillStyle = `rgba(216,69,58,${0.08 + prog * 0.2})`; circle(s.x, s.y, s.r);
      ctx.strokeStyle = 'rgba(216,69,58,0.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * prog, 0, Math.PI * 2); ctx.stroke();
    }
  }

  function drawShots() {
    for (const s of G.shots) {
      if (s.k === 'mortar') {
        const prog = clamp(1 - s.t / s.max, 0, 1), lift = Math.sin(prog * Math.PI);
        const x = s.x0 + (s.x - s.x0) * prog, y = s.y0 + (s.y - s.y0) * prog - lift * 120;
        ctx.fillStyle = '#2b2b2b'; circle(x, y, 7 + lift * 4);
        ctx.fillStyle = s.color; circle(x, y, 3);
      } else {
        ctx.fillStyle = s.color;
        ctx.globalAlpha = 0.3; circle(s.x, s.y, s.r * 1.9); ctx.globalAlpha = 1;
        circle(s.x, s.y, s.r);
        ctx.fillStyle = '#fff6ea'; circle(s.x, s.y, s.r * 0.45);
      }
    }
  }

  function drawMeleeShot(b) {
    ctx.save();
    ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx));
    if (b.k === 'knife') {
      ctx.fillStyle = '#c9d1d6'; ctx.fillRect(-8, -1.5, 14, 3);
      ctx.fillStyle = '#2b2b2b'; ctx.fillRect(-12, -2, 5, 4);
    } else if (b.k === 'ball') {
      ctx.fillStyle = '#f4efe0'; circle(0, 0, 5);
    } else {
      const moon = b.k === 'moon';
      ctx.strokeStyle = moon ? 'rgba(200,150,255,0.85)' : 'rgba(255,240,210,0.85)'; ctx.lineWidth = moon ? 5 : 4;
      ctx.beginPath(); ctx.arc(-10, 0, moon ? 22 : 16, -1.1, 1.1); ctx.stroke();
    }
    ctx.restore();
  }

  function render(now) {
    const t = now / 1000, p = G.player;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#07090b'; ctx.fillRect(0, 0, vw, vh);
    const c = cam();
    const shx = (Math.random() - 0.5) * G.shake, shy = (Math.random() - 0.5) * G.shake;

    ctx.save();
    ctx.translate(shx, shy);
    ctx.scale(scale, scale);
    ctx.translate(-c.x, -c.y);
    ctx.drawImage(floor, 0, 0);
    for (const it of G.pickups) drawPickup(it, t);
    for (const q of G.parts) if (q.k === 'casing') drawParticle(q);
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    for (const b of OBST) ctx.fillRect(b.x + 6, b.y + 8, b.w, b.h);
    for (const b of OBST) drawObstacle(b);
    drawWarnings();
    for (const w of G.waves) {
      const a = Math.max(0, 1 - w.r / w.max);
      ctx.strokeStyle = `rgba(232,200,138,${0.8 * a})`; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = `rgba(120,90,50,${0.5 * a})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(w.x, w.y, w.r * 0.8, 0, Math.PI * 2); ctx.stroke();
    }
    for (const e of G.enemies) drawEnemy(e);
    drawPlayer(p);
    ctx.lineCap = 'round';
    const diamond = gunRank() >= 5;
    for (const b of G.bullets) {
      if (b.k) { drawMeleeShot(b); continue; }
      const tx = b.x - b.vx * 0.022, ty = b.y - b.vy * 0.022;
      ctx.strokeStyle = diamond ? 'rgba(127,232,255,0.4)' : 'rgba(242,177,52,0.35)'; ctx.lineWidth = (b.w || 2) * 2.5;
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.strokeStyle = diamond ? '#d8fbff' : '#ffe2a0'; ctx.lineWidth = b.w || 2;
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    drawShots();
    for (const q of G.parts) if (q.k !== 'casing') drawParticle(q);
    ctx.restore();

    // darkness around the player, lifted briefly by muzzle flash
    const psx = (p.x - c.x) * scale + shx, psy = (p.y - c.y) * scale + shy;
    const g = ctx.createRadialGradient(psx, psy, 140 * scale, psx, psy, Math.max(vw, vh) * 0.8);
    g.addColorStop(0, 'rgba(4,6,8,0)');
    g.addColorStop(1, `rgba(4,6,8,${p.flash > 0 ? 0.5 : 0.74})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, vw, vh);

    if (p.hurt > 0) {
      const hg = ctx.createRadialGradient(vw / 2, vh / 2, Math.min(vw, vh) * 0.3, vw / 2, vh / 2, Math.max(vw, vh) * 0.7);
      hg.addColorStop(0, 'rgba(216,69,58,0)');
      hg.addColorStop(1, `rgba(216,69,58,${(p.hurt / 0.3) * 0.45})`);
      ctx.fillStyle = hg; ctx.fillRect(0, 0, vw, vh);
    }

    if (G.state === 'playing' && !touchMode && mouse.seen) {
      const gap = 6 + Math.max(0, p.cool / fireTime()) * 6;
      ctx.strokeStyle = '#f2b134'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(mouse.x - gap - 7, mouse.y); ctx.lineTo(mouse.x - gap, mouse.y);
      ctx.moveTo(mouse.x + gap, mouse.y); ctx.lineTo(mouse.x + gap + 7, mouse.y);
      ctx.moveTo(mouse.x, mouse.y - gap - 7); ctx.lineTo(mouse.x, mouse.y - gap);
      ctx.moveTo(mouse.x, mouse.y + gap); ctx.lineTo(mouse.x, mouse.y + gap + 7);
      ctx.stroke();
      ctx.fillStyle = '#f2b134'; circle(mouse.x, mouse.y, 1.5);
    }

    if (touchMode && G.state === 'playing') {
      const drawStick = (s, fallbackX, label, firing) => {
        const ox = s ? s.ox : fallbackX, oy = s ? s.oy : vh - 130;
        ctx.strokeStyle = 'rgba(230,225,211,0.3)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(ox, oy, 60, 0, Math.PI * 2); ctx.stroke();
        if (s) {
          const v = stick(s);
          ctx.fillStyle = firing ? 'rgba(242,177,52,0.55)' : 'rgba(230,225,211,0.3)';
          circle(ox + v.x * 60, oy + v.y * 60, 24);
        } else {
          ctx.fillStyle = 'rgba(230,225,211,0.4)'; ctx.font = '500 12px "Share Tech Mono", monospace';
          ctx.textAlign = 'center'; ctx.fillText(label, ox, oy + 4);
        }
      };
      drawStick(touch.move, 100, 'MOVE', false);
      drawStick(touch.aim, vw - 100, 'AIM + FIRE', wantsFire());
    }

    cv.style.cursor = G.state === 'playing' && !touchMode ? 'none' : 'default';
  }

  // ---------- HUD ----------

  const ui = {
    hpFill: $('hpFill'), hpNum: $('hpNum'), wave: $('waveNum'), waveLabel: $('waveLabel'), hostiles: $('hostiles'), score: $('score'), best: $('best'),
    kills: $('kills'), mag: $('mag'), res: $('res'), reloadFill: $('reloadFill'), ammo: $('ammo'), ammoLabel: $('ammoLabel'),
    banner: $('banner'), bannerTitle: $('bannerTitle'), bannerSub: $('bannerSub'), overlay: $('overlay'),

  function mastHud(id, label, fill, ranks = RANKS, name = (GUN[id] || MELEE_BY[id] || {}).name) {

  function syncHud() {
    const p = G.player;

  }

  function masteryHtml(id, perks, ranks = RANKS, title = 'Mastery') {
    const xp = xpOf(id), r = rankIn(ranks, xp), next = ranks[r + 1];

    return `<div class="mastery">
      <div class="mhead"><span class="label">${title} · ${ranks[r].name}</span><span class="label">${next ? `${xp} / ${next.xp} XP` : `${xp} XP · max rank`}</span></div>
      <div class="rbar"><i style="width:${pct}%"></i></div>
      <ul class="ranks">${list}</ul>
