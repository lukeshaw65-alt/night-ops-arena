      chosenGun = b.dataset.gun;
      try { localStorage.setItem('nightops-gun', chosenGun); } catch (err) {}
      if (G.state === 'title') G = freshState(chosenGun);
      showOverlay(FR.co ? 'colobby' : FR.lobby ? 'lobby' : G.state);
      const again = ui.overlay.querySelector(`[data-gun="${chosenGun}"]`);
      if (again) again.focus({ preventScroll: true });
    }
    else if (act === 'melee') {
      chosenMelee = b.dataset.melee;
      try { localStorage.setItem('nightops-melee', chosenMelee); } catch (err) {}
      if (G.state === 'title') G = freshState(chosenGun);
      showOverlay(FR.co ? 'colobby' : FR.lobby ? 'lobby' : G.state);
      const again = ui.overlay.querySelector(`[data-melee="${chosenMelee}"]`);
      if (again) again.focus({ preventScroll: true });
    }
    else if (act === 'buy') {
      const id = b.dataset.id;
      if (buy(id)) {
        showOverlay('shop');
        const again = ui.overlay.querySelector(`[data-id="${id}"]`);
        if (again && !again.disabled) again.focus({ preventScroll: true });
      }
    }
    else if (act === 'board') { if (G.state !== 'title' && G.state !== 'over' && G.state !== 'won') return; boardFrom = G.state; showOverlay('board'); }
    else if (act === 'friends') {
      if (G.state === 'vsover') { G = freshState(chosenGun); paintFloor(); }
      if (G.state !== 'title') return;
      boardFrom = 'title'; FR.note = ''; showOverlay('friends');
    }
    else if (act === 'vsready') { if (FR.lobby) vsToggleReady(); else if (G.vs && G.state === 'shop') vsSetReady(); }
    else if (act === 'vsleave') vsLeaveLobby();
    else if (act === 'vsdiff') vsSetDiff(b.dataset.d === 'arcane' ? 'arcane' : 'normal');
    else if (act === 'vskeep') { if (G.vs && G.state === 'vsdecide') vsDecide(true); }
    else if (act === 'vsend') { if (G.vs && (G.state === 'vsdecide' || G.state === 'shop')) vsDecide(false); }
    else if (act === 'vsclose') { if (G.vs && G.state === 'playing') ui.overlay.hidden = true; }
    else if (act === 'vsff') { if (G.vs && !G.vs.over) { if (G.vs.coop) coopLeave(); else vsEnd('ff-me', true); } }
    else if (act === 'vsrematch') { if (G.vs) { const code = G.vs.code; G = freshState(chosenGun); paintFloor(); frChallenge(code); } }
    else if (act === 'transfer') { if (G.state !== 'title') return; boardFrom = 'title'; showOverlay('transfer'); }
    else if (act === 'diff') {
      const d = b.dataset.d === 'arcane' ? 'arcane' : 'normal';
      if (d === 'arcane' && !arcaneUnlocked()) return;
      chosenDiff = d;
      try { localStorage.setItem('nightops-diff', d); } catch (err) {}
      if (G.state === 'title') showOverlay('title');
    }
    else if (act === 'profile') { if (G.state !== 'title') return; boardFrom = 'title'; profTab = 'overview'; FR.viewing = null; showOverlay('profile'); }
    else if (act === 'ptab') { profTab = b.dataset.tab; showOverlay(FR.viewing ? 'fprofile' : 'profile'); }
    else if (act === 'frback') { FR.viewing = null; showOverlay('friends'); }
    else if (act === 'cos') {
      const k = b.dataset.k, val = b.dataset.v;
      if (!COS_LABEL[k] || !cosOwned(k, val)) return;
      MYCOS[k] = val; saveCos(); frHelloAll(); postPoints();
      showOverlay('profile');
    }
    else if (act === 'mkcode') {
      const out = $('tfOut'), note = $('tfNote');
      out.value = progressCode(); out.hidden = false; out.focus(); out.select();
      const say = m => { note.textContent = m; };
      try { navigator.clipboard.writeText(out.value).then(() => say('Progress code copied. Paste it into the other copy of the game.'), () => say('Press Ctrl+C to copy the selected code.')); }
      catch (err) { say('Press Ctrl+C to copy the selected code.'); }
    }
    else if (act === 'import') {
      const note = $('tfNote');
      try {
        importProgress($('tfIn').value);
        G = freshState(chosenGun);
        note.textContent = `Progress imported. You’re now ${lvName(pLevel())} rank with a best score of ${best.toLocaleString()}.`;
        $('tfIn').value = '';
      } catch (err) { note.textContent = 'That progress code didn’t work. Make sure you copied all of it.'; }
    }
    else if (act === 'back') showOverlay(boardFrom);
    else if (act === 'btab') { boardTab = b.dataset.tab; showOverlay('board'); }
    else if (act === 'bdiff') { boardDiff = ['arcane', 'coop'].includes(b.dataset.d) ? b.dataset.d : 'normal'; showOverlay('board'); }
    else if (act === 'coop') {
      if (G.state === 'vsover') { G = freshState(chosenGun); paintFloor(); }
      if (G.state === 'title') coOpen();
    }
    else if (act === 'coinv') coInvite(b.dataset.code);
    else if (act === 'codiff') coSetDiff(b.dataset.d === 'arcane' ? 'arcane' : 'normal');
    else if (act === 'cordy') coToggleReady();
    else if (act === 'cogo') coGo();
    else if (act === 'coleave') coLeave();
    else if (act === 'resumerun') { const d = loadRun(); if (d) { G = normalize(d); paintFloor(); showOverlay(G.state); } }
    else if (act === 'savequit') { saveMastery(); saveRun(); G = freshState(chosenGun); paintFloor(); showOverlay('title'); }
    else if (act === 'abandon') { saveMastery(); clearRun(); G = freshState(chosenGun); paintFloor(); showOverlay('title'); }
    else if (act === 'quit') { saveMastery(); G = freshState(chosenGun); paintFloor(); showOverlay('title'); }
  });
  ui.pause.addEventListener('click', () => { initAudio(); togglePause(); });
  ui.mute.addEventListener('click', () => { initAudio(); toggleMute(); });
  ui.reload.addEventListener('click', () => tryReload());
  ui.swap.addEventListener('click', () => swapWeapon());
  ui.specialBtn.addEventListener('click', () => special());

  function startGame(endless) {
    initAudio();
    clearRun();
    G = freshState(chosenGun);
    G.endless = !!endless;
    G.diff = chosenDiff === 'arcane' && arcaneUnlocked() ? 'arcane' : 'normal';
    G.state = 'playing';
    STATS.runs++;
    paintFloor();
    ui.overlay.hidden = true;
    mouse.down = false;
    const s = clamp(startSel, 1, 30);
    G.bonus = rankBonus();
    if (s > 1) { G.wave = s - 1; G.bonus += startBonus(s); G.prep = true; openShop(); }
    else startWave(1);
  }
  let shopTab = 'gun';
  function shopHtml() {
    const p = G.player, pts = G.score + (G.bonus || 0) - G.spent;
    const g = gunDef();
    const upCard = u => {
      const max = maxOf(u), l = Math.min(lvl(u.id), max), maxed = l >= max, c = Math.round(u.base * (l + 1) * priceMul());
      const pips = Array.from({ length: max }, (_, i) => `<i class="${i < l ? 'on' : ''}"></i>`).join('');
      const detail = maxed ? `${u.label} ${u.val(l)}` : `${u.label} ${u.val(l)} → ${u.val(l + 1)}`;
      return `<div class="card${maxed ? ' maxed' : ''}">
        <div class="info"><div class="card-top"><b>${u.name}</b><span class="lvl">LV ${l}/${max}</span></div><span class="note">${detail}</span></div>
        <span class="pips">${pips}</span>
        <button type="button" class="buy" data-act="buy" data-id="${u.id}" ${maxed || pts < c ? 'disabled' : ''}>${maxed ? 'Maxed' : c + ' pts'}</button></div>`;
    };
    const supCard = s => {
      const full = s.id === 'heal' && p.hp >= p.maxHp;
      const detail = s.id === 'heal' ? `${s.desc} (${Math.ceil(p.hp)}/${p.maxHp})` : `+${rounds(48)} rounds (${p.res} in reserve)`;
      return `<div class="card"><div class="info"><b>${s.name}</b><span class="note">${detail}</span></div>
        <button type="button" class="buy" data-act="buy" data-id="${s.id}" ${full || pts < sCost(s) ? 'disabled' : ''}>${full ? 'Full' : sCost(s) + ' pts'}</button></div>`;
    };
    const TABS = [
      { id: 'gun', name: g.name, hint: `Signature upgrades for your ${g.name.toLowerCase()} · ${RANKS[gunRank()].name} mastery.`, html: () => gunUps().map(upCard).join('') },
      { id: 'melee', name: 'Melee', hint: `Works with your ${meleeDef().name.toLowerCase()} · ${RANKS[meleeRank()].name} mastery.`, html: () => meleeUps().map(upCard).join('') },
      { id: 'gear', name: 'Gear', hint: 'Max levels depend on your gun.', html: () => UPGRADES.concat(playerUps()).map(upCard).join('') },
      { id: 'supplies', name: 'Supplies', hint: 'One-off top-ups. Buy as many as you can afford.', html: () => SUPPLIES.map(supCard).join('') }
    ];
    const tab = TABS.find(t => t.id === shopTab) || TABS[0];
    const tabs = TABS.map(t => `<button type="button" class="tab" role="tab" data-act="tab" data-tab="${t.id}" aria-selected="${t.id === tab.id}">${t.name}</button>`).join('');
    return `<div class="brief wide">
      <p class="eyebrow">${G.prep ? 'Starting kit' : `Wave ${G.wave} cleared`} · Armory</p>
      <h1>Upgrades</h1>
      <div class="wallet"><span class="label">Points to spend</span><b>${pts.toLocaleString()}</b></div>
      <div class="tabs" role="tablist">${tabs}</div>
      <p class="note">${tab.hint} Buying doesn't lower your score.</p>
      <div class="cards">${tab.html()}</div>
      ${G.vs ? `<div class="actions">
          <button type="button" class="cta" data-act="vsready">${G.vs.ready ? 'Not ready' : `Ready for wave ${G.wave + 1}`}</button>
          ${G.endless && !(G.vs.coop && G.vs.role !== 'host') ? `<button type="button" class="ghost" data-act="vsend">${G.vs.coop ? 'End run as a win' : 'End match'}</button>` : ''}
        </div>
        <p class="note" id="vsWait"></p>`
        : `<div class="actions"><button type="button" class="cta" data-act="next">Start wave ${G.wave + 1}</button></div>`}
    </div>`;
  }
  function buy(id) {
    const p = G.player, pts = G.score + (G.bonus || 0) - G.spent;
    const u = UPGRADES.find(x => x.id === id) || playerUps().find(x => x.id === id) || meleeUps().find(x => x.id === id) || gunUps().find(x => x.id === id);
    if (u) {
      const l = lvl(id), c = Math.round(u.base * (l + 1) * priceMul());
      if (l >= maxOf(u) || pts < c) return false;
      G.spent += c; G.up[id] = l + 1;
      if (id === 'hp') { p.maxHp += 25; p.hp += 25; }
    } else {
      const s = SUPPLIES.find(x => x.id === id);
      if (!s || pts < sCost(s)) return false;
      if (id === 'heal') { if (p.hp >= p.maxHp) return false; p.hp = p.maxHp; G.boughtMed = true; }
      else p.res += rounds(48);
      G.spent += sCost(s);
    }
    SFX.pickup();
    return true;
  }
  function openShop() { saveMastery(); G.state = 'shop'; G.shots = []; mouse.down = false; saveRun(); showOverlay('shop'); }
  function closeShop() { if (G.state !== 'shop') return; G.state = 'playing'; G.prep = false; ui.overlay.hidden = true; startWave(G.wave + 1); }

  function pause() { if (G.state !== 'playing' || G.vs) return; saveMastery(); G.state = 'paused'; saveRun(); mouse.down = false; showOverlay('paused'); }
  function resume() { if (G.state !== 'paused') return; G.state = 'playing'; ui.overlay.hidden = true; }
  function togglePause() {
    // versus never pauses; the button opens the match menu over the live game instead
    if (G.vs) {
      if (G.state !== 'playing' || G.vs.over) return;
      if (ui.overlay.hidden) { mouse.down = false; showOverlay('vsmenu'); } else ui.overlay.hidden = true;
      return;
    }
    if (G.state === 'playing') pause(); else if (G.state === 'paused') resume();
  }
  function win() {
    G.state = 'won';
    mouse.down = false;
    unlock('w30');
    if (!G.boughtMed) unlock('ironwill');
    if (arcane()) unlock('dragonslayer');
    else unlockArcane();
    saveMastery(); clearRun(); submitRun();
    showOverlay('won');
  }
  function gameOver() {
    G.state = 'over';
    mouse.down = false;
    STATS.deaths++;
    saveMastery(); clearRun(); submitRun();
    showOverlay('over');
  }

  // ---------- loop ----------
  let last = performance.now(), acc = 0;
  function step(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (G.state === 'playing') {
      acc += dt;
      while (acc >= STEP && G.state === 'playing') { update(STEP); acc -= STEP; }
    } else {
      acc = 0;
      if (G.state === 'title') updateAim();
    }
    vsTick(dt);
  }
  let padLast = performance.now();
  function frame(now) {
    pollPad(Math.min(0.1, (now - padLast) / 1000));
    padLast = now;
    step(now);
    render(now);
    syncHud();
    requestAnimationFrame(frame);
  }
  // a hidden tab gets no animation frames, but a versus match has to keep running for the other player
  setInterval(() => { if (G.vs && !G.vs.over && document.hidden) step(performance.now()); }, 100);

  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => JSON.parse(JSON.stringify(G)));
  // fills in anything an older saved state is missing, and never resumes straight into action
  function normalize(d) {
    if (d.vs) return freshState(chosenGun);
    if (!d.up) { d.up = { dmg: 0, rate: 0, mag: 0, reload: 0, hp: 0, speed: 0 }; d.spent = 0; d.player.maxHp = 100; }
    if (!d.shots) d.shots = [];
    if (!d.gun) d.gun = 'carbine';
    if (!d.melee) d.melee = MELEE[0].id;
    if (!d.waves) d.waves = [];
    if (!d.xpRun) d.xpRun = {};
    if (d.diff !== 'arcane') d.diff = 'normal';
    if (!Array.isArray(d.hazards)) d.hazards = [];
    if (d.state === 'playing') d.state = 'paused';
    return d;
  }
  function start(data) {
    if (data && data.player && Array.isArray(data.enemies)) G = normalize(data);
    // catch up on achievements already earned before they existed (mastery, ranks, friends)
    checkRanks(); checkStats();
    if (Object.keys(friends).length) unlock('squad');
    if (G.state === 'title') showOverlay('title');
    else if (G.state === 'paused') showOverlay('paused');
    else if (G.state === 'over') showOverlay('over');
    else if (G.state === 'shop') showOverlay('shop');
    else if (G.state === 'won') showOverlay('won');
    frStart();
    requestAnimationFrame(frame);
  }
  // test hook, only with ?debug in the address
  if (/[?&]debug\b/.test(location.search)) window.__nops = {
    G: () => G, FR,
    shootAt(x, y) { const p = G.player; p.melee = false; p.a = Math.atan2(y - p.y, x - p.x); p.reload = 0; if (p.mag <= 0) p.mag = 5; shoot(); },
    clearWave() { G.queue = []; G.enemies.forEach(e => { if (!e.dead) { e.lastBy = 'me'; e.reborn = true; kill(e); } }); },
    jump(n) { G.queue = []; G.enemies = []; G.shots = []; startWave(n); },
    hello: () => frHelloAll(),
    hurt(n) { const p = G.player; p.prot = 0; p.iframe = 0; hurtPlayer(n, 0, 0, true); },
    ranks: () => ({ lv: pLevel(), pr: pRank(), gr: gunRank(), mr: meleeRank(), mag: magSize(), reload: +reloadTime().toFixed(3),
      dmg: +bulletDmg().toFixed(3), mdmg: +meleeDmg().toFixed(3), rad: radLv(), bonus: rankBonus(), pts: ptsMul(), lvXp: LV_XP }),
    checkRanks: () => checkRanks()
  };
  if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start(hot && hot.data ? hot.data : {});
})();
</script>

</body></html>
