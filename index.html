  }

  function shoot() {
    const p = G.player, g = gunDef(), ca = Math.cos(p.a), sa = Math.sin(p.a);
    const last = p.mag === 1;
    if (Math.random() >= ammoSave()) p.mag--;
    p.cool = fireTime(); p.flash = 0.05; p.prot = 0;
    if (Math.random() < 0.15 * lvl('x_hfan')) p.cool = 0.06;
    const tip = g.len + 4, tx = p.x + ca * tip - sa * 6, ty = p.y + sa * tip + ca * 6;
    const n = pelletCount(), spread = g.spread * spreadMul(), multi = n > 1;
    const big = last && lastMul() > 1, dmg = bulletDmg() * (big ? lastMul() : 1);
    // gun mastery effects ride along on every bullet
    p.shotN = (p.shotN || 0) + 1;
    const fx = { burn: lvl('x_gfire') + (lvl('x_lburn') && p.shotN % 4 === 0 ? 1.5 * lvl('x_lburn') : 0),
      chill: 0.15 * lvl('x_schill'), exec: lvl('x_hexec'), overpen: lvl('x_mover'), bounce: lvl('x_cric') };
    const extra = Math.random() < 0.15 * lvl('x_cdouble') ? 1 : 0;
    for (let i = 0; i < n + extra; i++) {
      const a = p.a + rand(-spread / 2, spread / 2) + (i >= n ? rand(-0.06, 0.06) : 0), sp = g.speed * (multi ? rand(0.85, 1.1) : 1);
      const crit = Math.random() < critChance() + 0.1 * lvl('x_mhead');
      G.bullets.push({ x: tx, y: ty, px: tx, py: ty, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: g.life * rangeMul() * (multi ? rand(0.8, 1.1) : 1), dmg: crit ? dmg * 2 : dmg, crit,
        pierce: g.pierce + pierceBonus(), hits: [], w: g.tracer * (crit || big ? 1.6 : 1), boom: blastRadius(), ...fx });
    }
    if (!reduceMotion) G.shake = Math.min(G.shake + g.shake, 12);
    const es = rand(90, 150);
    addPart({ k: 'casing', x: p.x + ca * 14 - sa * 8, y: p.y + sa * 14 + ca * 8,
      vx: -sa * es + rand(-20, 20), vy: ca * es + rand(-20, 20), life: 2.5, max: 2.5, rot: rand(0, 6), vr: rand(-20, 20), drag: 5 });
    SFX.shot();
    if (p.mag === 0 && p.res > 0) tryReload();
  }

  function startWave(n) {
    G.wave = n;
    G.windUsed = false;
    const bossWave = n % 3 === 0;
    let total = bossWave ? 0 : arcane() ? Math.min(3 + n * 2, G.endless ? 70 : 50) : Math.min(4 + n * 3, G.endless ? 90 : 70);
    // a bigger co-op squad faces half as many hostiles again per extra soldier
    total = Math.round(total * (1 + 0.5 * (teamSize() - 1)));
    G.queue = bossWave ? ['boss'] : [];
    const pp = n >= TYPES.plated.from ? 0.1 : 0, sp = n >= TYPES.spiker.from ? 0.1 : 0;
    if (arcane()) for (let i = 0; i < total; i++) G.queue.push(pickWizard(n));
    else for (let i = 0; i < total; i++) {
      const r = Math.random(), q = Math.random();
      const tp = n >= 3 ? Math.min(0.25, 0.1 + 0.02 * n) : 0, gp = n >= 4 ? 0.18 : 0;
      if (q < pp) G.queue.push('plated');
      else if (q < pp + sp) G.queue.push('spiker');
      else if (r < tp) G.queue.push('tank');
      else if (r < tp + gp) G.queue.push('gunner');
      else if (n >= 2 && r < tp + gp + 0.32) G.queue.push('runner');
      else G.queue.push('grunt');
    }
    G.spawnT = 1;
    if (bossWave) {
      const s = bossSlot(n), b = bossList()[s.idx];
      G.banner = { title: bossName(b, s.loop), sub: `Wave ${n} boss · ${b.title}`, t: 2.6 };
    } else {
      // a type that first appears on a boss wave gets introduced on the wave after
      const fresh = Object.values(TYPES).find(d => !!d.arcane === arcane() && (d.from === n || (d.from === n - 1 && (n - 1) % 3 === 0)));
      G.banner = fresh
        ? { title: `Wave ${n}`, sub: `New hostile: ${fresh.intro}`, t: 3.5 }
        : { title: `Wave ${n}`, sub: `${total} hostiles inbound`, t: 2 };
    }
    SFX.wave();
    onWaveStart(n);
    if (G.vs && !G.vs.coop && n === 20) G.vs.behind20 = G.vs.banked + G.vs.risk < (G.vs.opp.banked || 0) + (G.vs.opp.risk || 0);
    if (isHost()) {
      vsRespawn();
      vsSend({ t: 'v.ws', n, bn: G.banner, en: G.endless ? 1 : 0 });
    }
  }

  // Clerics and Necromancers are kept to about 1 in 8 each; the rest share the remainder
  function pickWizard(n) {
    const r = Math.random();
    if (n >= TYPES.cleric.from && r < 0.125) return 'cleric';
    if (n >= TYPES.necro.from && r >= 0.125 && r < 0.25) return 'necro';
    const pool = ['pyro', 'witch', 'frost', 'storm'].filter(t => TYPES[t].from <= n);
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function spawn(type) {
    if (type === 'boss') { spawnBoss(); return; }
    const d = TYPES[type], p = G.player;
    let x, y, tries = 0;
    do {
      const side = Math.floor(Math.random() * 4), t = Math.random();
      if (side === 0) { x = t * W; y = d.r; }
      else if (side === 1) { x = W - d.r; y = t * H; }
      else if (side === 2) { x = t * W; y = H - d.r; }
      else { x = d.r; y = t * H; }
      tries++;
    } while (tries < 12 && Math.hypot(x - p.x, y - p.y) < 380);
    const hp = d.hp + (type === 'grunt' && G.wave >= 6 ? 1 : 0) + (type === 'tank' ? Math.floor(G.wave / 4) : 0)
      + (d.arcane && !d.minion ? Math.floor(G.wave / 6) : 0)
      + Math.floor(extraWaves() / 4) * (type === 'tank' ? 2 : 1);
    G.enemies.push(makeEnemy(type, x, y, hp));
  }

  function makeEnemy(type, x, y, hp) {
    const d = TYPES[type];
    return { id: G.nextId++, type, x, y, r: type === 'boss' ? 0 : d.r, hp, max: hp, a: 0, flash: 0, cool: 0.5,
      stuck: 0, detour: 0, side: Math.random() < 0.5 ? -1 : 1, step: rand(0, 6), fireT: rand(1.2, 2),
      castT: d && d.cast ? rand(1, d.cast) : 0, casts: 0 };
  }

  function spawnBoss() {
    const { idx, loop } = bossSlot(G.wave), k = idx + 1, b = bossList()[idx], p = G.player;
    // beasts are about a third tougher than the pigs, and the Elder Dragon tops out at 4,000
    const base = idx === BOSSES.length - 1 ? (arcane() ? 4000 : 3000) : (60 * k + 12 * k * k) * 1.25 * (arcane() ? 1.3 : 1);
    const hp = Math.round(base * (1 + 0.6 * loop) * (1 + 0.6 * (teamSize() - 1)));
    const e = makeEnemy('boss', W / 2, p.y > H / 2 ? b.r + 20 : H - b.r - 20, hp);
    Object.assign(e, { r: b.r, boss: idx, loop, atkT: 2, atkI: 0, mode: null, phaseI: 0, phaseDmg: 0, heads: 3, reborn: false });
    G.enemies.push(e);
  }

  function summon(e) {
    const n = 2 + Math.floor(e.boss / 2);
    for (let i = 0; i < n && G.enemies.length < 50; i++) {
      const a = (i / n) * Math.PI * 2;
      const type = e.boss >= 5 && i % 2 ? 'gunner' : (i % 2 ? 'runner' : 'grunt');
      const m = makeEnemy(type, clamp(e.x + Math.cos(a) * e.r * 1.8, 20, W - 20), clamp(e.y + Math.sin(a) * e.r * 1.8, 20, H - 20), TYPES[type].hp);
      pushOut(m, m.r);
      G.enemies.push(m);
      addPart({ k: 'ring', x: m.x, y: m.y, r: 26, life: 0.3, max: 0.3, vx: 0, vy: 0, drag: 0, color: bossList()[e.boss].shot });
    }
  }

  function kill(e) {
    const d = defOf(e);
    // the Phoenix rises again once, at half health
    if (e.type === 'boss' && d.rebirth && !e.reborn) {
      e.reborn = true; e.hp = e.max * 0.5; e.mode = null; e.dot = 0;
      boom(e.x, e.y, 140, d.shot);
      for (let i = 0; i < 8; i++) addHazard('fire', e.x + Math.cos(i * Math.PI / 4) * 90, e.y + Math.sin(i * Math.PI / 4) * 90, 45, 4);
      G.banner = { title: 'The Phoenix rises again', sub: 'Reborn from the ashes at half health', t: 2.4 };
      if (isHost()) vsSend({ t: 'v.bn', b: G.banner });
      return;
    }
    e.dead = true;
    // in versus the host runs the world, so a kill the other player landed is credited to them over the wire
    const theirs = isHost() && e.lastBy === 'opp';
    const killer = theirs ? vsPeer(e.lastCode) : null;
    const wiz = isWizard(e.type) && !d.minion;
    // raised skeletons are endless, so they give no mastery xp or points and don't count as kills
    const xp = d.minion ? 0 : e.type === 'boss' ? 30 : e.type === 'tank' || e.type === 'plated' || e.type === 'cleric' || e.type === 'necro' ? 3 : wiz ? 2 : 1;
    const base = d.minion ? 0 : e.type === 'boss' ? d.pts * (1 + (e.loop || 0)) : d.pts * (1 + (G.wave - 1) * 0.15);
    const pts = Math.round(base * ptsMul());
    if (theirs) vsTo(killer.code, { t: 'v.kill', pts: base, xp, ml: e.meleeHit ? 1 : 0, x: e.x, y: e.y, boss: e.type === 'boss' ? 1 : 0, bi: e.boss, bl: e.loop || 0, wz: wiz ? 1 : 0, mn: d.minion ? 1 : 0 });
    else {
      if (lvl('l_belt')) G.player.mag = Math.min(magSize(), G.player.mag + lvl('l_belt'));
      gainXp(e.meleeHit ? G.melee : G.gun, xp);
      addScore(pts);
      if (!d.minion) { G.kills++; onMyKill(e.meleeHit, e.type === 'boss' ? e.boss : null, e.loop || 0, wiz); }
    }
    if (e.type === 'boss') {
      G.shots = [];
      if (G.vs) { G.vs.clr = true; G.vs.eshots = []; }
      boom(e.x, e.y, 110, d.shot);
      for (let i = 0; i < 4; i++) stain(e.x + rand(-30, 30), e.y + rand(-30, 30), e.r);
      G.pickups.push({ id: G.nextId++, type: 'ammo', x: e.x, y: e.y, t: 15 });
      G.banner = { title: `${bossName(d, e.loop)} defeated`, sub: theirs ? `${killer.name || G.vs.name} landed the final blow` : `+${pts.toLocaleString()} points`, t: 2.4 };
      // everyone except whoever landed it hears who did
      if (isHost()) {
        const who = theirs ? killer.name : me.name || (G.vs.coop ? 'The host' : 'Your opponent');
        for (const o of G.vs.peers) if (!o.gone && o !== killer) vsTo(o.code, { t: 'v.bn', b: { title: G.banner.title, sub: `${who} landed the final blow`, t: 2.4 } });
      }
      SFX.boss();
      return;
    }
    if (!theirs && pts) floatText(e.x, e.y - e.r, '+' + pts, '#f2b134');
    killFx(e.x, e.y, theirs ? killer.ke : myCos().kill);
    stain(e.x, e.y, e.r);
    SFX.kill();
    const p = G.player;
    const r = Math.random();
    const sc = 1 + 0.3 * lvl('scav');
    const ammoChance = (p.res < rounds(24) ? 0.4 : 0.14) * sc * (arcane() ? 0.75 : 1);
    if (r < ammoChance) G.pickups.push({ id: G.nextId++, type: 'ammo', x: e.x, y: e.y, t: 12 });
  }

  function damage(e, b) {
    const bl = Math.hypot(b.vx, b.vy) || 1, nx = b.vx / bl, ny = b.vy / bl;
    let dealt = b.dmg || bulletDmg();
    if (b.exec && e.hp < e.max * 0.35) dealt *= 1 + 0.5 * b.exec;
    if (b.crit && !b.opp) { STATS.crits++; if (STATS.crits === 100) checkStats(); }
    // the guest only shows the hit; the host applies it to the real hostile
    if (isGuest()) {
      G.vs.hitsOut.push([e.id, +dealt.toFixed(2), b.melee ? 1 : 0, b.burn || 0, b.bleed || 0, b.chill || 0, b.stun || 0, b.kb || 1, +nx.toFixed(2), +ny.toFixed(2)]);
      e.flash = 0.08;
      if (b.crit) floatText(e.x, e.y - e.r - 6, 'CRIT', '#ffe2a0');
      blood(e.x, e.y, nx, ny, 5);
      SFX.hit();
      return;
    }
    e.lastBy = b.opp ? 'opp' : 'me';
    if (b.opp) e.lastCode = b.opp;
    e.hp -= dealt; e.flash = 0.08; e.meleeHit = !!b.melee;
    phaseHit(e, dealt);
    // burning and bleeding tick for 2s; a new hit refreshes it rather than stacking
    const dps = b.burn || b.bleed;
    if (dps) { e.dotDps = e.dot > 0 ? Math.max(e.dotDps, dps) : dps; e.dot = 2; e.dotMelee = !!b.bleed; }
    if (b.chill) { e.chill = 0.6; e.chillAmt = Math.min(0.45, b.chill); }
    if (b.stun && e.type !== 'boss') e.stun = Math.max(e.stun || 0, b.stun);
    const kb = (e.type === 'boss' ? 0.5 : e.type === 'tank' ? 2 : 6) * (1 + 0.5 * lvl('h_magnum')) * (b.kb || 1);
    if (b.crit) floatText(e.x, e.y - e.r - 6, 'CRIT', '#ffe2a0');
    e.x += nx * kb; e.y += ny * kb;
    blood(e.x, e.y, nx, ny, 5);
    SFX.hit();
    if (e.hp <= 0) kill(e);
  }

  function phaseHit(e, dmg) {
    const b = e.type === 'boss' && bossList()[e.boss];
    if (!b || !b.phases || e.hp <= 0) return;
    e.phaseDmg = (e.phaseDmg || 0) + dmg;
    if (e.phaseDmg < phaseNeed(e)) return;
    if (bossShield(e) === 'melee' && e.lastBy !== 'opp') unlock('shield');
    e.phaseDmg = 0;
    e.phaseI = ((e.phaseI || 0) + 1) % b.phases.length;
    const sh = bossShield(e), nm = bossName(b, e.loop);
    G.banner = sh === 'melee' ? { title: 'Melee only', sub: `${nm} is bulletproof · melee it to break the shield`, t: 1.8 }
      : sh === 'gun' ? { title: 'Guns only', sub: `${nm} is covered in spikes · shoot it to break them`, t: 1.8 }
      : { title: 'Shield broken', sub: 'Any weapon works', t: 1.4 };
    boom(e.x, e.y, e.r * 1.5, sh === 'melee' ? '#78c8ff' : sh === 'gun' ? '#c88cff' : '#ffffff');
    SFX.swap();
    if (isHost()) vsSend({ t: 'v.bn', b: G.banner });
  }

  function splash(x, y, r, dmg, skip) {
    boom(x, y, r, '#ffcf6b');
    for (const o of G.enemies) {
      if (o.dead || o.flying || o === skip || gunProof(o)) continue;
      if (Math.hypot(o.x - x, o.y - y) >= r + o.r) continue;
      if (isGuest()) { damage(o, { vx: o.x - x || 0.01, vy: o.y - y, dmg }); continue; }
      o.lastBy = 'me';
      o.hp -= dmg; o.flash = 0.08; phaseHit(o, dmg); if (o.hp <= 0) kill(o);
    }
  }

  // src 'opp' marks damage from the other player in versus; quiet skips the knockback and flash (burn ticks)
  function hurtPlayer(dmg, nx, ny, ignoreArmor, src, quiet) {
    const p = G.player;
    if (G.state !== 'playing' || p.iframe > 0 || p.dead || p.prot > 0) return;
    const taken = dmg * (ignoreArmor ? 1 : 1 - 0.08 * lvl('plates'));
    p.hp = Math.max(0, p.hp - taken);
    G.waveHurt = true;
    // boss hits are the only ones that ignore armour
    if (ignoreArmor && src !== 'opp' && !quiet) G.bossHit = true;
    if (G.vs) {
      if (src === 'opp') { G.vs.oppDmg += taken; G.vs.lastHitBy = 'opp'; }
      else G.vs.lastHitBy = 'world';
    }
    if (!quiet) {
      p.hurt = 0.3;
      if (!reduceMotion) G.shake = Math.min(14, G.shake + 8);
      p.vx += nx * 260; p.vy += ny * 260;
      SFX.hurt();
      rumble(Math.min(1, 0.3 + taken / 40), 140);
      blood(p.x, p.y, nx, ny, 4);
    }
    if (p.hp <= 0 && lvl('p_wind') && !G.windUsed) {
      G.windUsed = true; p.hp = lvl('p_wind') >= 2 ? 30 : 1; p.iframe = 1;
      floatText(p.x, p.y - 30, 'SECOND WIND', '#dfeef4');
      unlock('second');
    }
    if (p.hp <= 0 && pRank() >= 9 && !G.revived) {
      G.revived = true; p.hp = p.maxHp / 2; p.iframe = 2;
      G.banner = { title: 'Revived', sub: 'Mythic rank · once per run', t: 2.2 };
      boom(p.x, p.y, 120, '#ff7ad9');
    }
    if (p.hp <= 0) { if (isCoop()) coopDie(); else if (G.vs) vsDie(); else gameOver(); }
  }

  // hostile shots; the host also queues each new one for the guest's copy of the world
  function addShot(s) {
    G.shots.push(s);
    if (isHost()) G.vs.eshots.push(Object.assign({ ag: performance.now() }, s));
  }
  function fire(x, y, a, spd, r, dmg, color, boss) {
    addShot({ k: 'orb', x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r, dmg, life: 5, color, boss: !!boss });
  }

  function boom(x, y, r, color) {
    color = color || '#ff9a3c';
    addPart({ k: 'ring', x, y, r, life: 0.4, max: 0.4, vx: 0, vy: 0, drag: 0, color });
    for (let i = 0; i < 18; i++) {
      const a = rand(0, Math.PI * 2), s = rand(100, 360);
      addPart({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.2, 0.45), max: 0.45, drag: 5, color });
    }
    SFX.boom();
    if (!reduceMotion) G.shake = Math.min(14, G.shake + 5);
  }

  const blocked = (x, y, r) => OBST.some(b => {
    const cx = clamp(x, b.x, b.x + b.w), cy = clamp(y, b.y, b.y + b.h);
    return (x - cx) ** 2 + (y - cy) ** 2 < r * r;
  });

  // ---------- Arcane: ground hazards, wizard spells and beast moves ----------
  const HZ_KEYS = ['fire', 'poison', 'ice'];
  // fire burns while you stand in it, poison keeps ticking and slows you, ice makes you slide
  function addHazard(k, x, y, r, t) {
    if (isGuest()) return;
    if (G.hazards.length > 80) G.hazards.shift();
    G.hazards.push({ k, x: clamp(x, 10, W - 10), y: clamp(y, 10, H - 10), r, t, max: t });
  }
  function hazardTick(dt, p) {
    for (let i = G.hazards.length - 1; i >= 0; i--) {
      const h = G.hazards[i];
      h.t -= dt;
      if (h.t <= 0) { G.hazards.splice(i, 1); continue; }
      if (p.dead || Math.hypot(p.x - h.x, p.y - h.y) > h.r + p.r * 0.4) continue;
      G.hazHit = true;
      if (h.k === 'fire') hurtPlayer(12 * hostileMul() * dt, 0, 0, false, undefined, true);
      else if (h.k === 'poison') { p.poisonT = 2.5; p.slowT = Math.max(p.slowT || 0, 0.25); }
      else p.ice = 0.25;
    }
    if (p.poisonT > 0 && !p.dead) { p.poisonT -= dt; hurtPlayer(4 * hostileMul() * dt, 0, 0, false, undefined, true); }
    p.slowT = Math.max(0, (p.slowT || 0) - dt);
    p.ice = Math.max(0, (p.ice || 0) - dt);
  }
  // a lobbed spell: lands after t seconds with a warning circle, optionally leaving a hazard or striking as lightning
  function lob(e, tx, ty, o) {
    addShot({ k: 'mortar', x0: e.x, y0: e.y, x: clamp(tx, 30, W - 30), y: clamp(ty, 30, H - 30), t: o.t, max: o.t, r: o.r, dmg: o.dmg,
      color: o.color, boss: e.type === 'boss', hz: o.hz, hr: o.hr, ht: o.ht, bolt: o.bolt, slam: o.slam });
  }
  // effects the host also shows on the guest's screen
  function fxOut(f) { if (isHost()) G.vs.fx.push(f); }
  function fxBeam(x1, y1, x2, y2, color) {
    addPart({ k: 'beam', x: x1, y: y1, x2, y2, life: 0.35, max: 0.35, vx: 0, vy: 0, drag: 0, color });
    fxOut(['beam', Math.round(x1), Math.round(y1), Math.round(x2), Math.round(y2), color]);
  }
  function woundedAlly(e, range) {
    let best = null, low = 1;
    for (const o of G.enemies) {
      if (o === e || o.dead || !isWizard(o.type) || TYPES[o.type].minion) continue;
      const f = o.hp / o.max;
      if (f < low && Math.hypot(o.x - e.x, o.y - e.y) < range) { low = f; best = o; }
    }
    return best;
  }
  // Basilisk gaze: if you're looking at it when it lands, you're slowed hard
  function gazeAt(bx, by) {
    const p = G.player;
    addPart({ k: 'ring', x: bx, y: by, r: 140, life: 0.5, max: 0.5, vx: 0, vy: 0, drag: 0, color: '#d8ff6b' });
    if (p.dead) return;
    let da = Math.atan2(by - p.y, bx - p.x) - p.a;
    da = Math.atan2(Math.sin(da), Math.cos(da));
    if (Math.abs(da) < 0.75) {
      p.slowT = Math.max(p.slowT || 0, 2.5);
      hurtPlayer(6, 0, 0, true, undefined, true);
      floatText(p.x, p.y - 30, 'PETRIFIED', '#d8ff6b');
    }
  }
  // Elder Dragon wing gust: shoves you away
  function gustAt(bx, by) {
    const p = G.player;
    addPart({ k: 'ring', x: bx, y: by, r: 520, life: 0.5, max: 0.5, vx: 0, vy: 0, drag: 0, color: 'rgba(255,220,180,0.8)' });
    const dx = p.x - bx, dy = p.y - by, d = Math.hypot(dx, dy) || 1;
    if (p.dead || d > 520) return;
    p.vx += dx / d * 900; p.vy += dy / d * 900;
    hurtPlayer(6, dx / d, dy / d, true);
  }

  function wizardThink(e, d, dt, tg, dist, dx, dy) {
    let sx = dx, sy = dy, k = 1;
    if (e.type === 'cleric') {
      // drift towards the most hurt wizard, otherwise hang back from you
      const ally = woundedAlly(e, 700);
      if (ally) {
        const ax = ally.x - e.x, ay = ally.y - e.y, al = Math.hypot(ax, ay) || 1;
        if (al > 170) { sx = ax / al; sy = ay / al; } else { sx = -dy * e.side; sy = dx * e.side; k = 0.4; }
      } else if (dist < d.keep[1]) { sx = -dx; sy = -dy; }
    } else if (dist < d.keep[0]) { sx = -dx; sy = -dy; }
    else if (dist < d.keep[1]) { sx = -dy * e.side; sy = dx * e.side; k = 0.55; }
    e.castT -= dt;
    if (e.castT <= 0) {
      e.castT = d.cast * rand(0.85, 1.15) / (1 + 0.01 * G.wave);
      if (dist < 700 || e.type === 'cleric') castSpell(e, tg);
    }
    return { sx, sy, k };
  }
  function castSpell(e, tg) {
    const hm = hostileMul(), n = e.casts++;
    const lx = tg.x + (tg.vx || 0) * 0.5, ly = tg.y + (tg.vy || 0) * 0.5;
    if (e.type === 'pyro') lob(e, lx, ly, { t: 0.9, r: 48, dmg: 9 * hm, color: '#ff8a3c', hz: 'fire', hr: 52, ht: 4 });
    else if (e.type === 'witch') lob(e, tg.x + rand(-40, 40), tg.y + rand(-40, 40), { t: 1.1, r: 55, dmg: 5 * hm, color: '#8cff5a', hz: 'poison', hr: 62, ht: 5 });
    else if (e.type === 'frost') {
      const a = Math.atan2(tg.y - e.y, tg.x - e.x);
      for (const o of [-0.18, 0, 0.18]) addShot({ k: 'orb', x: e.x, y: e.y, vx: Math.cos(a + o) * 330, vy: Math.sin(a + o) * 330, r: 6, dmg: 7 * hm, life: 3, color: '#bff4ff', boss: false, slow: 1.4 });
      if (n % 3 === 2) lob(e, tg.x, tg.y, { t: 1, r: 60, dmg: 0, color: '#bff4ff', hz: 'ice', hr: 72, ht: 5 });
    } else if (e.type === 'storm') lob(e, tg.x + (tg.vx || 0) * 0.3, tg.y + (tg.vy || 0) * 0.3, { t: 1, r: 46, dmg: 18 * hm, color: '#fff36b', bolt: true });
    else if (e.type === 'cleric') {
      const ally = woundedAlly(e, 340);
      if (!ally) return;
      const h = ally.max * 0.25;
      ally.hp = Math.min(ally.max, ally.hp + h);
      fxBeam(e.x, e.y, ally.x, ally.y, '#7dffb0');
      floatText(ally.x, ally.y - ally.r - 6, '+' + Math.ceil(h), '#7dffb0');
    } else if (e.type === 'necro') {
      const have = G.enemies.filter(o => o.type === 'skel' && !o.dead).length;
      for (let i = 0; i < 3 && have + i < 12; i++) {
        const a = rand(0, Math.PI * 2);
        const m = makeEnemy('skel', clamp(e.x + Math.cos(a) * 42, 20, W - 20), clamp(e.y + Math.sin(a) * 42, 20, H - 20), 1 + Math.floor(G.wave / 10));
        pushOut(m, m.r);
        G.enemies.push(m);
        addPart({ k: 'ring', x: m.x, y: m.y, r: 24, life: 0.35, max: 0.35, vx: 0, vy: 0, drag: 0, color: '#c78bff' });
      }
    }
    SFX.eshot();
  }

  function bossAttack(e, name, aim) {
    const b = bossList()[e.boss], p = vsTarget(e, G.player), tier = e.boss + 1;
    const spd = (230 + tier * 14) * bossSpd(e), dmg = Math.round((8 + tier) * 1.2 * bossPow(e));
    // lead the target so running in a straight line no longer dodges everything
    const fly = Math.hypot(p.x - e.x, p.y - e.y) / spd;
    const lead = Math.atan2(p.y + p.vy * fly * 0.75 - e.y, p.x + p.vx * fly * 0.75 - e.x);
    const mx = e.x + Math.cos(lead) * e.r, my = e.y + Math.sin(lead) * e.r;
    const fan = (n, spread) => { for (let i = 0; i < n; i++) fire(mx, my, lead + (i / (n - 1) - 0.5) * spread, spd, 7, dmg, b.shot, true); };
    // two staggered rings at different speeds, so the gaps close up
    const ring = n => {
      const o = Math.random() * Math.PI;
      for (let i = 0; i < n; i++) {
        const a = o + i / n * Math.PI * 2;
        fire(e.x, e.y, a, spd * 0.85, 7, dmg, b.shot, true);
        fire(e.x, e.y, a + Math.PI / n, spd * 0.6, 7, dmg, b.shot, true);
      }
    };
    switch (name) {
      case 'aimed3': fan(3, 0.35); break;
      case 'aimed5': fan(5, 0.5); break;
      case 'fan7': fan(7, 0.9); break;
      case 'fan9': fan(9, 1.2); break;
      case 'ring8': ring(8); break;
      case 'ring12': ring(12); break;
      case 'ring16': ring(16); break;
      case 'ring20': ring(20); break;
      case 'charge': e.detour = 0; e.mode = { k: 'windup', t: 0.55, a: lead, left: 1 }; break;
      case 'spiral': e.spin = -(e.spin || 1); e.mode = { k: 'spiral', t: 2.4, a: aim, fire: 0, dir: e.spin }; break;
      case 'stream': e.mode = { k: 'stream', t: 1.3, fire: 0 }; break;
      case 'teleport': e.mode = { k: 'fade', t: 0.45 }; break;
      case 'summon':
      case 'crossfire':
        // boss waves have no regular hostiles, so the old summon is now a wall of bullets
        for (let k = 0; k < 4; k++) for (let j = 0; j < 4; j++) {
          fire(e.x, e.y, lead + Math.PI / 4 + k * Math.PI / 2, spd * (0.55 + 0.15 * j), 7, dmg, b.shot, true);
        }
        fan(5, 0.4);
        break;
      case 'fireball':
        for (const off of [-0.5, -0.25, 0, 0.25, 0.5]) fire(mx, my, lead + off, 190 * bossSpd(e), 15, dmg + 10, b.shot, true);
        break;
      case 'mortar': {
        const n = 4 + Math.floor(e.boss / 3);
        for (let i = 0; i < n; i++) {
          const tx = clamp(p.x + (i ? rand(-140, 140) : p.vx * 0.9), 30, W - 30);
          const ty = clamp(p.y + (i ? rand(-140, 140) : p.vy * 0.9), 30, H - 30);
          const t = 1.1 + i * 0.12;
          addShot({ k: 'mortar', x0: e.x, y0: e.y, x: tx, y: ty, t, max: t, r: 70, dmg: dmg + 6, color: b.shot, boss: true });
        }
        break;
      }
      // ---- beast moves ----
      case 'beam': e.mode = { k: 'beam', t: 1.6, a: lead - 0.7, dir: Math.random() < 0.5 ? 1 : -1, fire: 0 }; if (e.mode.dir < 0) e.mode.a = lead + 0.7; break;
      case 'dive': e.detour = 0; e.mode = { k: 'windup', t: 0.4, a: lead, left: 0, spd: 760, after: 'fan7' }; break;
      case 'triplecharge': e.detour = 0; e.mode = { k: 'windup', t: 0.5, a: lead, left: 2 }; break;
      case 'gaze': e.mode = { k: 'gaze', t: 1.3 }; break;
      case 'trail': e.mode = { k: 'trail', t: 3, drop: 0 }; break;
      case 'volley': e.mode = { k: 'volley', t: 0.95, fire: 0, n: 3 }; break;
      case 'icebreath': case 'firebreath':
        e.mode = { k: 'breath', t: 1.3, a: lead, fire: 0, drop: 0.2, kind: name === 'icebreath' ? 'ice' : 'fire' }; break;
      case 'hstream': e.mode = { k: 'hstream', t: 1.4, fire: 0 }; break;
      case 'fly': e.mode = { k: 'fly', t: 1.2 }; break;
      case 'firering':
        ring(12);
        for (let i = 0; i < 6; i++) addHazard('fire', e.x + Math.cos(i * Math.PI / 3) * 120, e.y + Math.sin(i * Math.PI / 3) * 120, 46, 4);
        break;
      case 'firemortar':
        for (let i = 0; i < 4; i++) lob(e, p.x + (i ? rand(-130, 130) : p.vx * 0.8), p.y + (i ? rand(-130, 130) : p.vy * 0.8),
          { t: 1 + i * 0.12, r: 60, dmg: dmg + 4, color: b.shot, hz: 'fire', hr: 55, ht: 4 });
        break;
      case 'poisonlob':
        for (let i = 0; i < 4; i++) lob(e, p.x + (i ? rand(-150, 150) : 0), p.y + (i ? rand(-150, 150) : 0),
          { t: 1.1 + i * 0.1, r: 60, dmg: dmg * 0.5, color: '#8cff5a', hz: 'poison', hr: 64, ht: 5 });
        break;
      case 'lightning':
        for (let i = 0; i < 4; i++) lob(e, p.x + (i ? rand(-160, 160) : p.vx * 0.4), p.y + (i ? rand(-160, 160) : p.vy * 0.4),
          { t: 0.9 + i * 0.15, r: 46, dmg: dmg + 8, color: '#fff36b', bolt: true });
        break;
      case 'blizzard': {
        const o = Math.random() * Math.PI;
        for (let i = 0; i < 16; i++) {
          const a = o + i / 16 * Math.PI * 2;
          addShot({ k: 'orb', x: e.x, y: e.y, vx: Math.cos(a) * spd * 0.75, vy: Math.sin(a) * spd * 0.75, r: 7, dmg, life: 5, color: '#c8f4ff', boss: true, slow: 1.2 });
        }
        break;
      }
      case 'gust': gustAt(e.x, e.y); fxOut(['gust', Math.round(e.x), Math.round(e.y)]); break;
    }
    SFX.eshot();
  }

  // returns a movement override while the boss is busy with an attack, or null to chase normally
  function bossThink(e, dt, dx, dy) {
    const b = bossList()[e.boss], aim = Math.atan2(dy, dx), m = e.mode;
    const hold = { sx: 0, sy: 0, spd: 0 };
    const tier = e.boss + 1, spdB = (230 + tier * 14) * bossSpd(e), dmgB = Math.round((8 + tier) * 1.2 * bossPow(e));
    e.flying = !!(m && (m.k === 'fly' || m.k === 'land'));
    // the Hydra sprouts a head at two thirds and one third health
    if (b.beast === 'hydra') {
      const want = e.hp < e.max * 0.33 ? 5 : e.hp < e.max * 0.66 ? 4 : 3;
      if (want > (e.heads || 3)) {
        e.heads = want; boom(e.x, e.y, e.r * 1.4, b.shot);
        G.banner = { title: 'The Hydra grows another head', sub: `${want} heads now`, t: 2 };
        if (isHost()) vsSend({ t: 'v.bn', b: G.banner });
      }
    }
    if (m) {
      m.t -= dt;
      if (m.k === 'windup') { e.a = m.a; if (m.t <= 0) e.mode = { k: 'charge', t: 0.75, a: m.a, left: m.left || 0, spd: m.spd, after: m.after }; return hold; }
      if (m.k === 'charge') {
        e.a = m.a;
        // a second, quicker charge re-aimed at wherever you dodged to
        if (m.t <= 0) {
          e.mode = m.left > 0 ? { k: 'windup', t: 0.35, a: aim, left: m.left - 1, spd: m.spd } : null;
          if (!e.mode && m.after) bossAttack(e, m.after, aim);
        }
        return { sx: Math.cos(m.a), sy: Math.sin(m.a), spd: m.spd || 600 };
      }
      if (m.k === 'beam') {
        // a sweeping rainbow of shots
        m.fire -= dt; m.a += (1.4 / 1.6) * dt * m.dir;
        while (m.fire <= 0) {
          m.fire += 0.045;
          fire(e.x + Math.cos(m.a) * e.r, e.y + Math.sin(m.a) * e.r, m.a, spdB * 1.6, 6, dmgB, `hsl(${(performance.now() / 3) % 360},90%,70%)`, true);
        }
        e.a = m.a;
        if (m.t <= 0) e.mode = null;
        return hold;
      }
      if (m.k === 'gaze') {
        if (m.t <= 0) { gazeAt(e.x, e.y); fxOut(['gaze', Math.round(e.x), Math.round(e.y)]); e.mode = null; }
        return hold;
      }
      if (m.k === 'trail') {
        m.drop -= dt;
        if (m.drop <= 0) { m.drop = 0.3; addHazard('poison', e.x, e.y, 50, 5); }
        if (m.t <= 0) e.mode = null;
        return { sx: dx, sy: dy, spd: 150 };
      }
      if (m.k === 'volley') {
        m.fire -= dt;
        if (m.fire <= 0 && m.n > 0) {
          m.fire = 0.28; m.n--;
          for (let i = 0; i < 5; i++) fire(e.x, e.y, aim + (i / 4 - 0.5) * 0.5, spdB * 1.2, 6, dmgB, b.shot, true);
        }
        if (m.t <= 0) e.mode = null;
        return hold;
      }
      if (m.k === 'breath') {
        // a cone of short-lived shots that slowly tracks you and leaves fire or ice behind
        m.fire -= dt; m.drop -= dt;
        let da = aim - m.a; da = Math.atan2(Math.sin(da), Math.cos(da));
        m.a += clamp(da, -0.8 * dt, 0.8 * dt); e.a = m.a;
        while (m.fire <= 0) {
          m.fire += 0.04;
          const a = m.a + rand(-0.3, 0.3), s = 300 * rand(0.8, 1.1);
          addShot({ k: 'orb', x: e.x + Math.cos(m.a) * e.r, y: e.y + Math.sin(m.a) * e.r, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: 7, dmg: dmgB,
            life: 0.9, color: m.kind === 'ice' ? '#c8f4ff' : '#ff7a2a', boss: true, slow: m.kind === 'ice' ? 1 : 0 });
        }
        if (m.drop <= 0) { m.drop = 0.35; const d2 = rand(90, 260); addHazard(m.kind, e.x + Math.cos(m.a) * d2, e.y + Math.sin(m.a) * d2, 48, 4); }
        if (m.t <= 0) e.mode = null;
        return hold;
      }
      if (m.k === 'hstream') {
        // every head fires its own stream
        m.fire -= dt;
        const heads = e.heads || 3;
        while (m.fire <= 0) {
          m.fire += 0.11;
          for (let i = 0; i < heads; i++) {
            const a = aim + (i - (heads - 1) / 2) * 0.35 + Math.sin(m.t * 6 + i) * 0.12;
            fire(e.x + Math.cos(a) * e.r, e.y + Math.sin(a) * e.r, a, spdB * 1.3, 6, dmgB, b.shot, true);
          }
        }
        if (m.t <= 0) e.mode = null;
        return { sx: dx, sy: dy, spd: 25 };
      }
      if (m.k === 'fly') {
        // takes off out of reach, then marks where it will slam down
        if (m.t <= 0) {
          const tg = vsTarget(e, G.player), x = clamp(tg.x, 80, W - 80), y = clamp(tg.y, 80, H - 80);
          addShot({ k: 'mortar', x0: x, y0: y, x, y, t: 0.9, max: 0.9, r: 120, dmg: dmgB + 12, color: b.shot, boss: true, slam: true });
          e.mode = { k: 'land', t: 0.9, x, y };
        }
        return hold;
      }
      if (m.k === 'land') {
        if (m.t <= 0) {
          e.x = m.x; e.y = m.y; e.mode = null; e.flying = false;
          boom(e.x, e.y, 130, b.shot);
          for (let i = 0; i < 16; i++) fire(e.x, e.y, i / 16 * Math.PI * 2, spdB, 7, dmgB, b.shot, true);
          for (let i = 0; i < 6; i++) addHazard('fire', e.x + Math.cos(i * Math.PI / 3) * 110, e.y + Math.sin(i * Math.PI / 3) * 110, 44, 4);
        }
        return hold;
      }
      if (m.k === 'spiral') {
        m.fire -= dt;
        while (m.fire <= 0) {
          m.fire += 0.075; m.a += 0.3 * (m.dir || 1);
          for (let i = 0; i < 3; i++) fire(e.x, e.y, m.a + i * Math.PI * 2 / 3, (210 + e.boss * 12) * bossSpd(e), 6, Math.round((8 + e.boss) * 1.2 * bossPow(e)), b.shot, true);
        }
        if (m.t <= 0) e.mode = null;
        return hold;
      }
      if (m.k === 'stream') {
        m.fire -= dt;
        while (m.fire <= 0) {
          m.fire += 0.09;
          const sw = aim + Math.sin(m.t * 9) * 0.25;
          fire(e.x + Math.cos(sw) * e.r, e.y + Math.sin(sw) * e.r, sw, 360 * bossSpd(e), 6, Math.round((7 + e.boss) * 1.2 * bossPow(e)), b.shot, true);
        }
        if (m.t <= 0) e.mode = null;
        return { sx: dx, sy: dy, spd: 30 };
      }
      if (m.k === 'fade') {
        if (m.t <= 0) {
          const p = vsTarget(e, G.player);
          for (let i = 0; i < 25; i++) {
            const x = rand(80, W - 80), y = rand(80, H - 80);
            if (Math.hypot(x - p.x, y - p.y) > 260 && !blocked(x, y, e.r)) { e.x = x; e.y = y; break; }
          }
          e.mode = { k: 'appear', t: 0.4 };
          boom(e.x, e.y, e.r * 1.6, b.shot);
          for (let i = 0; i < 12; i++) fire(e.x, e.y, i / 12 * Math.PI * 2, (200 + e.boss * 10) * bossSpd(e), 7, Math.round((8 + e.boss) * 1.2 * bossPow(e)), b.shot, true);
        }
        return hold;
      }
      if (m.k === 'appear') { if (m.t <= 0) e.mode = null; return hold; }
    }
    e.atkT -= dt;
    if (e.atkT <= 0) {
      bossAttack(e, b.attacks[e.atkI % b.attacks.length], aim);
      e.atkI++;
      e.atkT = Math.max(0.45, b.cd * Math.pow(0.92, e.loop || 0) * (e.hp < e.max * 0.5 ? 0.65 : 1));
    }
    return null;
  }

  function wantsFire() {
    if (touch.aim) { const v = stick(touch.aim); return Math.hypot(v.x, v.y) > 0.45; }
    return mouse.down || keys[' '] || pad.fire;
  }

  function updateAim() {
    const p = G.player;
    if (touch.aim) {
      const v = stick(touch.aim);
      if (Math.hypot(v.x, v.y) > 0.2) p.a = Math.atan2(v.y, v.x);
    } else if (padMode) {
      if (Math.hypot(pad.rx, pad.ry) > 0.25) p.a = Math.atan2(pad.ry, pad.rx);
    } else if (!touchMode && mouse.seen) {
      const c = cam();
      p.a = Math.atan2(c.y + mouse.y / scale - p.y, c.x + mouse.x / scale - p.x);
    }
  }

  function update(dt) {
    const p = G.player;
    if (G.banner.t > 0) G.banner.t -= dt;
    p.prot = Math.max(0, (p.prot || 0) - dt);
    G.time = (G.time || 0) + dt; STATS.time += dt;
    if (G.hazards.length || p.poisonT > 0 || p.slowT > 0 || p.ice > 0) hazardTick(dt, p);

    // a downed versus player sits out until the next wave
    if (!p.dead) {
    // movement
    let mx =(keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
    let my = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
    if (touch.move) { const v = stick(touch.move); mx += v.x; my += v.y; }
    mx += pad.mx; my += pad.my;
    const ml = Math.hypot(mx, my);
    if (ml > 1) { mx /= ml; my /= ml; }
    // ice makes you slide; frost shards and poison slow you
    const k = Math.min(1, dt * (p.ice > 0 ? 2.5 : 14));
    const spd = moveSpeed() * (p.slowT > 0 ? 0.6 : 1);
    p.vx += (mx * spd - p.vx) * k; p.vy += (my * spd - p.vy) * k;
    p.x = clamp(p.x + p.vx * dt, p.r, W - p.r);
    p.y = clamp(p.y + p.vy * dt, p.r, H - p.r);
    pushOut(p, p.r);
    updateAim();

    // gun
    p.cool -= dt; p.flash -= dt; p.hurt -= dt; p.swing = Math.max(0, (p.swing || 0) - dt);
    p.iframe = (p.iframe || 0) - dt; p.spCool = Math.max(0, (p.spCool || 0) - dt);
    p.spinFx = Math.max(0, (p.spinFx || 0) - dt); p.idle = (p.idle || 0) + dt;
    p.spinT = wantsFire() && !p.melee ? Math.min(2, (p.spinT || 0) + dt) : Math.max(0, (p.spinT || 0) - 2 * dt);
    if (lvl('regen') && p.hp > 0) p.hp = Math.min(p.maxHp, p.hp + 0.4 * lvl('regen') * dt);
    if (p.reload > 0) {
      p.reload -= dt;
      if (p.reload <= 0) { const n = Math.min(magSize() - p.mag, p.res); p.mag += n; p.res -= n; p.reload = 0; }
    }
    if (!p.melee && p.mag === 0 && p.res === 0) {
      p.melee = true; p.reload = 0; p.cool = Math.max(p.cool, 0.2);
      floatText(p.x, p.y - 26, `Out of ammo · ${meleeDef().name}`, '#f2b134');
      SFX.swap();
    }
    if (p.melee) { if (wantsFire() && p.cool <= 0) swing(); }
    else if (wantsFire() && p.cool <= 0 && p.reload <= 0) {
      if (p.mag > 0) shoot();
      else if (p.res > 0) tryReload();
      else { SFX.dry(); p.cool = 0.35; }
    }
    }

    // bullets
    for (let i = G.bullets.length - 1; i >= 0; i--) {
      const b = G.bullets[i];
      b.px = b.x; b.py = b.y;
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      let dead = b.life <= 0 || b.x < 0 || b.y < 0 || b.x > W || b.y > H;
      if (!dead && inObstacle(b.x, b.y)) {
        sparks(b.px, b.py, b.vx, b.vy);
        if (b.bounce > 0) {
          // ricochet off whichever face it crossed
          b.bounce--;
          if (!inObstacle(b.px, b.y)) b.vx = -b.vx; else b.vy = -b.vy;
          b.x = b.px; b.y = b.py; b.hits = [];
        } else dead = true;
      }
      // your bullets stop on the other player's soldier; their own game decides the damage
      if (!dead && G.vs && !G.vs.coop) {
        const o = G.vs.opp;
        if (o.seen0 && !o.dead && !o.prot && Math.hypot(o.x - b.x, o.y - b.y) < 18) { dead = true; blood(b.x, b.y, b.vx, b.vy, 3); }
      }
      if (!dead) for (const e of G.enemies) {
        if (e.dead || e.flying || (b.hits && b.hits.includes(e.id))) continue;
        const dx = e.x - b.x, dy = e.y - b.y;
        if (dx * dx + dy * dy < e.r * e.r) {
          if (b.melee ? meleeProof(e) : gunProof(e)) {
            sparks(b.px, b.py, b.vx, b.vy); immuneTip(e, b.melee ? 'GUNS ONLY' : 'MELEE ONLY'); dead = true; break;
          }
          damage(e, b);
          if (b.boom && !b.boomed) { b.boomed = true; splash(b.x, b.y, b.boom, b.dmg * 0.5, e); }
          if (b.pierce > 0) { b.pierce--; b.hits.push(e.id); if (b.overpen) b.dmg *= 1 + 0.25 * b.overpen; continue; }
          dead = true; break;
        }
      }
      if (dead) G.bullets.splice(i, 1);
    }

    // shockwaves roll outward and hit each hostile once as they pass
    for (let i = G.waves.length - 1; i >= 0; i--) {
      const w = G.waves[i];
      w.r += 560 * dt;
      for (const e of G.enemies) {
        if (e.dead || e.flying || w.hit.includes(e.id)) continue;
        const dx = e.x - w.x, dy = e.y - w.y;
        if (Math.hypot(dx, dy) > w.r + e.r) continue;
        w.hit.push(e.id);
        if (meleeProof(e)) { immuneTip(e, 'GUNS ONLY'); continue; }
        damage(e, { vx: dx || 0.01, vy: dy, dmg: w.dmg, kb: 3, melee: true });
        if (e.dead && ++w.kills >= 10) unlock('crowd');
      }
      if (w.r >= w.max) G.waves.splice(i, 1);
    }
    G.enemies = G.enemies.filter(e => !e.dead);

    // enemies
    const spdMul = Math.min(1.8 + 0.02 * extraWaves(), 2.3, 1 + 0.05 * (G.wave - 1));
    // runners stay a bit slower than you, so one sitting inside you can always be outrun
    const runnerCap = moveSpeed() * 0.8;
    if (isGuest()) vsGuestEnemies(dt, p);
    else for (const e of G.enemies) {
      if (e.dead) continue;
      if (e.dot > 0) {
        e.dot -= dt;
        if (!(e.dotMelee ? meleeProof(e) : gunProof(e))) {
          e.hp -= e.dotDps * dt; phaseHit(e, e.dotDps * dt);
          if (e.hp <= 0) { kill(e); continue; }
        }
        if (Math.random() < dt * 10) addPart({ k: 'spark', x: e.x + rand(-0.6, 0.6) * e.r, y: e.y + rand(-0.6, 0.6) * e.r,
          vx: 0, vy: -60, life: 0.3, max: 0.3, drag: 2, color: e.dotMelee ? '#c2261b' : '#ff8a3c' });
      }
      const d = defOf(e), tg = vsTarget(e, p);
      let dx = tg.x - e.x, dy = tg.y - e.y;
      const dist = Math.hypot(dx, dy) || 1;
      dx /= dist; dy /= dist;
      e.a = Math.atan2(dy, dx);
      let sx = dx, sy = dy, spd = d.speed * spdMul;
      if (e.type === 'runner' || e.type === 'skel') {
        spd = Math.min(spd, runnerCap);
        // after biting you, a runner stumbles for a moment so you can get clear
        if (e.slow > 0) { e.slow -= dt; spd *= 0.35; }
      }
      if (e.chill > 0) { e.chill -= dt; spd *= 1 - e.chillAmt; }
      if (e.stun > 0) { e.stun -= dt; spd = 0; }
      if (e.type === 'gunner') {
        if (dist < 240) { sx = -dx; sy = -dy; }
        else if (dist < 340) { sx = -dy * e.side; sy = dx * e.side; spd *= 0.6; }
        e.fireT -= dt;
        if (e.fireT <= 0) {
          if (dist < 600) {
            const ca = Math.cos(e.a), sa = Math.sin(e.a);
            fire(e.x + ca * e.r * 1.85 - sa * e.r * 0.36, e.y + sa * e.r * 1.85 + ca * e.r * 0.36, e.a + rand(-0.05, 0.05), 300, 6, Math.round(9 * hostileMul()), '#ff6b5a');
            SFX.eshot();
            e.fireT = rand(1.5, 2.2) / (1 + 0.02 * extraWaves());
          } else e.fireT = 0.5;
        }
      } else if (e.type === 'boss') {
        const mv = bossThink(e, dt, dx, dy);
        if (mv) { sx = mv.sx; sy = mv.sy; spd = mv.spd; }
      } else if (d.keep) {
        const mv = wizardThink(e, d, dt, tg, dist, dx, dy);
        sx = mv.sx; sy = mv.sy; spd *= mv.k;
      }
      if (e.detour > 0) { e.detour -= dt; sx += -dy * e.side * 1.4; sy += dx * e.side * 1.4; }
      for (const o of G.enemies) {
        if (o === e || e.type === 'boss') continue;
        const ox = e.x - o.x, oy = e.y - o.y, rr = e.r + o.r + 4, d2 = ox * ox + oy * oy;
        if (d2 < rr * rr && d2 > 0.01) { const dd = Math.sqrt(d2), f = (rr - dd) / rr * 1.5; sx += ox / dd * f; sy += oy / dd * f; }
      }
      const sl = Math.hypot(sx, sy) || 1;
      const x0 = e.x, y0 = e.y;
      e.x = clamp(e.x + sx / sl * spd * dt, e.r, W - e.r);
      e.y = clamp(e.y + sy / sl * spd * dt, e.r, H - e.r);
      pushOut(e, e.r);
      const moved = Math.hypot(e.x - x0, e.y - y0);

  function drawWizard(e) {
    const d = TYPES[e.type], r = e.r, hit = e.flash > 0, t = performance.now() / 1000;
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ellipse(3, 5, r * 1.05, r * 0.9);

      ctx.strokeStyle = `rgba(125,255,176,${0.45 + 0.2 * Math.sin(t * 5)})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, r * 1.8, 0, Math.PI * 2); ctx.stroke();
    }
    if (e.type === 'storm') {
      // crackling electric aura
      ctx.strokeStyle = 'rgba(255,243,107,0.8)'; ctx.lineWidth = 1.5;
      for (let i = 0; i < 3; i++) {
        const a = t * 7 + i * 2.1 + e.id;
        ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * 1.1, Math.sin(a) * r * 1.1);

      ctx.beginPath(); for (const y of [-0.5, 0, 0.5]) { ctx.moveTo(-r * 0.5, r * y); ctx.lineTo(r * 0.3, r * y); } ctx.stroke();
      ctx.fillStyle = hit ? '#ffffff' : '#f2ede0'; circle(r * 0.45, 0, r * 0.5);
      ctx.fillStyle = '#1a1210'; circle(r * 0.6, -r * 0.2, 1.6); circle(r * 0.6, r * 0.2, 1.6);
    } else {
      // staff, with its tip glowing brighter just before a cast
      const sw = Math.sin(e.step) * 2, charge = e.castT != null && e.castT < 0.4 ? 1 - Math.max(0, e.castT) / 0.4 : 0;
      ctx.strokeStyle = '#5a3a1e'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(r * 0.1, r * 0.65 + sw); ctx.lineTo(r * 1.5, r * 0.65 + sw); ctx.stroke();
      ctx.shadowColor = d.glow; ctx.shadowBlur = 8 + charge * 14;
      ctx.fillStyle = d.glow; circle(r * 1.58, r * 0.65 + sw, 3.5 + charge * 3 + Math.sin(t * 6 + e.id) * 0.6);
      ctx.shadowBlur = 0;

      ctx.fillStyle = hit ? '#ffffff' : d.body; ellipse(0, 0, r * 0.85, r);
      ctx.strokeStyle = d.dark; ctx.lineWidth = 2; ctx.stroke();

      ctx.fillStyle = hit ? '#dddddd' : d.dark; circle(r * 0.05, 0, r * 0.62);
      ctx.fillStyle = hit ? '#eeeeee' : d.body;
      ctx.beginPath(); ctx.moveTo(r * 0.3, -r * 0.32); ctx.lineTo(-r * 0.75, 0); ctx.lineTo(r * 0.3, r * 0.32); ctx.closePath(); ctx.fill();
      ctx.fillStyle = d.glow; circle(r * 0.5, -r * 0.18, 1.6); circle(r * 0.5, r * 0.18, 1.6);
    }
    ctx.restore();
    if (e.hp < e.max) {
      const w = r * 2;
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(e.x - w / 2, e.y - r - 10, w, 4);
      ctx.fillStyle = '#d8453a'; ctx.fillRect(e.x - w / 2, e.y - r - 10, w * e.hp / e.max, 4);
    }
  }

  // melee-only / guns-only phase visuals, shared by pigs and beasts
  function drawShieldFx(e, r, t) {
    const sh = bossShield(e);
    if (sh === 'any') return;
    const pulse = 0.5 + 0.5 * Math.sin(t * 6);
    if (sh === 'melee') {
      ctx.fillStyle = 'rgba(120,200,255,0.12)'; circle(0, 0, r * 1.35);
      ctx.strokeStyle = `rgba(120,200,255,${0.5 + 0.35 * pulse})`; ctx.lineWidth = 4;

      ctx.fillStyle = `rgba(200,140,255,${0.55 + 0.35 * pulse})`;

        ctx.lineTo(Math.cos(a) * r * 1.6, Math.sin(a) * r * 1.6);
        ctx.lineTo(Math.cos(a + 0.12) * r * 1.1, Math.sin(a + 0.12) * r * 1.1);
        ctx.closePath(); ctx.fill();

  }

  // the Arcane bosses, each drawn facing +x
  function drawBeast(e) {
    const b = BEASTS[e.boss], r = e.r, hit = e.flash > 0, t = performance.now() / 1000, m = e.mode;
    const body = hit ? '#ffffff' : b.color, dark = hit ? '#dddddd' : b.dark, sw = Math.sin(e.step) * r * 0.15;
    let alpha = 1;
    if (m && m.k === 'fly') alpha = Math.max(0.12, m.t / 1.2);
    if (m && m.k === 'land') alpha = 0.12;
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ellipse(4, 7, r * 1.15, r * 0.85);
    ctx.globalAlpha = alpha;
    if (m && m.k === 'windup') {
      ctx.strokeStyle = `rgba(216,69,58,${0.25 + 0.5 * (1 - m.t / 0.6)})`; ctx.lineWidth = r * 0.9; ctx.lineCap = 'butt';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(m.a) * 420, Math.sin(m.a) * 420); ctx.stroke();
    }
    if (m && m.k === 'gaze') {
      // the stare charges up: look away before it lands
      ctx.fillStyle = `rgba(216,255,107,${0.15 + 0.35 * (1 - m.t / 1.3)})`; circle(0, 0, r * 2.4);
    }
    ctx.rotate(e.a);
    const legs = () => {
      ctx.fillStyle = dark;
      ellipse(r * 0.5 + sw, -r * 0.62, r * 0.2, r * 0.13); ellipse(r * 0.5 - sw, r * 0.62, r * 0.2, r * 0.13);
      ellipse(-r * 0.5 - sw, -r * 0.6, r * 0.2, r * 0.13); ellipse(-r * 0.5 + sw, r * 0.6, r * 0.2, r * 0.13);
    };
    const wings = (span, col) => {
      const flap = Math.sin(t * 6) * 0.25;
      ctx.fillStyle = col;
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(r * 0.2, s * r * 0.3);
        ctx.quadraticCurveTo(-r * 0.2, s * r * (span + flap), -r * 0.9, s * r * (span * 0.9 + flap));
        ctx.lineTo(-r * 0.5, s * r * 0.35); ctx.closePath(); ctx.fill();
      }
    };
    const eyes = (x, y, col) => { ctx.fillStyle = col; circle(x, y - r * 0.12, r * 0.05); circle(x, y + r * 0.12, r * 0.05); };
    const head = (x, y, s, col) => { ctx.fillStyle = col; circle(x, y, r * s); };
    switch (b.beast) {
      case 'unicorn':

        for (let i = 0; i < 6; i++) { ctx.fillStyle = `hsl(${i * 55 + t * 80},85%,68%)`; circle(r * 0.15 + i * r * 0.12, -r * 0.25, r * 0.12); }
        head(r * 0.95, 0, 0.4, body);
        ctx.fillStyle = '#f2c14e'; ctx.beginPath(); ctx.moveTo(r * 1.15, -r * 0.08); ctx.lineTo(r * 1.75, 0); ctx.lineTo(r * 1.15, r * 0.08); ctx.closePath(); ctx.fill();
        eyes(r * 1.08, 0, '#5a4a8a');
        break;
      case 'griffin':
        wings(1.5, dark);
        legs();
        ctx.fillStyle = body; ellipse(0, 0, r, r * 0.6);
        head(r * 0.9, 0, 0.42, hit ? '#fff' : '#f4efe0');
        ctx.fillStyle = '#f2c14e'; ctx.beginPath(); ctx.moveTo(r * 1.2, -r * 0.12); ctx.lineTo(r * 1.55, 0); ctx.lineTo(r * 1.2, r * 0.12); ctx.closePath(); ctx.fill();
        eyes(r * 1.0, 0, '#1a1210');
        break;
      case 'basilisk': case 'wyrm': {
        // a coiled serpent: segments trail behind the head and sway
        const n = b.beast === 'wyrm' ? 8 : 7;
        for (let i = n; i >= 1; i--) {
          ctx.fillStyle = i % 2 ? body : dark;
          circle(-i * r * 0.42, Math.sin(e.step * 0.6 + i * 0.8) * r * 0.35, r * (0.62 - i * 0.04));
        }
        if (b.beast === 'wyrm') { ctx.fillStyle = hit ? '#fff' : '#e8f8ff'; for (let i = 1; i < n; i += 2) circle(-i * r * 0.42, Math.sin(e.step * 0.6 + i * 0.8) * r * 0.35 - r * 0.35, r * 0.1); }
        head(r * 0.3, 0, 0.62, body);
        ctx.fillStyle = dark; ellipse(r * 0.75, 0, r * 0.35, r * 0.28);
        eyes(r * 0.75, 0, m && m.k === 'gaze' ? '#ffffff' : b.beast === 'wyrm' ? '#9fe7ff' : '#d8ff6b');
        break;
      }
      case 'phoenix': {
        const flame = e.reborn ? '#7fd8ff' : '#ffb347';
        for (let i = 0; i < 7; i++) { ctx.fillStyle = `rgba(255,${120 + i * 15},40,0.75)`; circle(-r * 0.9 - i * r * 0.12, Math.sin(t * 10 + i) * r * 0.2, r * (0.3 - i * 0.03)); }
        wings(1.7, e.reborn ? 'rgba(127,216,255,0.85)' : 'rgba(255,120,40,0.85)');
        ctx.fillStyle = body; ellipse(0, 0, r * 0.8, r * 0.5);
        head(r * 0.75, 0, 0.32, flame);
        ctx.fillStyle = '#f2c14e'; ctx.beginPath(); ctx.moveTo(r * 0.98, -r * 0.08); ctx.lineTo(r * 1.3, 0); ctx.lineTo(r * 0.98, r * 0.08); ctx.closePath(); ctx.fill();
        eyes(r * 0.85, 0, '#fff6ea');
        break;
      }
      case 'manticore':
        wings(1.3, '#3a1a1a');
        // scorpion tail arching over the back
        ctx.strokeStyle = dark; ctx.lineWidth = r * 0.16; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-r * 0.8, 0); ctx.quadraticCurveTo(-r * 1.6, -r * 0.8, -r * 0.6, -r * 0.9); ctx.stroke();
        ctx.fillStyle = '#e8d16b'; circle(-r * 0.55, -r * 0.92, r * 0.13);
        legs();
        ctx.fillStyle = body; ellipse(0, 0, r, r * 0.62);
        head(r * 0.85, 0, 0.55, dark);
        head(r * 0.95, 0, 0.36, body);
        eyes(r * 1.1, 0, '#ffd36b');
        break;
      case 'chimera':
        // snake tail, lion body and head, goat head on the side
        ctx.strokeStyle = '#3f6b2a'; ctx.lineWidth = r * 0.14;
        ctx.beginPath(); ctx.moveTo(-r * 0.8, 0); ctx.quadraticCurveTo(-r * 1.5, r * 0.6, -r * 1.3, r * 0.1); ctx.stroke();
        head(-r * 1.3, r * 0.1, 0.16, '#3f6b2a');
        legs();
        ctx.fillStyle = body; ellipse(0, 0, r, r * 0.62);
        head(r * 0.3, -r * 0.45, 0.28, hit ? '#fff' : '#d8cbb0');
        ctx.strokeStyle = '#6e6249'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(r * 0.3, -r * 0.6, r * 0.18, Math.PI, Math.PI * 1.9); ctx.stroke();
        head(r * 0.85, 0, 0.52, dark);
        head(r * 0.95, 0, 0.34, body);
        eyes(r * 1.1, 0, '#ff6b5a');
        break;
      case 'hydra': {
        const heads = e.heads || (e.hp < e.max * 0.33 ? 5 : e.hp < e.max * 0.66 ? 4 : 3);
        ctx.fillStyle = body; ellipse(-r * 0.2, 0, r * 0.95, r * 0.75);
        for (let i = 0; i < heads; i++) {
          const a = (i - (heads - 1) / 2) * 0.45 + Math.sin(t * 2 + i) * 0.08;
          const hx = Math.cos(a) * r * 1.25, hy = Math.sin(a) * r * 1.25;
          ctx.strokeStyle = body; ctx.lineWidth = r * 0.22; ctx.lineCap = 'round';

          head(hx, hy, 0.24, dark);
          ctx.fillStyle = '#ffd36b'; circle(hx + r * 0.1, hy - r * 0.07, r * 0.04); circle(hx + r * 0.1, hy + r * 0.07, r * 0.04);
        }
        break;
      }
      case 'cerberus':
        legs();
        ctx.fillStyle = body; ellipse(0, 0, r, r * 0.6);
        ctx.fillStyle = '#8a1a14'; ctx.fillRect(r * 0.35, -r * 0.55, r * 0.12, r * 1.1);
        for (const s of [-1, 0, 1]) { head(r * 0.85, s * r * 0.42, 0.3, dark); eyes(r * 0.98, s * r * 0.42, '#ff4d2a'); }
        break;
      case 'dragon':
        wings(1.8, hit ? '#fff' : '#5a0e08');
        ctx.strokeStyle = dark; ctx.lineWidth = r * 0.22; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-r * 0.7, 0); ctx.quadraticCurveTo(-r * 1.5, r * 0.4 * Math.sin(t * 2), -r * 1.9, 0); ctx.stroke();
        legs();
        ctx.fillStyle = body; ellipse(0, 0, r, r * 0.6);
        ctx.strokeStyle = body; ctx.lineWidth = r * 0.3;
        ctx.beginPath(); ctx.moveTo(r * 0.6, 0); ctx.lineTo(r * 1.1, 0); ctx.stroke();
        head(r * 1.2, 0, 0.34, dark);
        ctx.fillStyle = '#f4efe0';
        for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(r * 1.1, s * r * 0.2); ctx.lineTo(r * 0.8, s * r * 0.48); ctx.lineTo(r * 1.2, s * r * 0.28); ctx.closePath(); ctx.fill(); }
        if (m && m.k === 'breath') { ctx.fillStyle = 'rgba(255,140,40,0.8)'; circle(r * 1.5, 0, r * 0.16 + Math.sin(t * 30) * 2); }

    ctx.restore();
  }

  function drawPig(e) {
    const b = BOSSES[e.boss], r = e.r, hit = e.flash > 0, t = performance.now() / 1000, m = e.mode;
    let alpha = 1;
    if (m && m.k === 'fade') alpha = Math.max(0.05, m.t / 0.45);
    if (m && m.k === 'appear') alpha = 1 - Math.max(0, m.t) / 0.4;
    if (b.ghost) alpha *= 0.7 + Math.sin(t * 8) * 0.1;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(e.x, e.y);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ellipse(4, 7, r * 1.15, r * 0.85);
    if (m && m.k === 'windup') {
      ctx.strokeStyle = `rgba(216,69,58,${0.25 + 0.5 * (1 - m.t / 0.7)})`; ctx.lineWidth = r * 0.9; ctx.lineCap = 'butt';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(m.a) * 420, Math.sin(m.a) * 420); ctx.stroke();
    }
    ctx.rotate(e.a);
    const sw = Math.sin(e.step) * r * 0.18, body = hit ? '#ffffff' : b.color;
    // legs and tail
    ctx.fillStyle = b.dark;
    ellipse(r * 0.5 + sw, -r * 0.66, r * 0.2, r * 0.14); ellipse(r * 0.5 - sw, r * 0.66, r * 0.2, r * 0.14);
    ellipse(-r * 0.55 - sw, -r * 0.62, r * 0.2, r * 0.14); ellipse(-r * 0.55 + sw, r * 0.62, r * 0.2, r * 0.14);
    ctx.strokeStyle = b.dark; ctx.lineWidth = Math.max(2, r * 0.07); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(-r * 1.08, 0, r * 0.13, 0.5, Math.PI * 1.8); ctx.stroke();
    // body
    ctx.fillStyle = body;
    if (b.wool) for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2; circle(Math.cos(a) * r * 0.95, Math.sin(a) * r * 0.68, r * 0.22); }
    ellipse(0, 0, r, r * 0.72);
    ctx.strokeStyle = b.dark; ctx.lineWidth = 2; ctx.stroke();
    if (b.spots && !hit) {
      ctx.fillStyle = b.dark;
      ellipse(-r * 0.3, -r * 0.25, r * 0.22, r * 0.16); ellipse(r * 0.2, r * 0.3, r * 0.18, r * 0.13); ellipse(-r * 0.6, r * 0.2, r * 0.14, r * 0.12);
    }

      ctx.strokeStyle = b.dark; ctx.lineWidth = 2; ctx.beginPath();

      ctx.stroke();
    }
    if (b.cyber) {

      ctx.moveTo(-r * 0.4, -r * 0.68); ctx.lineTo(-r * 0.4, r * 0.68); ctx.moveTo(r * 0.2, -r * 0.7); ctx.lineTo(r * 0.2, r * 0.7);
      ctx.stroke();
      ctx.fillStyle = '#6be3ff'; ctx.fillRect(-r * 0.15, -r * 0.08, r * 0.3, r * 0.16);
    }
    if (b.fire) {
      for (let i = 0; i < 6; i++) {
        ctx.fillStyle = `rgba(255,${120 + (i * 37) % 90},40,0.75)`;
        circle(-r * 0.6 + i * r * 0.2, Math.sin(t * 10 + i) * r * 0.15, r * (0.12 + 0.05 * Math.sin(t * 8 + i)));
      }

    ctx.fillStyle = hit ? '#ffffff' : b.dark;

      ctx.beginPath(); ctx.moveTo(hx - r * 0.15, s * r * 0.18); ctx.lineTo(hx - r * 0.5, s * r * 0.6); ctx.lineTo(hx + r * 0.1, s * r * 0.42);

    ctx.fillStyle = b.dark; circle(hx + r * 0.47, -r * 0.08, r * 0.035); circle(hx + r * 0.47, r * 0.08, r * 0.035);
    const angry = e.hp < e.max * 0.5;
    ctx.fillStyle = b.cyber || angry ? '#ff3b2f' : '#1a1210';
    circle(hx + r * 0.14, -r * 0.2, r * 0.06); circle(hx + r * 0.14, r * 0.2, r * 0.06);
    if (b.crown) {
      ctx.fillStyle = '#f2c14e';
      for (let i = 0; i < 5; i++) {
        const a = i / 5 * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(hx + Math.cos(a - 0.3) * r * 0.22, Math.sin(a - 0.3) * r * 0.22);
        ctx.lineTo(hx + Math.cos(a) * r * 0.42, Math.sin(a) * r * 0.42);
        ctx.lineTo(hx + Math.cos(a + 0.3) * r * 0.22, Math.sin(a + 0.3) * r * 0.22);
        ctx.closePath(); ctx.fill();
      }
      ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(hx, 0, r * 0.22, 0, Math.PI * 2); ctx.stroke();
    }

  }

  function drawHazards() {
    const t = performance.now() / 1000;
    for (const h of G.hazards) {
      const a = Math.min(1, h.t / 0.6, (h.max - h.t) / 0.25 + 0.2);
      ctx.save();
      ctx.globalAlpha = a;
      if (h.k === 'fire') {
        const g = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, h.r);
        g.addColorStop(0, 'rgba(255,170,60,0.55)'); g.addColorStop(0.7, 'rgba(230,80,30,0.35)'); g.addColorStop(1, 'rgba(160,30,10,0)');
        ctx.fillStyle = g; circle(h.x, h.y, h.r);
        // flickering flames
        for (let i = 0; i < 5; i++) {
          const fa = i * 1.3 + h.x, fr = h.r * 0.5 * ((i * 37) % 10) / 10;
          ctx.fillStyle = `rgba(255,${150 + (i * 23) % 80},40,0.7)`;
          circle(h.x + Math.cos(fa) * fr, h.y + Math.sin(fa) * fr, 4 + 2 * Math.sin(t * 9 + i));
        }
      } else if (h.k === 'poison') {
        ctx.fillStyle = 'rgba(120,230,70,0.25)'; circle(h.x, h.y, h.r);
        ctx.strokeStyle = 'rgba(150,255,90,0.55)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2); ctx.stroke();
        // bubbles
        for (let i = 0; i < 4; i++) {
          const ba = i * 1.7 + h.y, br = h.r * 0.6 * ((i * 53) % 10) / 10, bz = (t * 0.8 + i * 0.25) % 1;
          ctx.strokeStyle = `rgba(190,255,140,${0.7 * (1 - bz)})`; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(h.x + Math.cos(ba) * br, h.y + Math.sin(ba) * br, 2 + bz * 5, 0, Math.PI * 2); ctx.stroke();
        }
      } else {
        ctx.fillStyle = 'rgba(200,240,255,0.28)'; circle(h.x, h.y, h.r);
        ctx.strokeStyle = 'rgba(235,250,255,0.7)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(h.x - h.r * 0.5, h.y - h.r * 0.2); ctx.lineTo(h.x + h.r * 0.3, h.y + h.r * 0.4);
        ctx.moveTo(h.x - h.r * 0.1, h.y - h.r * 0.6); ctx.lineTo(h.x + h.r * 0.5, h.y - h.r * 0.1); ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawWarnings() {
    for (const s of G.shots) {
      if (s.k !== 'mortar') continue;
      const prog = clamp(1 - s.t / s.max, 0, 1);
      // the warning circle takes the colour of what's about to land
      const c = s.bolt ? '255,243,107' : s.hz === 'poison' ? '140,255,90' : s.hz === 'ice' ? '191,244,255' : s.hz === 'fire' ? '255,138,60' : '216,69,58';
      ctx.fillStyle = `rgba(${c},${0.08 + prog * 0.2})`; circle(s.x, s.y, s.r);
      ctx.strokeStyle = `rgba(${c},0.7)`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * prog, 0, Math.PI * 2); ctx.stroke();
    }
  }

  function drawShots() {
    for (const s of G.shots) {
      if (s.k === 'mortar') {
        if (s.bolt || s.slam) continue;
        const prog = clamp(1 - s.t / s.max, 0, 1), lift = Math.sin(prog * Math.PI);
        const x = s.x0 + (s.x - s.x0) * prog, y = s.y0 + (s.y - s.y0) * prog - lift * 120;
        ctx.fillStyle = '#2b2b2b'; circle(x, y, 7 + lift * 4);
        ctx.fillStyle = s.color; circle(x, y, 3);
      } else {
        ctx.fillStyle = s.color;
        ctx.globalAlpha = 0.3; circle(s.x, s.y, s.r * 1.9); ctx.globalAlpha = 1;
        circle(s.x, s.y, s.r);
        ctx.fillStyle = '#fff6ea'; circle(s.x, s.y, s.r * 0.45);
      }
    }
  }

  function drawMeleeShot(b) {
    ctx.save();
    ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx));
    if (b.k === 'knife') {
      ctx.fillStyle = '#c9d1d6'; ctx.fillRect(-8, -1.5, 14, 3);
      ctx.fillStyle = '#2b2b2b'; ctx.fillRect(-12, -2, 5, 4);
    } else if (b.k === 'ball') {
      ctx.fillStyle = '#f4efe0'; circle(0, 0, 5);
    } else {
      const moon = b.k === 'moon';
      ctx.strokeStyle = moon ? 'rgba(200,150,255,0.85)' : 'rgba(255,240,210,0.85)'; ctx.lineWidth = moon ? 5 : 4;
      ctx.beginPath(); ctx.arc(-10, 0, moon ? 22 : 16, -1.1, 1.1); ctx.stroke();
    }
    ctx.restore();
  }

  // the other soldiers: your opponent in versus, your squadmates in co-op
  function drawOpponent() {
    for (const o of G.vs.peers) {
      if (o.seen0 && !o.dead && !o.gone) drawOther(o);
    }
  }
  function drawOther(o) {
    const coop = G.vs.coop;
    drawPlayer(o, oppLook(o));
    // health bar so you always know which soldier is them (green for a squadmate)
    const w = 40, f = clamp(o.hp / (o.mh || 100), 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(o.x - w / 2, o.y - 34, w, 5);
    ctx.fillStyle = coop ? '#5ad16b' : '#ff6b5a'; ctx.fillRect(o.x - w / 2, o.y - 34, w * f, 5);
    drawTag(o.x, o.y, o.name || G.vs.name, o.nc, o.ti, o.lv || 1, coop ? '#b8f0c0' : '#ffb3a8');
  }
  // a name tag: the name in its name-tag colour, the level beside it in its own badge, and the title above
  function drawTag(x, y, name, nc, ti, lv, plain) {
    const t = performance.now();
    ctx.textAlign = 'left';
    ctx.font = '600 13px "Chakra Petch", sans-serif';
    const nw = ctx.measureText(name).width;
    ctx.font = '600 11px "Share Tech Mono", monospace';
    const lt = lvName(lv), bw = ctx.measureText(lt).width + 8, x0 = x - (nw + 5 + bw) / 2;
    ctx.font = '600 13px "Chakra Petch", sans-serif';
    ctx.fillStyle = nc === 'rainbow' ? `hsl(${(t / 11) % 360},90%,70%)` : nc === 'radiant' ? `hsl(${42 + 8 * Math.sin(t / 300)},100%,${76 + 12 * Math.sin(t / 300)}%)` : NAME_COL[nc] || plain;
    if (nc === 'radiant') { ctx.save(); ctx.shadowColor = '#ffd36b'; ctx.shadowBlur = 8 + 4 * Math.sin(t / 250); }
    ctx.fillText(name, x0, y - 40);
    if (nc === 'radiant') ctx.restore();
    ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(x0 + nw + 5, y - 52, bw, 15);
    ctx.font = '600 11px "Share Tech Mono", monospace';
    ctx.fillStyle = lvColor(lv);
    if (lv > RADIANT) { ctx.save(); ctx.shadowColor = '#ffd36b'; ctx.shadowBlur = 6 + 4 * Math.sin(t / 250); }
    ctx.fillText(lt, x0 + nw + 9, y - 41);
    if (lv > RADIANT) ctx.restore();
    if (ti) {
      ctx.textAlign = 'center';
      ctx.font = '500 11px "Share Tech Mono", monospace';
      ctx.fillStyle = 'rgba(231,226,212,0.75)'; ctx.fillText(ti, x, y - 56);
    }
    ctx.textAlign = 'center';
  }

  function render(now) {
    const t = now / 1000, p = G.player;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#07090b'; ctx.fillRect(0, 0, vw, vh);
    const c = cam();
    const shx = (Math.random() - 0.5) * G.shake, shy = (Math.random() - 0.5) * G.shake;

    ctx.save();
    ctx.translate(shx, shy);
    ctx.scale(scale, scale);
    ctx.translate(-c.x, -c.y);
    ctx.drawImage(floor, 0, 0);
    for (const it of G.pickups) drawPickup(it, t);
    for (const q of G.parts) if (q.k === 'casing') drawParticle(q);
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    for (const b of OBST) ctx.fillRect(b.x + 6, b.y + 8, b.w, b.h);
    for (const b of OBST) drawObstacle(b);
    drawHazards();
    drawWarnings();
    for (const w of G.waves) {
      const a = Math.max(0, 1 - w.r / w.max);
      ctx.strokeStyle = `rgba(232,200,138,${0.8 * a})`; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = `rgba(120,90,50,${0.5 * a})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(w.x, w.y, w.r * 0.8, 0, Math.PI * 2); ctx.stroke();
    }
    if (G.vs) for (const w of G.vs.oppWaves) {
      const a = Math.max(0, 1 - w.r / w.max);
      ctx.strokeStyle = `rgba(255,120,110,${0.8 * a})`; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2); ctx.stroke();
    }
    for (const e of G.enemies) drawEnemy(e);
    if (!p.dead) drawPlayer(p);
    // in versus and co-op your own name tag shows too
    if (G.vs && !p.dead) { const c = myCos(); drawTag(p.x, p.y, me.name || 'You', c.name, c.title, pLevel(), '#e7e2d4'); }
    if (G.vs) drawOpponent();
    ctx.lineCap = 'round';
    if (G.vs) {
      // their bullets keep a red glow so you can always tell them apart (a squadmate's are friendly, so no glow),
      // with their own tracer colour in the core
      for (const b of G.vs.oppBullets) {
        if (b.k) { drawMeleeShot(b); continue; }
        const tx = b.x - b.vx * 0.022, ty = b.y - b.vy * 0.022;
        if (!G.vs.coop) {
          ctx.strokeStyle = 'rgba(255,70,60,0.45)'; ctx.lineWidth = (b.w || 2) * 2.5;
          ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
        ctx.strokeStyle = (TRACER_COL[b.tr] || TRACER_COL.amber)[1]; ctx.lineWidth = b.w || 2;
        ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
    // an equipped tracer wins; otherwise a Diamond gun keeps its cyan tracers
    const myTr = myCos().tracer, tc = myTr === 'amber' && gunRank() >= 5 ? TRACER_COL.ice : TRACER_COL[myTr];
    for (const b of G.bullets) {
      if (b.k) { drawMeleeShot(b); continue; }
      const tx = b.x - b.vx * 0.022, ty = b.y - b.vy * 0.022;
      ctx.strokeStyle = tc[0]; ctx.lineWidth = (b.w || 2) * 2.5;
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.strokeStyle = tc[1]; ctx.lineWidth = b.w || 2;
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    drawShots();
    for (const q of G.parts) if (q.k !== 'casing') drawParticle(q);
    ctx.restore();

    // darkness around the player, lifted briefly by muzzle flash
    const psx = (p.x - c.x) * scale + shx, psy = (p.y - c.y) * scale + shy;
    const g = ctx.createRadialGradient(psx, psy, 140 * scale, psx, psy, Math.max(vw, vh) * 0.8);
    g.addColorStop(0, 'rgba(4,6,8,0)');
    g.addColorStop(1, `rgba(4,6,8,${p.flash > 0 ? 0.5 : 0.74})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, vw, vh);
    // Arcane nights have a faint purple cast
    if (arcane()) { ctx.fillStyle = 'rgba(110,60,200,0.08)'; ctx.fillRect(0, 0, vw, vh); }

    if (p.hurt > 0) {
      const hg = ctx.createRadialGradient(vw / 2, vh / 2, Math.min(vw, vh) * 0.3, vw / 2, vh / 2, Math.max(vw, vh) * 0.7);
      hg.addColorStop(0, 'rgba(216,69,58,0)');
      hg.addColorStop(1, `rgba(216,69,58,${(p.hurt / 0.3) * 0.45})`);
      ctx.fillStyle = hg; ctx.fillRect(0, 0, vw, vh);
    }

    if (G.state === 'playing' && padMode && !p.dead) {
      // controller crosshair sits a set distance ahead of the soldier
      const c = cam(), d = 130;
      const cx = (p.x - c.x) * scale + Math.cos(p.a) * d * scale, cy = (p.y - c.y) * scale + Math.sin(p.a) * d * scale;
      const gap = 6 + Math.max(0, p.cool / fireTime()) * 6;
      ctx.strokeStyle = '#f2b134'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx - gap - 7, cy); ctx.lineTo(cx - gap, cy);
      ctx.moveTo(cx + gap, cy); ctx.lineTo(cx + gap + 7, cy);
      ctx.moveTo(cx, cy - gap - 7); ctx.lineTo(cx, cy - gap);
      ctx.moveTo(cx, cy + gap); ctx.lineTo(cx, cy + gap + 7);
      ctx.stroke();
      ctx.fillStyle = '#f2b134'; circle(cx, cy, 1.5);
    } else if (G.state === 'playing' && !touchMode && !padMode && mouse.seen) {
      const gap = 6 + Math.max(0, p.cool / fireTime()) * 6;
      ctx.strokeStyle = '#f2b134'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(mouse.x - gap - 7, mouse.y); ctx.lineTo(mouse.x - gap, mouse.y);
      ctx.moveTo(mouse.x + gap, mouse.y); ctx.lineTo(mouse.x + gap + 7, mouse.y);
      ctx.moveTo(mouse.x, mouse.y - gap - 7); ctx.lineTo(mouse.x, mouse.y - gap);
      ctx.moveTo(mouse.x, mouse.y + gap); ctx.lineTo(mouse.x, mouse.y + gap + 7);
      ctx.stroke();
      ctx.fillStyle = '#f2b134'; circle(mouse.x, mouse.y, 1.5);
    }

    if (touchMode && G.state === 'playing') {
      const drawStick = (s, fallbackX, label, firing) => {
        const ox = s ? s.ox : fallbackX, oy = s ? s.oy : vh - 130;
        ctx.strokeStyle = 'rgba(230,225,211,0.3)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(ox, oy, 60, 0, Math.PI * 2); ctx.stroke();
        if (s) {
          const v = stick(s);
          ctx.fillStyle = firing ? 'rgba(242,177,52,0.55)' : 'rgba(230,225,211,0.3)';
          circle(ox + v.x * 60, oy + v.y * 60, 24);
        } else {
          ctx.fillStyle = 'rgba(230,225,211,0.4)'; ctx.font = '500 12px "Share Tech Mono", monospace';
          ctx.textAlign = 'center'; ctx.fillText(label, ox, oy + 4);
        }
      };
      drawStick(touch.move, 100, 'MOVE', false);
      drawStick(touch.aim, vw - 100, 'AIM + FIRE', wantsFire());
    }

    cv.style.cursor = G.state === 'playing' && !touchMode ? 'none' : 'default';
  }

  // ---------- HUD ----------
  const $ = id => document.getElementById(id);
  const ui = {
    hpFill: $('hpFill'), hpNum: $('hpNum'), wave: $('waveNum'), waveLabel: $('waveLabel'), hostiles: $('hostiles'), score: $('score'), best: $('best'),
    kills: $('kills'), mag: $('mag'), res: $('res'), reloadFill: $('reloadFill'), ammo: $('ammo'), ammoLabel: $('ammoLabel'),
    banner: $('banner'), bannerTitle: $('bannerTitle'), bannerSub: $('bannerSub'), overlay: $('overlay'),
    pause: $('pauseBtn'), mute: $('muteBtn'), reload: $('reloadBtn'), swap: $('swapBtn'), specialBtn: $('specialBtn'), sp: $('spLabel'), hud: $('hud'),
    bossBar: $('bossBar'), bossName: $('bossName'), bossTitle: $('bossTitle'), bossFill: $('bossFill'),
    mGun: $('mGun'), mGunFill: $('mGunFill'), mMel: $('mMel'), mMelFill: $('mMelFill'), mPl: $('mPl'), mPlFill: $('mPlFill'),
    scoreLabel: $('scoreLabel'), bestLine: $('bestLine'), vsLine: $('vsLine'), achPop: $('achPop')
  };
  // achievement popups take turns, about 4 seconds each
  function achPopTick() {
    const now = performance.now();
    if (achShownAt && now - achShownAt > 3800) { achShownAt = 0; ui.achPop.hidden = true; }
    if (achShownAt || !achQueue.length) return;
    const a = achQueue.shift(), t = TIERS[a.tier];
    ui.achPop.innerHTML = `<span class="label">Achievement unlocked · <span style="color:${t.color}">${t.name}</span></span>
      <b>${a.name}</b><span class="note">+${t.pts} pts${a.reward ? ` · Unlocks ${rewardText(a.reward)}` : ''}</span>`;
    ui.achPop.style.borderColor = t.color;
    ui.achPop.hidden = false;
    achShownAt = now;
  }
  function lvHud(label, fill) {
    const xp = Math.floor(xpOf(PLAYER_KEY)), n = pLevel(), top = n >= MAX_LV;
    setText(label, `You · ${lvName(n)} · ${top ? `${xp} max` : `${xp}/${LV_XP[n + 1]}`}`);
    fill.style.width = (top ? 1 : clamp((xp - LV_XP[n]) / (LV_XP[n + 1] - LV_XP[n]), 0, 1)) * 100 + '%';
    fill.style.background = lvColor(n);
  }
  function mastHud(id, label, fill, ranks = ranksFor(id), name = (GUN[id] || MELEE_BY[id] || {}).name) {
    const xp = Math.floor(xpOf(id)), r = rankIn(ranks, xp), nx = ranks[r + 1];
    setText(label, `${name} · ${ranks[r].name} · ${nx ? `${xp}/${nx.xp}` : `${xp} max`}`);
    fill.style.width = (nx ? Math.max(0, Math.min(1, (xp - ranks[r].xp) / (nx.xp - ranks[r].xp))) : 1) * 100 + '%';
    fill.style.background = ranks[r].color || 'var(--amber)';
  }
  ui.mute.textContent = muted ? 'Sound off' : 'Sound on';
  function setText(el, v) { v = String(v); if (el._v !== v) { el.textContent = v; el._v = v; } }
  function syncHud() {
    const p = G.player;
    achPopTick();
    ui.hpFill.style.width = (p.hp / p.maxHp) * 100 + '%';
    ui.hpFill.classList.toggle('low', p.hp <= p.maxHp * 0.3);
    setText(ui.hpNum, Math.ceil(p.hp));
    setText(ui.wave, Math.max(1, G.wave));
    setText(ui.waveLabel, (arcane() ? 'Arcane ' : '') + (G.endless ? (arcane() ? 'endless' : 'Endless wave') : (arcane() ? 'wave' : 'Wave')));
    const left = isGuest() ? G.vs.hostiles : G.enemies.length + G.queue.length;
    setText(ui.hostiles, left === 1 ? '1 hostile' : left + ' hostiles');
    const v = G.vs;
    if (ui.vsLine.hidden === !!v) ui.vsLine.hidden = !v;
    if (ui.bestLine.hidden !== !!v) ui.bestLine.hidden = !!v;
    if (v && v.coop) {
      const here = v.peers.filter(o => !o.gone), up = (p.dead ? 0 : 1) + here.filter(o => !o.dead).length;
      setText(ui.scoreLabel, 'Team score');
      setText(ui.score, coopTeam().toLocaleString());
      setText(ui.vsLine, `You ${G.score.toLocaleString()} · ${up} of ${here.length + 1} standing`);
    } else if (v) {
      setText(ui.scoreLabel, 'Banked');
      setText(ui.score, v.banked.toLocaleString());
      setText(ui.vsLine, `At risk +${v.risk.toLocaleString()} · ${v.name} ${((v.opp.banked || 0) + (v.opp.risk || 0)).toLocaleString()}`);
    } else {
      setText(ui.scoreLabel, 'Score');
      setText(ui.score, G.score.toLocaleString());
      setText(ui.best, Math.max(bestFor(G.diff), G.score).toLocaleString());
    }
    setText(ui.kills, G.kills);
    setText(ui.mag, p.melee ? '—' : p.mag);
    setText(ui.res, p.res);
    setText(ui.ammoLabel, p.melee ? meleeDef().name : p.reload > 0 ? 'Reloading' : gunDef().name);
    lvHud(ui.mPl, ui.mPlFill);
    mastHud(G.gun, ui.mGun, ui.mGunFill);
    mastHud(G.melee, ui.mMel, ui.mMelFill);
    const sp = p.melee ? specialDef() : null;
    setText(ui.sp, sp ? (p.spCool > 0 ? `${sp.name} ${p.spCool.toFixed(1)}s` : `${sp.name} ready`) : '');
    ui.reloadFill.style.width = (p.reload > 0 ? (1 - p.reload / reloadTime()) * 100 : 0) + '%';
    ui.ammo.classList.toggle('empty', !p.melee && p.mag === 0);
    const showBanner = G.banner.t > 0 && G.state === 'playing';
    if (ui.banner.hidden === showBanner) ui.banner.hidden = !showBanner;
    if (showBanner) {
      setText(ui.bannerTitle, G.banner.title); setText(ui.bannerSub, G.banner.sub);
      ui.banner.style.opacity = Math.min(1, G.banner.t * 2);
    }
    const boss = G.enemies.find(e => e.type === 'boss');
    const showBoss = !!boss && (G.state === 'playing' || G.state === 'paused');
    if (ui.bossBar.hidden === showBoss) ui.bossBar.hidden = !showBoss;
    if (showBoss) {
      const b = bossList()[boss.boss];
      const sh = bossShield(boss);
      setText(ui.bossName, bossName(b, boss.loop));
      const left = sh === 'any' ? 0 : Math.max(0, Math.round(100 * (1 - (boss.phaseDmg || 0) / phaseNeed(boss))));
      setText(ui.bossTitle, sh === 'melee' ? `Melee only · shield ${left}%` : sh === 'gun' ? `Guns only · spikes ${left}%` : b.title);
      ui.bossFill.style.width = Math.max(0, boss.hp / boss.max) * 100 + '%';
    }
    ui.hud.style.opacity = G.state === 'title' ? '0.35' : '1';
    setText(ui.pause, G.vs ? (G.vs.coop ? 'Leave' : 'Forfeit') : G.state === 'paused' ? 'Resume' : 'Pause');
  }

  // ---------- screens ----------
  const KEYS_HTML = `
    <dl class="keys desk-only">

  // player rank: a bar to the next rank, the perks from Bronze to Mythic, then Radiant 1–50
  function levelHtml() {
    const xp = Math.floor(xpOf(PLAYER_KEY)), n = pLevel(), top = n >= MAX_LV;
    const pct = top ? 100 : Math.round(100 * (xp - LV_XP[n]) / (LV_XP[n + 1] - LV_XP[n]));
    const list = PLAYER_PERKS.map((p, i) => `<li class="${n >= i + 2 ? 'on' : ''}"><span style="color:${lvColor(i + 2)}">${lvName(i + 2)}</span>${p}</li>`).join('')
      + RAD_PERKS.map((p, i) => `<li class="${n >= RADIANT + i + 1 ? 'on' : ''}"><span style="color:${lvColor(MAX_LV)}">${lvName(RADIANT + i + 1)}</span>${p}${i ? '' : ' · glowing rank badge'}</li>`).join('')
      + `<li class="${top ? 'on' : ''}"><span style="color:${lvColor(MAX_LV)}">Radiant 11–49</span>No new perks · a rank to show off</li>`
      + `<li class="${top ? 'on' : ''}"><span style="color:${lvColor(MAX_LV)}">Radiant 50</span>The Radiant achievement · Radiant name tag · starred badge</li>`;
    return `<div class="mastery">
      <div class="mhead"><span class="label">Player rank · ${lvBadge(n)}</span><span class="label">${top ? `${xp} XP · max rank` : `${xp} / ${LV_XP[n + 1]} XP`}</span></div>
      <div class="rbar"><i style="width:${pct}%"></i></div>
      <ul class="ranks">${list}</ul>

  }
  function masteryHtml(id, perks, ranks = ranksFor(id), title = 'Mastery') {
    const xp = Math.floor(xpOf(id)), r = rankIn(ranks, xp), next = ranks[r + 1];
    const pct = next ? Math.round(100 * (xp - ranks[r].xp) / (next.xp - ranks[r].xp)) : 100;
    const list = perks.map((p, i) => `<li class="${i + 1 <= r ? 'on' : ''}"><span style="color:${ranks[i + 1].color}">${ranks[i + 1].name}</span>${p}</li>`).join('');
    return `<div class="mastery">
      <div class="mhead"><span class="label">${title} · ${ranks[r].name}</span><span class="label">${next ? `${xp} / ${next.xp} XP` : `${xp} XP · max rank`}</span></div>
      <div class="rbar"><i style="width:${pct}%"></i></div>
      <ul class="ranks">${list}</ul>

  }
  function xpLine() {

  function friendRows(diff) {

  async function fillBoard() {

  document.addEventListener('click', e => {

  // ---------- profile & achievements ----------
  let profTab = 'overview';
  const nameHtml = (name, nc) => nc === 'rainbow' || nc === 'radiant' ? `<span class="nc-${nc}">${esc(name)}</span>`

  const fmtTime = s => s >= 3600 ? `${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}m` : `${Math.floor(s / 60)}m`;
  // one renderer for your own profile and a friend's; d.mine adds progress bars and the Customise tab
  function profileHtml(d) {
    const tabs = [['overview', 'Overview'], ['ach', 'Achievements']].concat(d.mine ? [['custom', 'Customise']] : []);
    const tab = tabs.some(t => t[0] === profTab) ? profTab : 'overview';
    const s = d.st, got = id => d.ach.includes(id);
    const fav = Object.keys(d.mx).filter(id => id !== PLAYER_KEY).sort((a, b) => d.mx[b] - d.mx[a])[0];

          ${s.bestA || s.wizards ? `${stat('Best Arcane score', s.bestA.toLocaleString())}${stat('Best Arcane wave', s.bestWaveA)}

        }).join('')}</div></div>`;
