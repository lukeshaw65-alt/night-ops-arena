<style>
/* Layout: full-screen canvas arena; HUD pinned to the corners; briefing panels float over the live yard */
:root {
  --night: #0b0f12;
  --panel: rgba(12, 16, 18, 0.8);
  --line: rgba(230, 225, 211, 0.16);
  --text: #e7e2d4;
  --muted: #8e968c;
  --amber: #f2b134;
  --hp: #d8453a;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --mono: "Share Tech Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--text);
  font-family: var(--display);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
#game { position: fixed; inset: 0; display: block; touch-action: none; }

.hud {
  position: fixed; inset: 0; pointer-events: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));

}
.hud-top, .hud-bottom { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hud-top { align-items: flex-start; }
.hud-bottom { align-items: flex-end; }
.chip {
  background: var(--panel); border: 1px solid var(--line);
  padding: 8px 12px; display: flex; flex-direction: column; gap: 4px;
}
.label {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--muted);
}
.vitals .row { display: flex; align-items: center; gap: 8px; }
.bar { width: clamp(100px, 22vw, 200px); height: 10px; background: rgba(230, 225, 211, 0.1); }
.bar i { display: block; height: 100%; width: 100%; background: var(--hp); transition: width 0.15s; }
.bar i.low { animation: pulse 0.6s infinite alternate; }
@keyframes pulse { to { opacity: 0.45; } }
.num { font-family: var(--mono); font-size: 18px; font-variant-numeric: tabular-nums; }
.wave { align-items: center; text-align: center; }
.wave b { font-size: 28px; line-height: 1; font-weight: 700; }
.right { display: flex; gap: 8px; align-items: flex-start; }
.score { align-items: flex-end; text-align: right; }
.score b { font-family: var(--mono); font-size: 22px; font-weight: 400; line-height: 1; font-variant-numeric: tabular-nums; }
.btn-s {
  pointer-events: auto; font: 600 12px var(--display); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text); background: var(--panel); border: 1px solid var(--line); padding: 8px 10px; cursor: pointer;
}
.btn-s:hover { border-color: var(--amber); }
.ammo { align-items: flex-end; min-width: 120px; }
.ammo .count { display: flex; align-items: baseline; gap: 6px; }
.ammo .mag { font-family: var(--mono); font-size: 40px; line-height: 1; color: var(--amber); font-variant-numeric: tabular-nums; }
.ammo.empty .mag { color: var(--hp); }
.rbar { width: 100%; height: 4px; background: rgba(230, 225, 211, 0.1); }
.rbar i { display: block; height: 100%; width: 0; background: var(--amber); }
.kills { align-items: flex-start; }
.touch-only { display: none; }
body.touch .touch-only { display: inline-flex; }
body.touch .desk-only { display: none; }
.pad-only { display: none; }
body.pad .keys.pad-only { display: grid; }
body.pad .keys.desk-only { display: none; }
.padfocus { outline: 3px solid var(--amber) !important; outline-offset: 3px; }
.padnote { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); font-family: var(--mono); font-size: 13px; }
#reloadBtn { align-self: flex-end; padding: 12px 16px; font-size: 14px; }

.banner {
  position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%);

  max-width: calc(100% - 32px);
}
.banner b { font-size: clamp(30px, 7vw, 54px); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; text-wrap: balance; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8); }
.banner span { font-family: var(--mono); color: var(--amber); letter-spacing: 0.14em; text-transform: uppercase; font-size: 14px; }

.overlay {

}

.brief::before, .brief::after {

.brief::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }

.brief.wide { width: min(100%, 760px); }
.field {
  font: 15px var(--display); color: var(--text); background: rgba(230, 225, 211, 0.05); border: 1px solid var(--line);
  padding: 9px 10px; min-width: 0; flex: 1; user-select: text; -webkit-user-select: text;
}
.field:focus { outline: 2px solid var(--amber); outline-offset: 1px; }
textarea.field { width: 100%; resize: vertical; font: 12px var(--mono); }
.row2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.frrow { display: flex; flex-direction: column; gap: 6px; }
.frlist li { justify-content: flex-start; }
.frlist .info { flex: 1; }
.frnote { overflow-wrap: anywhere; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(230, 225, 211, 0.2); flex: none; }
.dot.on { background: #5ad16b; box-shadow: 0 0 6px #5ad16b; }
details summary { cursor: pointer; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 12px);
  max-width: calc(100% - 32px); background: var(--panel); border: 1px solid var(--amber); padding: 10px 12px;
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap; backdrop-filter: blur(4px);
}
.toast span { overflow-wrap: anywhere; }
.nc-rainbow {
  background: linear-gradient(90deg, #ff6b6b, #ffd36b, #5ee6a0, #6bb8ff, #b46bff, #ff6b6b); background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: rainbow 3s linear infinite;
}
@keyframes rainbow { to { background-position: 200% 0; } }
@media (prefers-reduced-motion: reduce) { .nc-rainbow { animation: none; } }
/* the Radiant 50 name tag: a white-gold shine sweeping across the name */
.nc-radiant {
  background: linear-gradient(90deg, #ffb347, #fff1b8, #ffffff, #ffd36b, #ffb347); background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: rainbow 2.2s linear infinite;
  filter: drop-shadow(0 0 4px rgba(255,211,107,0.7));
}
@media (prefers-reduced-motion: reduce) { .nc-radiant { animation: none; } }
.ttl { font: 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.tier { font: 10px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; border: 1px solid currentColor; padding: 1px 6px; flex: none; }
.pstats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px 16px; }
.pstats div { display: flex; flex-direction: column; gap: 2px; }

.card.locked { opacity: 0.6; }

.mrows { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 4px 16px; font-size: 14px; }

.chiprow { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-b { font: 13px var(--display); color: var(--text); background: transparent; border: 1px solid var(--line); padding: 6px 10px; cursor: pointer; }
.chip-b:hover:not(:disabled) { border-color: var(--amber); }
.chip-b[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); background: rgba(242, 177, 52, 0.1); }

.achpop {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
  width: min(380px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--amber); padding: 10px 14px;
  display: flex; flex-direction: column; gap: 2px; pointer-events: none; backdrop-filter: blur(4px);
}
.achpop b { font-size: 18px; }
.mastchip { min-width: 190px; }
.mastchip .rbar { margin-bottom: 3px; }
@media (max-width: 560px) { .mastchip { display: none; } }
.board { width: 100%; border-collapse: collapse; font-size: 14px; }
.board th { text-align: left; font: 11px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); }
.board td { padding: 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.board td.n { font-family: var(--mono); text-align: right; }
.board th.n { text-align: right; }
.board tr.me td { color: var(--amber); }
.board .who { overflow-wrap: anywhere; }
.boardwrap { overflow-x: auto; }
.mastery { display: flex; flex-direction: column; gap: 6px; }
.mhead { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.ranks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--muted); }
.ranks li { opacity: 0.55; }
.ranks li.on { opacity: 1; color: var(--text); }
.ranks span { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; margin-right: 6px; }
.rk { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
.lvb { display: inline-block; font-family: var(--mono); font-size: 0.78em; font-weight: 600; line-height: 1.35; padding: 0 5px; border-radius: 4px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.12); vertical-align: middle; letter-spacing: 0.04em; }
.lvb.rad { text-shadow: 0 0 6px #ffd36b, 0 0 12px rgba(255,240,190,0.8); border-color: rgba(255,211,107,0.6); animation: lvglow 2s ease-in-out infinite; }
@keyframes lvglow { 50% { text-shadow: 0 0 10px #ffd36b, 0 0 18px #fff; } }
@media (prefers-reduced-motion: reduce) { .lvb.rad { animation: none; } }
.startpick { display: flex; flex-direction: column; gap: 8px; }
.startpick .row { display: flex; align-items: center; gap: 12px; }
.startpick input { flex: 1; min-width: 0; accent-color: var(--amber); }
.startpick b { font-family: var(--mono); font-size: 26px; font-weight: 400; color: var(--amber); min-width: 2.5ch; text-align: right; font-variant-numeric: tabular-nums; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tab {
  font: 600 13px var(--display); letter-spacing: 0.1em; text-transform: uppercase; background: transparent; color: var(--muted);
  border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 10px 14px; cursor: pointer;
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--amber); border-bottom-color: var(--amber); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.card { border: 1px solid var(--line); background: rgba(230, 225, 211, 0.03); padding: 12px; display: flex; flex-direction: column; gap: 10px; justify-content: space-between; }

}

</style>

<canvas id="game" aria-label="Game arena"></canvas>

<script>
(() => {
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const W = 1600, H = 1100;
  const MAG = 12, RELOAD = 1.25, FIRE = 0.15, BULLET_SPEED = 950, STEP = 1 / 120;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const OBST = [

  }
  function cleanFriend(f) {

  }

  // ---------- progress transfer: one code carries mastery, bests, saved run and friends between copies of the game ----------
  const PROGRESS_TAG = 'NOPS1.';
  const progressCode = () => PROGRESS_TAG + btoa(unescape(encodeURIComponent(JSON.stringify({
    mastery: MAST, best, bestWave, board: localBoard(), run: loadRun(), friends, gun: chosenGun, melee: chosenMelee,
    ach: ACH, stats: STATS, cos: MYCOS, unlock: jget('nightops-unlock', {}), bestA, bestWaveA, bestC, bestWaveC

  // merges rather than replaces, keeping the better of each, so neither copy loses anything
  function importProgress(raw) {
    const s = String(raw || '').replace(/\s+/g, '');
    if (!s.startsWith(PROGRESS_TAG)) throw new Error('bad');
    const d = JSON.parse(decodeURIComponent(escape(atob(s.slice(PROGRESS_TAG.length)))));
    if (!d || typeof d !== 'object') throw new Error('bad');
    if (d.mastery && typeof d.mastery === 'object') {
      for (const k of Object.keys(d.mastery)) {
        if (k === PLAYER_KEY || GUN[k] || MELEE_BY[k]) MAST[k] = Math.max(xpOf(k), num(d.mastery[k], 1e9));
      }
      saveMastery();
    }
    // achievements: union, keeping the earliest unlock date
    if (d.ach && typeof d.ach === 'object') {
      for (const id of Object.keys(d.ach)) if (ACH_BY[id]) { const t = num(d.ach[id], 1e14) || Date.now(); ACH[id] = ACH[id] ? Math.min(ACH[id], t) : t; }
      saveAch();
    }
    // lifetime stats: the higher of each
    if (d.stats && typeof d.stats === 'object') {
      for (const k of Object.keys(STATS)) if (k !== 'bosses' && k !== 'beasts') STATS[k] = Math.max(STATS[k] || 0, num(d.stats[k], 1e12));
      for (const key of ['bosses', 'beasts']) {
        if (!d.stats[key] || typeof d.stats[key] !== 'object') continue;
        for (let i = 0; i < 10; i++) STATS[key][i] = Math.max(STATS[key][i] || 0, num(d.stats[key][i], 1e9));
      }
    }
    // cosmetics only come across if you haven't picked any here yet

    bestWave = Math.max(bestWave, num(d.bestWave, 9999)); jset('nightops-bestwave', bestWave);
    if (Array.isArray(d.board)) {
      const mine = localBoard(), seen = new Set(mine.map(r => `${r.at}:${r.score}`));
      const rows = d.board.filter(r => r && typeof r === 'object').map(r => ({
        score: num(r.score, 1e9), wave: num(r.wave, 9999), gun: GUN[r.gun] ? r.gun : 'carbine', melee: MELEE_BY[r.melee] ? r.melee : 'machete',
        endless: !!r.endless, vs: !!r.vs, diff: ['arcane', 'coop'].includes(r.diff) ? r.diff : 'normal', prank: num(r.prank, PRANKS.length - 1), lv: lvOf(r.lv, r.prank), at: num(r.at, 1e14),

    recordBest(num(d.bestC, 1e9), num(d.bestWaveC, 9999), 'coop');
    // carry the best run of each difficulty onto the global leaderboards too (only does anything on claude.ai)
    for (const df of ['normal', 'arcane', 'coop']) {

  }

  function copyText(text, ok) {

  const vsSend = msg => {

  // start of a wave (and respawn): back at your spot with 3 seconds of protection

  function vsDie() {

  function vsWipe() {

  // a cleared wave banks whatever you earned in it

  function vsAfterClear() {

  function vsDecide(keep) {

  // reason: done | both | ff-me | ff-opp | disconnect
  function vsEnd(reason, notify, mine, theirs) {
    const v = G.vs;
    if (!v || v.over) return;
    const my = mine != null ? num(mine, 1e9) : v.banked + v.risk;
    const op = theirs != null ? num(theirs, 1e9) : (v.opp.banked || 0) + (v.opp.risk || 0);
    if (notify) vsSend({ t: 'v.end', reason: reason === 'ff-me' ? 'ff' : reason, a: my, b: op });
    v.over = true;
    v.result = { reason, my, op, win: reason === 'ff-opp' || reason === 'disconnect' ? 1 : reason === 'ff-me' ? -1 : Math.sign(my - op) };
    G.state = 'vsover'; mouse.down = false;
    // a dropped connection doesn't count towards your record
    if (reason !== 'disconnect') {
      STATS.vsPlayed++;
      if (v.result.win > 0) STATS.vsWins++; else if (v.result.win < 0) STATS.vsLosses++;
      unlock('rivals');

    saveMastery();
    submitRun();

  }
  function vsLost(code) {

    if (FR.invite && FR.invite.code === code) { FR.invite = null; frToast(); }
    if (FR.co) coLost(code);
    const v = G.vs;
    if (!v || v.over) return;
    if (v.coop) {

  // per frame, in any state: send your soldier, new bullets, hits and (as host) the world
  function vsTick(dt) {

    const now = performance.now();
    if (v.coop && v.role === 'host') { for (const o of v.peers) if (!o.gone && now - o.heard > 10000) coopGone(o); }
    else if (now - v.heard > 10000) { if (v.coop) coopEnd('host'); else vsEnd('disconnect'); return; }
    const p = G.player;
    v.sendT -= dt;
    if (v.sendT <= 0) {
      v.sendT = 0.05;
      const c = myCos();
      vsSend({ t: 'v.p', x: Math.round(p.x), y: Math.round(p.y), vx: Math.round(p.vx), vy: Math.round(p.vy), a: +p.a.toFixed(2),

        fl: p.flash > 0 ? 1 : 0, hu: p.hurt > 0 ? 1 : 0, bk: v.banked, rk: v.risk, k: G.kills, sc: G.score,
        ti: c.title, nc: c.name, dc: c.decal, tr: c.tracer, ke: c.kill });

    const fresh = [];
    for (const b of G.bullets) if (!b.sent) {

      fresh.push({ x: Math.round(b.x), y: Math.round(b.y), vx: Math.round(b.vx), vy: Math.round(b.vy), l: +b.life.toFixed(2), d: +b.dmg.toFixed(2),
        w: b.w || 2, k: b.k || '', bo: b.bounce || 0, bu: b.burn || 0, ex: b.exec || 0 });
    }
    if (fresh.length) vsSend({ t: 'v.b', b: fresh });
    if (v.hitsOut.length) { vsSend({ t: 'v.hits', h: v.hitsOut }); v.hitsOut = []; }
    if (v.role === 'host') {
      v.snapT -= dt;

  function vsSnapshot() {

      const m = x.mode;

        x.flash > 0 ? 1 : 0, x.type === 'boss' ? x.boss : -1, x.loop || 0, m ? MODE_KEYS.indexOf(m.k) : -1, m ? Math.round(m.t * 100) : 0,

    });

    const msg = { t: 'v.s', w: G.wave, en: G.endless ? 1 : 0, q: G.queue.length, e, pk,
      hz: G.hazards.map(h => [HZ_KEYS.indexOf(h.k), Math.round(h.x), Math.round(h.y), Math.round(h.r), Math.round(h.t * 10), Math.round(h.max * 10)]) };

  // the guest's copy of the world, rebuilt from each snapshot and eased between them
  function vsApplySnap(d) {
    const v = G.vs;
    G.endless = !!d.en;
    if (num(d.w, 9999)) G.wave = num(d.w, 9999);
    const list = Array.isArray(d.e) ? d.e : [];
    v.hostiles = list.length + num(d.q, 999);
    if (d.clr) G.shots = [];
    const old = new Map(G.enemies.map(e => [e.id, e])), next = [];
    for (const a of list) {
      const type = TYPE_KEYS[a[1]];
      if (!type || !Array.isArray(a)) continue;
      let e = old.get(a[0]);
      if (e) old.delete(a[0]);

        life: +s0.life || 5, color: String(s0.color || '#ff6b5a').slice(0, 24), boss: !!s0.boss, x0: +s0.x0, y0: +s0.y0, t: +s0.t || 0, max: +s0.max || 1,

  function vsGuestEnemies(dt, p) {
    const k = Math.min(1, dt * 12);
    for (const e of G.enemies) {
      const ox = e.x, oy = e.y;
      e.x += (e.tx - e.x) * k; e.y += (e.ty - e.y) * k;
      e.step += Math.hypot(e.x - ox, e.y - oy) * 0.08;

      if (p.dead) continue;

      if (!e.flying && dist < e.r + p.r + 2 && e.gcool <= 0) {
        e.gcool = 0.8;
        hurtPlayer(d.dmg * (e.type === 'boss' ? bossPow(e) : hostileMul()), (p.x - e.x) / dist, (p.y - e.y) / dist, e.type === 'boss');
        if (G.state !== 'playing' || p.dead) return;
      }
    }
  }

  // the other player's soldier, bullets, swings and shockwaves, checked against you
  function vsUpdate(dt) {
    const v = G.vs, p = G.player;
    const k = Math.min(1, dt * 15);
    for (const o of v.peers) {
      o.x += (o.tx - o.x) * k; o.y += (o.ty - o.y) * k;
      o.swing = Math.max(0, (o.swing || 0) - dt); o.spinFx = Math.max(0, (o.spinFx || 0) - dt);
      o.flash = (o.flash || 0) - dt; o.hurt = (o.hurt || 0) - dt;
    }
    if (p.dot > 0 && !p.dead) { p.dot -= dt; hurtPlayer(p.dotDps * dt, 0, 0, true, 'opp', true); }
    for (let i = v.oppBullets.length - 1; i >= 0; i--) {
      const b = v.oppBullets[i];
      b.px = b.x; b.py = b.y;
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      let gone = b.life <= 0 || b.x < 0 || b.y < 0 || b.x > W || b.y > H;
      if (!gone && inObstacle(b.x, b.y)) {
        if (b.bounce > 0) { b.bounce--; if (!inObstacle(b.px, b.y)) b.vx = -b.vx; else b.vy = -b.vy; b.x = b.px; b.y = b.py; }
        else { gone = true; sparks(b.px, b.py, b.vx, b.vy); }
      }
      // a squadmate's bullets are only for show: they pass straight through you
      if (!gone && !v.coop && !p.dead && Math.hypot(p.x - b.x, p.y - b.y) < p.r + 3) {
        gone = true;
        if (!(p.prot > 0)) {
          let dmg = b.dmg * PVP;
          if (b.exec && p.hp < p.maxHp * 0.35) dmg *= 1 + 0.5 * b.exec;
          const l = Math.hypot(b.vx, b.vy) || 1;
          hurtPlayer(dmg, b.vx / l, b.vy / l, false, 'opp');
          if (b.burn && !p.dead) { p.dotDps = Math.max(p.dot > 0 ? p.dotDps : 0, b.burn * PVP); p.dot = 2; }
        }
      }
      if (gone) v.oppBullets.splice(i, 1);
    }
    for (let i = v.oppWaves.length - 1; i >= 0; i--) {
      const w = v.oppWaves[i];
      w.r += 560 * dt;
      if (!w.done && !p.dead && Math.hypot(p.x - w.x, p.y - w.y) <= w.r + p.r) {
        w.done = true;
        const l = Math.hypot(p.x - w.x, p.y - w.y) || 1;
        hurtPlayer(w.dmg * PVP, (p.x - w.x) / l, (p.y - w.y) / l, false, 'opp');
      }
      if (w.r >= w.max) v.oppWaves.splice(i, 1);
    }
  }

  // everything that arrives from the other player is untrusted: numbers are coerced and clamped as they land
  function vsGame(d, code) {
    const v = G.vs, p = G.player;
    v.heard = performance.now();
    let o = v.opp;
    // co-op: guests only link to the host, so the host passes each guest's soldier, shots and news on to the rest
    if (v.coop) {
      o = v.peers.find(x => x.code === (v.role === 'guest' && d.fr ? d.fr : code));
      if (!o) return;
      o.heard = v.heard;
      if (v.role === 'host' && ['v.p', 'v.b', 'v.die', 'v.rd'].includes(d.t)) {
        for (const x of v.peers) if (x !== o && !x.gone) frSend(x.code, Object.assign({}, d, { fr: code }));
      }
    }
    switch (d.t) {
      case 'v.p':
        Object.assign(o, { tx: +d.x || 0, ty: +d.y || 0, vx: +d.vx || 0, vy: +d.vy || 0, a: +d.a || 0, hp: num(d.hp, 9999), mh: num(d.mh, 9999) || 100,
          dead: !!d.dd, prot: d.pt ? 1 : 0, melee: !!d.ml, g: GUN[d.g] ? d.g : 'carbine', m: MELEE_BY[d.m] ? d.m : 'machete',
          gr: num(d.gr, RANKS.length - 1), mr: num(d.mr, RANKS.length - 1), pr: num(d.pk, PRANKS.length - 1), lv: lvOf(d.lv, d.pk), swing: Math.max(o.swing || 0, +d.sw || 0), swingDir: d.sd < 0 ? -1 : 1,
          spinFx: Math.max(o.spinFx || 0, +d.sp || 0), banked: num(d.bk, 1e9), risk: num(d.rk, 1e9), kills: num(d.k, 1e6), sc: num(d.sc, 1e9),
          ti: TITLES.includes(d.ti) ? d.ti : '', nc: COS.name[d.nc] ? d.nc : 'default', dc: COS.decal[d.dc] ? d.dc : 'none',
          tr: COS.tracer[d.tr] ? d.tr : 'amber', ke: COS.kill[d.ke] ? d.ke : 'blood' });
        if (d.fl) o.flash = 0.05;
        if (d.hu) o.hurt = 0.2;
        if (!o.seen0) { o.x = o.tx; o.y = o.ty; o.seen0 = true; }
        break;
      case 'v.b':
        if (G.state !== 'playing' || !Array.isArray(d.b)) break;
        for (const b of d.b.slice(0, 40)) {
          if (!b || v.oppBullets.length > 400) break;
          v.oppBullets.push({ tr: o.tr, x: +b.x || 0, y: +b.y || 0, vx: +b.vx || 0, vy: +b.vy || 0, life: Math.min(3, +b.l || 0), dmg: Math.min(200, Math.max(0, +b.d || 0)),
            w: Math.min(6, +b.w || 2), k: ['knife', 'slash', 'moon', 'ball'].includes(b.k) ? b.k : '', bounce: num(b.bo, 3), burn: Math.min(10, +b.bu || 0), exec: num(b.ex, 3) });
        }
        break;
      case 'v.sw': {

        if (dist > Math.min(200, +d.r || 0) + p.r) break;
        let da = Math.atan2(dy, dx) - (+d.a || 0);
        da = Math.atan2(Math.sin(da), Math.cos(da));
        if (Math.abs(da) > (+d.arc || 0) / 2 && dist > p.r * 2) break;
        hurtPlayer(Math.min(200, +d.d || 0) * PVP, dx / dist, dy / dist, false, 'opp');
        if (d.bl && !p.dead) { p.dotDps = Math.max(p.dot > 0 ? p.dotDps : 0, Math.min(10, +d.bl) * PVP); p.dot = 2; }
        break;
      }
      case 'v.wv':

        break;

        const t = clamp(((p.x - d.x0) * sx + (p.y - d.y0) * sy) / len2, 0, 1);
        const cx = d.x0 + sx * t, cy = d.y0 + sy * t, dist = Math.hypot(p.x - cx, p.y - cy) || 1;
        if (dist <= p.r + 30) hurtPlayer(Math.min(200, +d.d || 0) * PVP, (p.x - cx) / dist, (p.y - cy) / dist, false, 'opp');

        if (v.coop) {
          blood(o.x, o.y, 0, 0, 24); stain(o.x, o.y, 18); boom(o.x, o.y, 60, '#d8453a');
          if (!p.dead) G.banner = { title: `${o.name} is down`, sub: 'Hold the yard · they’re back next wave if you clear it', t: 2.4 };
          break;
        }
        const stolen = num(d.stolen, 1e9), how = String(d.how || '').slice(0, 30);
        blood(o.x, o.y, 0, 0, 24); stain(o.x, o.y, 18); boom(o.x, o.y, 60, '#d8453a');
        if (d.credit) {
          const bonus = killBonus();
          v.risk += stolen; addScore(bonus); v.pvpKills++;
          STATS.pvp++;
          if (stolen >= 1000) unlock('pickpocket');
          gainXp(p.melee ? G.melee : G.gun, 25);
          G.banner = { title: `You took down ${v.name}`, sub: `Stole ${stolen.toLocaleString()} + ${bonus} bonus · ${how}`, t: 2.6 };
        } else G.banner = { title: `${v.name} went down`, sub: 'Their at-risk score is lost', t: 2 };
        break;
      }
      case 'v.s': if (v.role === 'guest') vsApplySnap(d); break;
      case 'v.hits':
        if (v.role !== 'host' || !Array.isArray(d.h)) break;
        for (const h of d.h.slice(0, 200)) {
          const e = Array.isArray(h) && G.enemies.find(x => x.id === h[0] && !x.dead);
          if (!e) continue;
          damage(e, { vx: +h[8] || 0.01, vy: +h[9] || 0, dmg: Math.min(500, Math.max(0, +h[1] || 0)), melee: !!h[2], burn: Math.min(10, +h[3] || 0),
            bleed: Math.min(10, +h[4] || 0), chill: Math.min(0.45, +h[5] || 0), stun: Math.min(1, +h[6] || 0), kb: Math.min(6, +h[7] || 1), opp: code });

        gainXp(d.ml ? G.melee : G.gun, num(d.xp, 30));
        if (!d.mn) { G.kills++; onMyKill(!!d.ml, d.boss ? clamp(num(d.bi, 99), 0, BOSSES.length - 1) : null, num(d.bl, 99), !!d.wz); }
        if (lvl('l_belt')) p.mag = Math.min(magSize(), p.mag + lvl('l_belt'));
        floatText(+d.x || 0, +d.y || 0, '+' + pts, '#f2b134');
        if (!d.boss) killFx(+d.x || 0, +d.y || 0, myCos().kill, true);
        if (d.boss) G.banner = { title: 'Boss defeated', sub: `You landed the final blow · +${pts.toLocaleString()} points`, t: 2.4 };

      }
      case 'v.pick': {
        if (v.role !== 'host') break;

        break;
      }
      case 'v.got':
        if (p.dead) break;

      case 'v.ws':
        if (v.role !== 'guest') break;
        G.wave = num(d.n, 9999); G.endless = !!d.en; G.clearing = false;
        if (d.bn && typeof d.bn === 'object') G.banner = { title: String(d.bn.title || '').slice(0, 60), sub: String(d.bn.sub || '').slice(0, 90), t: Math.min(4, +d.bn.t || 2) };
        vsRespawn();
        onWaveStart(G.wave);
        if (G.wave === 20) v.behind20 = v.banked + v.risk < (o.banked || 0) + (o.risk || 0);
        if (G.state === 'shop' || G.state === 'vsdecide') { G.state = 'playing'; ui.overlay.hidden = true; }
        SFX.wave();
        break;
      case 'v.wc': if (v.role === 'guest' && G.state === 'playing') vsWaveCleared(); break;
      case 'v.wipe':
        // clear the yard quietly, so the hostiles don't look like they were all killed
        if (v.role === 'guest') { G.enemies = []; G.shots = []; G.pickups = []; v.wiped = true; }
        break;
      case 'v.bn':
        if (v.role === 'guest' && d.b && typeof d.b === 'object') G.banner = { title: String(d.b.title || '').slice(0, 60), sub: String(d.b.sub || '').slice(0, 90), t: Math.min(4, +d.b.t || 2) };
        break;
      case 'v.rd':

        }
        break;

  function vsMsg(code, d) {
    const L = FR.lobby, nm = (friends[code] && friends[code].name) || 'Your friend';
    switch (d.t) {
      case 'v.ch':
        if (vsBusy() || FR.invite) { frSend(code, { t: 'v.busy' }); break; }
        FR.invite = { code, name: cleanName(d.name) || nm };
        frToast(); SFX.wave();
        break;
      case 'v.acc':
        if (L && L.code === code && L.status === 'waiting') { L.status = 'lobby'; showOverlay('lobby'); }
        break;
      case 'v.dec': case 'v.busy':
        if (L && L.code === code && L.status === 'waiting') {
          FR.lobby = null;
          FR.note = d.t === 'v.dec' ? `${nm} declined your challenge.` : `${nm} is busy right now.`;
          boardFrom = 'title'; showOverlay('friends');
        }
        break;
      case 'v.leave':
        if (L && L.code === code) { FR.lobby = null; FR.note = `${nm} left the lobby.`; boardFrom = 'title'; showOverlay('friends'); }
        if (FR.invite && FR.invite.code === code) { FR.invite = null; frToast(); }
        break;
      case 'v.rdy':
        if (L && L.code === code) { L.oppReady = !!d.r; showOverlay('lobby'); vsMaybeGo(); }
        break;
      case 'v.go':
        if (L && L.code === code && L.role === 'guest') startVersus('guest', code, d.d === 'arcane' ? 'arcane' : 'normal');
        break;
      case 'v.ld':
        if (L && L.code === code && L.role === 'guest') { L.diff = d.d === 'arcane' ? 'arcane' : 'normal'; showOverlay('lobby'); }
        break;
      case 'v.ci': case 'v.ca': case 'v.cd': case 'v.cl': case 'v.cr': case 'v.cx': case 'v.cg':
        coMsg(code, d, nm);
        break;
      default: {
        const v = G.vs;
        if (!v || v.over) break;
        if (v.coop && v.role === 'host' ? v.peers.some(o => o.code === code && !o.gone) : v.code === code) vsGame(d, code);
      }
    }
  }

  // ---------- co-op: 2 to 4 friends hold the yard together; the host's game runs the world, like in versus ----------
  // FR.co is the lobby: { role, host, members: [{ code, name, ready, arc }], invited: { code: name }, diff, note }
  const CO_MAX = 4;
  const COOP_SPOTS = [[-150, 0], [150, 0], [0, -130], [0, 130]];
  function vsSpot() {
    const v = G.vs;
    if (!v.coop) return spawnSpot(v.role);
    const s = COOP_SPOTS[v.slot % CO_MAX];
    return { x: W / 2 + s[0], y: H / 2 + s[1] };
  }
  const coShow = () => { if (FR.co && G.state === 'title') showOverlay('colobby'); };
  const coArcaneOk = () => !!FR.co && FR.co.members.every(x => x.arc);
  function coOpen() {
    if (vsBusy()) return;
    FR.co = { role: 'host', host: me.code, members: [{ code: me.code, name: me.name || 'Player', ready: false, arc: arcaneUnlocked() }], invited: {}, diff: 'normal', note: '' };
    boardFrom = 'title';
    showOverlay('colobby');
  }
  // the host tells everyone in the lobby who's in, who's ready and the difficulty
  function coSync() {
    const L = FR.co;
    if (!L || L.role !== 'host') return;
    if (L.diff === 'arcane' && !coArcaneOk()) L.diff = 'normal';
    const msg = { t: 'v.cl', d: L.diff, m: L.members.map(x => [x.code, x.name, x.ready ? 1 : 0, x.arc ? 1 : 0]) };
    for (const x of L.members) if (x.code !== me.code) frSend(x.code, msg);
  }
  function coInvite(code) {
    const L = FR.co;
    if (!L || L.role !== 'host' || !friends[code] || !isOnline(code) || L.members.some(x => x.code === code) || L.invited[code]) return;
    if (L.members.length + Object.keys(L.invited).length >= CO_MAX) { L.note = 'The squad is full: 4 players at most.'; coShow(); return; }
    L.invited[code] = friends[code].name || 'Player';
    L.note = '';
    frSend(code, { t: 'v.ci', name: me.name || 'Player' });
    coShow();
  }
  function coSetDiff(d) {
    const L = FR.co;
    if (!L || L.role !== 'host' || (d === 'arcane' && !coArcaneOk())) return;
    L.diff = d;
    coSync(); coShow();

    else if (d) { pad.navT -= dt; if (pad.navT <= 0) { pad.navT = 0.12; padNav(d, list); } }
    if (pad.ry) ui.overlay.scrollBy(0, pad.ry * 900 * dt);
  }
  function padTargets() {
    const sel = 'button:not([disabled]), input[type=range], summary';
    const els = [...ui.overlay.querySelectorAll(sel)];
    const t = $('toast');
    if (!t.hidden) els.push(...t.querySelectorAll(sel));
    return els.filter(el => el.getClientRects().length);
  }
  // remembers which button you were on, so it can be found again after the screen redraws
  function padKey(el) {
    const s = el.dataset || {};
    return [el.id, s.act, s.fr, s.id, s.tab, s.d, s.gun, s.melee, s.code].join('|');
  }
  function padDefault(list) {
    return list.find(el => padKey(el) === pad.key) || list.find(el => el === document.activeElement)
      || list.find(el => el.classList.contains('cta')) || list[0] || null;
  }
  function padFocus(el) {
    if (pad.focus && pad.focus !== el) pad.focus.classList.remove('padfocus');
    pad.focus = el;
    if (!el) return;
    pad.key = padKey(el);
    el.classList.add('padfocus');
    el.focus({ preventScroll: true });
    el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
  function padNav(d, list) {
    const cur = pad.focus;
    if (!cur) return;
    if (cur.type === 'range' && (d === 'l' || d === 'r')) {
      const v = clamp((parseInt(cur.value, 10) || 1) + (d === 'r' ? 1 : -1), +cur.min || 0, +cur.max || 100);
      cur.value = v;
      cur.dispatchEvent(new Event('input', { bubbles: true }));
      return;
    }
    // the nearest button in that direction, favouring ones lined up with this one
    const dx = d === 'r' ? 1 : d === 'l' ? -1 : 0, dy = d === 'd' ? 1 : d === 'u' ? -1 : 0;
    const a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
    let bestEl = null, bestS = Infinity;
    for (const el of list) {
      if (el === cur) continue;
      const b = el.getBoundingClientRect();
      const ex = b.left + b.width / 2, ey = b.top + b.height / 2;
      const along = (ex - ax) * dx + (ey - ay) * dy;
      if (along <= 4) continue;
      // gaps between the edges, so wide things like the wave slider count as lined up
      const gap = dy ? Math.max(0, dy > 0 ? b.top - a.bottom : a.top - b.bottom) : Math.max(0, dx > 0 ? b.left - a.right : a.left - b.right);
      const side = dy ? Math.max(0, b.left - a.right, a.left - b.right) : Math.max(0, b.top - a.bottom, a.top - b.bottom);
      // left and right stay on the same row
      if (dx && side > 0) continue;
      const off = dy ? Math.min(Math.abs(ex - ax), Math.abs(b.left - a.left)) : Math.abs(ey - ay);

      if (s < bestS) { bestS = s; bestEl = el; }

    if (bestEl) padFocus(bestEl);
  }
  function padPress() {
    const el = pad.focus;
    if (el && el.isConnected && el.type !== 'range') el.click();
  }
  function padBack() {
    const b = ui.overlay.querySelector('[data-act=back], [data-act=vsclose], [data-act=resume]');
    if (b && b.getClientRects().length) b.click();
  }
  function rumble(strength, ms) {
    const a = padMode && pad.gp && pad.gp.vibrationActuator;
    if (!a || !a.playEffect) return;
    try { a.playEffect('dual-rumble', { duration: ms, strongMagnitude: strength, weakMagnitude: strength }).catch(() => {}); } catch (err) {}
  }
  function padNote(text) {
    const n = $('padNote');
    n.textContent = text; n.hidden = false;
    clearTimeout(padNote.t);
    padNote.t = setTimeout(() => { n.hidden = true; }, 3000);
  }
  addEventListener('gamepadconnected', () => padNote('Controller connected · press any button to use it'));
  addEventListener('gamepaddisconnected', () => {
    padNote('Controller disconnected');

  });

  // ---------- view ----------
  let vw = 0, vh = 0, scale = 1, dpr = 1;
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    vw = innerWidth; vh = innerHeight;
    cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
    cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
    scale = clamp(Math.min(vw, vh) / 720, 0.55, 1);
  }
  addEventListener('resize', resize);
  resize();
  function cam() {
    // while you're down in co-op the camera follows a squadmate who's still standing
    let p = G.player;
    if (p.dead && isCoop()) p = G.vs.peers.find(o => !o.gone && !o.dead && o.seen0) || p;
    const viewW = vw / scale, viewH = vh / scale;
    return {
      x: viewW >= W ? (W - viewW) / 2 : clamp(p.x - viewW / 2, 0, W - viewW),
      y: viewH >= H ? (H - viewH) / 2 : clamp(p.y - viewH / 2, 0, H - viewH)
    };
  }

  // ---------- game logic ----------
  function addPart(o) { G.parts.push(o); if (G.parts.length > 500) G.parts.shift(); }
  function blood(x, y, dx, dy, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.atan2(dy, dx) + rand(-0.8, 0.8), s = rand(60, 220);
      addPart({ k: 'blood', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.3, 0.6), max: 0.6, size: rand(1.5, 3.5), drag: 6 });
    }
  }
  function sparks(x, y, dx, dy) {
    for (let i = 0; i < 6; i++) {
      const a = Math.atan2(-dy, -dx) + rand(-1, 1), s = rand(120, 320);
      addPart({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.12, 0.25), max: 0.25, drag: 8 });
    }
  }
  // the burst a hostile makes when you kill it, picked from your cosmetics
  function killFx(x, y, fx, noBlood) {
    if (fx === 'sparks') {
      for (let i = 0; i < 18; i++) { const a = rand(0, Math.PI * 2), s = rand(120, 340); addPart({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.2, 0.45), max: 0.45, drag: 5, color: '#ffd36b' }); }
    } else if (fx === 'smoke') {
      for (let i = 0; i < 9; i++) addPart({ k: 'puff', x: x + rand(-8, 8), y: y + rand(-8, 8), vx: rand(-30, 30), vy: rand(-50, -10), life: rand(0.6, 1), max: 1, drag: 1.5, size: rand(6, 11) });
    } else if (fx === 'confetti') {
      const cols = ['#ff6b6b', '#ffd36b', '#5ee6a0', '#6bb8ff', '#b46bff'];
      for (let i = 0; i < 22; i++) { const a = rand(0, Math.PI * 2), s = rand(80, 260); addPart({ k: 'conf', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.6, 1.1), max: 1.1, drag: 3, rot: rand(0, 6), vr: rand(-12, 12), color: cols[i % cols.length] }); }
    } else if (fx === 'arcane') {
      for (let i = 0; i < 18; i++) { const a = rand(0, Math.PI * 2), s = rand(90, 300); addPart({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.25, 0.55), max: 0.55, drag: 4, color: i % 2 ? '#b46bff' : '#7fd8ff' }); }
      addPart({ k: 'ring', x, y, r: 34, life: 0.4, max: 0.4, vx: 0, vy: 0, drag: 0, color: '#c78bff' });
    } else if (fx === 'ember') {
      for (let i = 0; i < 16; i++) { const a = rand(0, Math.PI * 2), s = rand(40, 140); addPart({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: rand(0.5, 0.9), max: 0.9, drag: 2, color: i % 2 ? '#ff9a3c' : '#ff5a3c' }); }
      addPart({ k: 'ring', x, y, r: 30, life: 0.35, max: 0.35, vx: 0, vy: 0, drag: 0, color: '#ff7a3c' });
    }
    if (!noBlood || fx !== 'blood') blood(x, y, rand(-1, 1), rand(-1, 1), fx === 'blood' ? 14 : 5);
  }
  function floatText(x, y, text, color) {
    addPart({ k: 'text', x, y, vx: 0, vy: -40, life: 1, max: 1, text, color, drag: 0 });
  }
  // tells you once in a while that this hostile ignores what you're hitting it with
  function immuneTip(e, text) {
    if (e.tip > 0) return;
    e.tip = 1.2;
    floatText(e.x, e.y - e.r - 8, text, '#9fd3ff');
  }

  function tryReload() {
    const p = G.player;
    if (G.state !== 'playing' || p.melee || p.reload > 0 || p.mag === magSize() || p.res === 0) return;
    p.reload = reloadTime();
    SFX.reload();
  }

  function swapWeapon() {
    const p = G.player;
    if (G.state !== 'playing') return;
    if (p.melee) {
      if (p.mag + p.res === 0) { floatText(p.x, p.y - 26, 'No ammo', '#d8453a'); SFX.dry(); return; }
      p.melee = false;
    } else { p.melee = true; p.reload = 0; }
    p.cool = 0.2; p.swing = 0;
    SFX.swap();
  }

  const meleeDmg = () => meleeDef().dmg * (1 + lvl('dmg')) * (1 + 0.35 * lvl('k_edge')) * overdrive() * meleeMastDmg() * radDmg();

  // hits everything in an arc in front of you, and anything standing inside you
  function meleeStrike(arc, range, dmg) {
    const p = G.player, m = meleeDef();
    const fx = { bleed: lvl('x_mbleed'), stun: 0.25 * lvl('x_bstun') };
    let hits = 0;
    for (const e of G.enemies) {
      if (e.dead || e.flying) continue;
      const dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy);
      if (d > range + e.r) continue;
      let da = Math.atan2(dy, dx) - p.a;
      da = Math.atan2(Math.sin(da), Math.cos(da));
      if (Math.abs(da) > arc / 2 && d > e.r + p.r) continue;
      if (meleeProof(e)) { sparks(e.x, e.y, dx, dy); immuneTip(e, 'GUNS ONLY'); continue; }
      const crit = Math.random() < critChance();
      damage(e, { vx: dx || 0.01, vy: dy, dmg: crit ? dmg * 2 : dmg, crit, kb: m.kb, melee: true, ...fx });
      hits++;
    }
    // the scythe drinks a little from everything it cuts, capped per swing
    if (m.scythe && hits) p.hp = Math.min(p.maxHp, p.hp + Math.min(2, 0.5 * hits));
    if (G.vs && !G.vs.coop) vsSend({ t: 'v.sw', x: p.x, y: p.y, a: p.a, arc, r: range, d: dmg, bl: fx.bleed });
    return hits;
  }

  // thrown knives, slash waves and crescents fly like bullets but count as melee
  function meleeShot(k, speed, life, dmg, pierce) {
    const p = G.player, ca = Math.cos(p.a), sa = Math.sin(p.a), x = p.x + ca * 18, y = p.y + sa * 18;
    G.bullets.push({ x, y, px: x, py: y, vx: ca * speed, vy: sa * speed, life, dmg, pierce, hits: [], w: 3, melee: true, k });
  }

  function shockwave(x, y, max, dmg) {
    G.waves.push({ x, y, r: 8, max, dmg, hit: [], kills: 0 });
    if (G.vs && !G.vs.coop) vsSend({ t: 'v.wv', x, y, max, d: dmg });
    if (!reduceMotion) G.shake = Math.min(14, G.shake + max / 30);
    SFX.boom();
  }

  function deflect(arc, range, dmg) {
    const p = G.player;
    for (let i = G.shots.length - 1; i >= 0; i--) {
      const s = G.shots[i];
      if (s.k !== 'orb') continue;
      const dx = s.x - p.x, dy = s.y - p.y;
      if (Math.hypot(dx, dy) > range + s.r) continue;
      let da = Math.atan2(dy, dx) - p.a;
      da = Math.atan2(Math.sin(da), Math.cos(da));
      if (Math.abs(da) > arc / 2) continue;
      G.shots.splice(i, 1);
      sparks(s.x, s.y, -dx, -dy);
      if (lvl('x_bdeflect') >= 2) {
        G.bullets.push({ x: s.x, y: s.y, px: s.x, py: s.y, vx: Math.cos(p.a) * 700, vy: Math.sin(p.a) * 700,
          life: 1, dmg: dmg * 0.6, pierce: 0, hits: [], w: 3, melee: true, k: 'ball' });
      }
    }
  }

  function swing() {
    const p = G.player, m = meleeDef();
    p.cool = meleeRate(); p.swing = swingTime(); p.swingDir = -(p.swingDir || 1); p.prot = 0;
    let dmg = meleeDmg();
    if (lvl('x_kflurry')) {
      p.stabN = (p.stabN || 0) + 1;
      if (p.stabN % 3 === 0) dmg *= 1.5 + 0.5 * lvl('x_kflurry');
    }
    if (lvl('x_tiaido') && (p.idle || 0) >= 1.2) { dmg *= 1.5 + 0.5 * lvl('x_tiaido'); floatText(p.x, p.y - 26, 'IAIDO', '#ffe2a0'); }
    p.idle = 0;
    const range = meleeRange(), hits = meleeStrike(m.arc, range, dmg);
    const ca = Math.cos(p.a), sa = Math.sin(p.a);
    if (lvl('x_mwave')) meleeShot('slash', 620, 0.35, dmg * (0.5 + 0.15 * lvl('x_mwave')), 3);
    if (lvl('x_ymoon')) meleeShot('moon', 520, 0.6, dmg * (0.4 + 0.2 * lvl('x_ymoon')), 4);
    if (lvl('x_safter') && hits) shockwave(p.x + ca * range * 0.6, p.y + sa * range * 0.6, 60 + 20 * lvl('x_safter'), dmg * 0.4);
    if (lvl('x_bdeflect')) deflect(m.arc, range, dmg);

  }

  // melee specials, unlocked by each weapon's mastery upgrade
  const SPECIALS = {

    katana: { up: 'x_tdash', name: 'Dash slash', cd: l => 3 - 0.5 * l, run: l => dashSlash(l) },
    sledge: { up: 'x_spound', name: 'Ground pound', cd: l => 4.5 - 0.5 * l,
      run: l => { const p = G.player; p.swing = swingTime(); shockwave(p.x, p.y, 180 + 30 * l, meleeDmg() * (0.9 + 0.2 * l)); } },
    scythe: { up: 'x_yspin', name: 'Reaping spin', cd: l => 3 - 0.4 * l,
      run: l => { G.player.spinFx = 0.3; meleeStrike(Math.PI * 2, meleeRange() * 1.2, meleeDmg() * (1.2 + 0.15 * l)); SFX.swing(); } }
  };
  const specialDef = () => { const s = SPECIALS[G.melee]; return s && lvl(s.up) ? s : null; };
  function special() {
    const p = G.player, s = specialDef();

    p.prot = 0;
    s.run(lvl(s.up));

  }

  function dashSlash(l) {
    const p = G.player, m = meleeDef(), ca = Math.cos(p.a), sa = Math.sin(p.a), x0 = p.x, y0 = p.y;
    let x = p.x, y = p.y;
    for (let i = 0; i < 16; i++) {
      const nx = clamp(x + ca * 11, p.r, W - p.r), ny = clamp(y + sa * 11, p.r, H - p.r);
      if (blocked(nx, ny, p.r)) break;
      x = nx; y = ny;
      if (i % 3 === 0) addPart({ k: 'ring', x, y, r: 18, life: 0.25, max: 0.25, vx: 0, vy: 0, drag: 0, color: '#ffe2a0' });
    }
    const dmg = meleeDmg() * (1.6 + 0.4 * l), sx = x - x0, sy = y - y0, len2 = sx * sx + sy * sy || 1;
    for (const e of G.enemies) {
      if (e.dead || e.flying) continue;
      const t = clamp(((e.x - x0) * sx + (e.y - y0) * sy) / len2, 0, 1);
      if (Math.hypot(e.x - (x0 + sx * t), e.y - (y0 + sy * t)) > e.r + p.r + 14) continue;
      if (meleeProof(e)) { immuneTip(e, 'GUNS ONLY'); continue; }
