    }
    const saved = kind === 'title' ? loadRun() : null;
    if (kind === 'board') {
      o.innerHTML = `<div class="brief wide">
        <p class="eyebrow">Hall of fame</p>
        <h1>Leaderboard</h1>
        <div class="tabs" role="tablist">
          <button type="button" class="tab" role="tab" data-act="btab" data-tab="global" aria-selected="${boardTab === 'global'}">Global</button>
          <button type="button" class="tab" role="tab" data-act="btab" data-tab="friends" aria-selected="${boardTab === 'friends'}">Friends</button>
          <button type="button" class="tab" role="tab" data-act="btab" data-tab="local" aria-selected="${boardTab === 'local'}">This device</button>
        </div>
        <div id="boardBody"><p class="note">Loading…</p></div>
        <p class="note">Global shows each player’s best run. Scores post when a run ends.</p>
        <div class="actions"><button type="button" class="cta" data-act="back">Back</button></div>
      </div>`;
      o.hidden = false;
      fillBoard();
      return;
    }
    if (kind === 'title') {
      o.innerHTML = `<div class="brief">
        <p class="eyebrow">Mission briefing · Sector 7</p>
        <h1>Night Ops</h1>
        <p class="lede">Hold landing zone LZ-7 for 30 waves. Hostiles come over every wall of the yard, and some of them shoot back. Every third wave is a one-on-one fight with a boss hog, and the biggest one waits at wave 30. Bosses hit straight through armor plates. Spend your points on upgrades between waves. In Endless the waves never stop, and the bosses come back stronger every lap.</p>
        ${KEYS_HTML}
        ${masteryHtml(PLAYER_KEY, PLAYER_PERKS, PRANKS, 'Player rank')}
        ${loadoutHtml()}
        <div class="startpick">
          <label class="label" for="startWave">Starting wave</label>
          <div class="row"><input type="range" id="startWave" min="1" max="30" step="1" value="${startSel}"><b id="startWaveNum">${startSel}</b></div>
          <p class="note" id="startWaveNote">${startNote(startSel)}</p>
        </div>
        ${saved ? `<div class="wallet"><span class="label">Saved run · wave ${saved.wave}${saved.endless ? ' · Endless' : ''} · ${(GUN[saved.gun] || GUNS[0]).name}</span><b>${saved.score.toLocaleString()}</b></div>` : ''}
        <div class="actions">
          ${saved ? '<button type="button" class="cta" data-act="resumerun">Continue run</button>' : ''}
          <button type="button" class="${saved ? 'ghost' : 'cta'}" data-act="start">${saved ? 'New run' : 'Deploy'}</button>
          <button type="button" class="ghost" data-act="endless">Endless</button>
          <button type="button" class="ghost" data-act="board">Leaderboard</button>
          <button type="button" class="ghost" data-act="friends">Friends${Object.keys(FR.pending).length ? ` (${Object.keys(FR.pending).length})` : ''}</button>
          <button type="button" class="ghost" data-act="transfer">Transfer progress</button>
        </div>
        ${saved ? '<p class="note">Starting a new run replaces your saved one.</p>' : ''}
        ${best ? `<p class="note">Best score on this device: ${best.toLocaleString()}</p>` : ''}
      </div>`;
    } else if (kind === 'over') {
      const isBest = G.score > 0 && G.score >= best;
      o.innerHTML = `<div class="brief">
        <p class="eyebrow">Status: KIA${G.endless ? ' · Endless' : ''}</p>
        <h1>Mission failed</h1>
        <div class="stats">
          <div><span class="label">Wave reached</span><b>${G.wave}</b></div>
          <div><span class="label">Hostiles down</span><b>${G.kills}</b></div>
          <div><span class="label">Score</span><b class="${isBest ? 'newbest' : ''}">${G.score.toLocaleString()}</b></div>
          <div><span class="label">${isBest ? 'New best' : 'Best'}</span><b>${best.toLocaleString()}</b></div>
        </div>
        ${xpLine()}
        ${loadoutHtml()}
        <div class="actions">
          <button type="button" class="cta" data-act="${G.endless ? 'endless' : 'start'}">Redeploy</button>
          <button type="button" class="ghost" data-act="board">Leaderboard</button>
          <button type="button" class="ghost" data-act="quit">Main menu</button>
        </div>
      </div>`;
    } else if (kind === 'won') {
      o.innerHTML = `<div class="brief">
        <p class="eyebrow">Wave 30 cleared · Dawn at LZ-7</p>
        <h1>Mission complete</h1>
        <p class="lede">Pigmageddon is down and the yard is quiet. You held the landing zone through all 30 waves.</p>
        <div class="stats">
          <div><span class="label">Hostiles down</span><b>${G.kills}</b></div>
          <div><span class="label">Score</span><b class="newbest">${G.score.toLocaleString()}</b></div>
        </div>
        ${xpLine()}
        <div class="actions">
          <button type="button" class="cta" data-act="continue">Keep going</button>
          <button type="button" class="ghost" data-act="start">Play again</button>
          <button type="button" class="ghost" data-act="board">Leaderboard</button>
          <button type="button" class="ghost" data-act="quit">Main menu</button>
        </div>
      </div>`;
    } else if (kind === 'shop') {
      o.innerHTML = shopHtml();
    } else if (kind === 'paused') {
      o.innerHTML = `<div class="brief">
        <p class="eyebrow">Wave ${G.wave} · ${G.score.toLocaleString()} points</p>
        <h1>Paused</h1>
        ${KEYS_HTML}
        ${masteryHtml(PLAYER_KEY, PLAYER_PERKS, PRANKS, 'Player rank')}
        ${masteryHtml(G.gun, gunPerks(gunDef()))}
        ${masteryHtml(G.melee, meleePerks(meleeDef()))}
        <div class="actions">
          <button type="button" class="cta" data-act="resume">Resume</button>
          <button type="button" class="ghost" data-act="savequit">Save &amp; quit</button>
          <button type="button" class="ghost" data-act="abandon">Abandon mission</button>
        </div>
        <p class="note">Your run is saved on this device, so you can continue it later from the main menu.</p>
      </div>`;
    }
    o.hidden = false;
    const btn = o.querySelector('.cta');
    if (btn && !touchMode) btn.focus({ preventScroll: true });
  }
  ui.overlay.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    initAudio();
    const act = b.dataset.act;
    if (act === 'start') startGame(false);
    else if (act === 'endless') startGame(true);
    else if (act === 'continue') { if (G.state === 'won') { G.endless = true; openShop(); } }
    else if (act === 'resume') resume();
    else if (act === 'next') closeShop();
    else if (act === 'tab') {
      shopTab = b.dataset.tab;
      showOverlay('shop');
      const again = ui.overlay.querySelector(`[data-tab="${shopTab}"]`);
      if (again) again.focus({ preventScroll: true });
    }
    else if (act === 'gun') {
      chosenGun = b.dataset.gun;
      try { localStorage.setItem('nightops-gun', chosenGun); } catch (err) {}
      if (G.state === 'title') G = freshState(chosenGun);
      showOverlay(G.state);
      const again = ui.overlay.querySelector(`[data-gun="${chosenGun}"]`);
      if (again) again.focus({ preventScroll: true });
    }
    else if (act === 'melee') {
      chosenMelee = b.dataset.melee;
      try { localStorage.setItem('nightops-melee', chosenMelee); } catch (err) {}
      if (G.state === 'title') G = freshState(chosenGun);
      showOverlay(G.state);
      const again = ui.overlay.querySelector(`[data-melee="${chosenMelee}"]`);
      if (again) again.focus({ preventScroll: true });
    }
    else if (act === 'buy') {
      const id = b.dataset.id;
      if (buy(id)) {
        showOverlay('shop');
        const again = ui.overlay.querySelector(`[data-id="${id}"]`);
        if (again && !again.disabled) again.focus({ preventScroll: true });
      }
    }
    else if (act === 'board') { if (G.state !== 'title' && G.state !== 'over' && G.state !== 'won') return; boardFrom = G.state; showOverlay('board'); }
    else if (act === 'friends') { if (G.state !== 'title') return; boardFrom = 'title'; FR.note = ''; showOverlay('friends'); }
    else if (act === 'transfer') { if (G.state !== 'title') return; boardFrom = 'title'; showOverlay('transfer'); }
    else if (act === 'mkcode') {
      const out = $('tfOut'), note = $('tfNote');
      out.value = progressCode(); out.hidden = false; out.focus(); out.select();
      const say = m => { note.textContent = m; };
      try { navigator.clipboard.writeText(out.value).then(() => say('Progress code copied. Paste it into the other copy of the game.'), () => say('Press Ctrl+C to copy the selected code.')); }
      catch (err) { say('Press Ctrl+C to copy the selected code.'); }
    }
    else if (act === 'import') {
      const note = $('tfNote');
      try {
        importProgress($('tfIn').value);
        G = freshState(chosenGun);
        note.textContent = `Progress imported. You’re now ${PRANKS[pRank()].name} rank with a best score of ${best.toLocaleString()}.`;
        $('tfIn').value = '';
      } catch (err) { note.textContent = 'That progress code didn’t work. Make sure you copied all of it.'; }
    }
    else if (act === 'back') showOverlay(boardFrom);
    else if (act === 'btab') { boardTab = b.dataset.tab; showOverlay('board'); }
    else if (act === 'resumerun') { const d = loadRun(); if (d) { G = normalize(d); paintFloor(); showOverlay(G.state); } }
    else if (act === 'savequit') { saveMastery(); saveRun(); G = freshState(chosenGun); paintFloor(); showOverlay('title'); }
    else if (act === 'abandon') { saveMastery(); clearRun(); G = freshState(chosenGun); paintFloor(); showOverlay('title'); }
    else if (act === 'quit') { saveMastery(); G = freshState(chosenGun); paintFloor(); showOverlay('title'); }
  });
  ui.pause.addEventListener('click', () => { initAudio(); togglePause(); });
  ui.mute.addEventListener('click', () => { initAudio(); toggleMute(); });
  ui.reload.addEventListener('click', () => tryReload());
  ui.swap.addEventListener('click', () => swapWeapon());
  ui.specialBtn.addEventListener('click', () => special());

  function startGame(endless) {
    initAudio();
    clearRun();
    G = freshState(chosenGun);
    G.endless = !!endless;
    G.state = 'playing';
    paintFloor();
    ui.overlay.hidden = true;
    mouse.down = false;
    const s = clamp(startSel, 1, 30);
    G.bonus = pRank() >= 2 ? 50 : 0;
    if (s > 1) { G.wave = s - 1; G.bonus += startBonus(s); G.prep = true; openShop(); }
    else startWave(1);
  }
  let shopTab = 'gun';
  function shopHtml() {
    const p = G.player, pts = G.score + (G.bonus || 0) - G.spent;
    const g = gunDef();
    const upCard = u => {
      const max = maxOf(u), l = Math.min(lvl(u.id), max), maxed = l >= max, c = u.base * (l + 1);
      const pips = Array.from({ length: max }, (_, i) => `<i class="${i < l ? 'on' : ''}"></i>`).join('');
      const detail = maxed ? `${u.label} ${u.val(l)}` : `${u.label} ${u.val(l)} → ${u.val(l + 1)}`;
      return `<div class="card${maxed ? ' maxed' : ''}">
        <div class="info"><div class="card-top"><b>${u.name}</b><span class="lvl">LV ${l}/${max}</span></div><span class="note">${detail}</span></div>
        <span class="pips">${pips}</span>
        <button type="button" class="buy" data-act="buy" data-id="${u.id}" ${maxed || pts < c ? 'disabled' : ''}>${maxed ? 'Maxed' : c + ' pts'}</button></div>`;
    };
    const supCard = s => {
      const full = s.id === 'heal' && p.hp >= p.maxHp;
      const detail = s.id === 'heal' ? `${s.desc} (${Math.ceil(p.hp)}/${p.maxHp})` : `+${rounds(48)} rounds (${p.res} in reserve)`;
      return `<div class="card"><div class="info"><b>${s.name}</b><span class="note">${detail}</span></div>
        <button type="button" class="buy" data-act="buy" data-id="${s.id}" ${full || pts < s.cost ? 'disabled' : ''}>${full ? 'Full' : s.cost + ' pts'}</button></div>`;
    };
    const TABS = [
      { id: 'gun', name: g.name, hint: `Signature upgrades for your ${g.name.toLowerCase()} · ${RANKS[gunRank()].name} mastery.`, html: () => gunUps().map(upCard).join('') },
      { id: 'melee', name: 'Melee', hint: `Works with your ${meleeDef().name.toLowerCase()} · ${RANKS[meleeRank()].name} mastery.`, html: () => meleeUps().map(upCard).join('') },
      { id: 'gear', name: 'Gear', hint: 'Max levels depend on your gun.', html: () => UPGRADES.concat(playerUps()).map(upCard).join('') },
      { id: 'supplies', name: 'Supplies', hint: 'One-off top-ups. Buy as many as you can afford.', html: () => SUPPLIES.map(supCard).join('') }
    ];
    const tab = TABS.find(t => t.id === shopTab) || TABS[0];
    const tabs = TABS.map(t => `<button type="button" class="tab" role="tab" data-act="tab" data-tab="${t.id}" aria-selected="${t.id === tab.id}">${t.name}</button>`).join('');
    return `<div class="brief wide">
      <p class="eyebrow">${G.prep ? 'Starting kit' : `Wave ${G.wave} cleared`} · Armory</p>
      <h1>Upgrades</h1>
      <div class="wallet"><span class="label">Points to spend</span><b>${pts.toLocaleString()}</b></div>
      <div class="tabs" role="tablist">${tabs}</div>
      <p class="note">${tab.hint} Buying doesn't lower your score.</p>
      <div class="cards">${tab.html()}</div>
      <div class="actions"><button type="button" class="cta" data-act="next">Start wave ${G.wave + 1}</button></div>
    </div>`;
  }
  function buy(id) {
    const p = G.player, pts = G.score + (G.bonus || 0) - G.spent;
    const u = UPGRADES.find(x => x.id === id) || playerUps().find(x => x.id === id) || meleeUps().find(x => x.id === id) || gunUps().find(x => x.id === id);
    if (u) {
      const l = lvl(id), c = u.base * (l + 1);
      if (l >= maxOf(u) || pts < c) return false;
      G.spent += c; G.up[id] = l + 1;
      if (id === 'hp') { p.maxHp += 25; p.hp += 25; }
    } else {
      const s = SUPPLIES.find(x => x.id === id);
      if (!s || pts < s.cost) return false;
      if (id === 'heal') { if (p.hp >= p.maxHp) return false; p.hp = p.maxHp; }
      else p.res += rounds(48);
      G.spent += s.cost;
    }
    SFX.pickup();
    return true;
  }
  function openShop() { saveMastery(); G.state = 'shop'; G.shots = []; mouse.down = false; saveRun(); showOverlay('shop'); }
  function closeShop() { if (G.state !== 'shop') return; G.state = 'playing'; G.prep = false; ui.overlay.hidden = true; startWave(G.wave + 1); }

  function pause() { if (G.state !== 'playing') return; saveMastery(); G.state = 'paused'; saveRun(); mouse.down = false; showOverlay('paused'); }
  function resume() { if (G.state !== 'paused') return; G.state = 'playing'; ui.overlay.hidden = true; }
  function togglePause() { if (G.state === 'playing') pause(); else if (G.state === 'paused') resume(); }
  function win() {
    G.state = 'won';
    mouse.down = false;
    saveMastery(); clearRun(); submitRun();
    if (G.score > best) { best = G.score; saveBest(); }
    showOverlay('won');
  }
  function gameOver() {
    G.state = 'over';
    mouse.down = false;
    saveMastery(); clearRun(); submitRun();
    if (G.score > best) { best = G.score; saveBest(); }
    showOverlay('over');
  }

  // ---------- loop ----------
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (G.state === 'playing') {
      acc += dt;
      while (acc >= STEP && G.state === 'playing') { update(STEP); acc -= STEP; }
    } else {
      acc = 0;
      if (G.state === 'title') updateAim();
    }
    render(now);
    syncHud();
    requestAnimationFrame(frame);
  }

  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => JSON.parse(JSON.stringify(G)));
  // fills in anything an older saved state is missing, and never resumes straight into action
  function normalize(d) {
    if (!d.up) { d.up = { dmg: 0, rate: 0, mag: 0, reload: 0, hp: 0, speed: 0 }; d.spent = 0; d.player.maxHp = 100; }
    if (!d.shots) d.shots = [];
    if (!d.gun) d.gun = 'carbine';
    if (!d.melee) d.melee = MELEE[0].id;
    if (!d.waves) d.waves = [];
    if (!d.xpRun) d.xpRun = {};
    if (d.state === 'playing') d.state = 'paused';
    return d;
  }
  function start(data) {
    if (data && data.player && Array.isArray(data.enemies)) G = normalize(data);
    if (G.state === 'title') showOverlay('title');
    else if (G.state === 'paused') showOverlay('paused');
    else if (G.state === 'over') showOverlay('over');
    else if (G.state === 'shop') showOverlay('shop');
    else if (G.state === 'won') showOverlay('won');
    frStart();
    requestAnimationFrame(frame);
  }
  if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start(hot && hot.data ? hot.data : {});
})();
</script>

</body></html>
